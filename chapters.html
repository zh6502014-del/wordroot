<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>章節學習 — WordRoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#c8f060;--accent2:#60c8f0;--red:#f06464;--orange:#f0a060;
  --bg:#0e0f11;--surface:#16181c;--surface2:#1e2026;
  --border:#2a2d35;--text:#e8eaf0;--muted:#6b7080;--dim:#3a3f50;
  --serif:'DM Serif Display',serif;--mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
@keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ── Header ── */
#header{
  padding:16px 20px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--border);position:sticky;top:0;
  z-index:50;background:var(--bg);
}
.back-btn{color:var(--muted);font-size:20px;text-decoration:none;padding:4px 6px;border-radius:6px}
.back-btn:hover{color:var(--text)}
#headerTitle{font-family:var(--serif);font-size:20px;color:var(--text);flex:1}
#headerSub{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* ── Screen ── */
#screen{flex:1;overflow-y:auto}

/* ── Level banner ── */
.level-banner{
  margin:20px 20px 0;
  background:linear-gradient(135deg,rgba(200,240,96,.07),rgba(96,200,240,.04));
  border:1px solid rgba(200,240,96,.15);border-radius:16px;padding:18px 20px;
}
.level-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.level-badge{
  font-family:var(--serif);font-size:28px;color:var(--accent);
  background:rgba(200,240,96,.08);border:1px solid rgba(200,240,96,.2);
  border-radius:10px;padding:4px 14px;white-space:nowrap;
}
.level-info{flex:1}
.level-name{font-family:var(--serif);font-size:18px;color:var(--text)}
.level-sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
.xp-bar-wrap{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.xp-bar{height:100%;background:var(--accent);border-radius:3px;transition:width .6s}
.xp-label{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:5px}

/* ── Section title ── */
.sec-title{
  font-family:var(--mono);font-size:13px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;
  padding:20px 20px 8px;
}

/* ── Chapter card ── */
.ch-card{
  margin:0 20px 12px;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;
  overflow:hidden;transition:border-color .18s;
}
.ch-card.active{border-color:rgba(200,240,96,.3)}
.ch-card.locked{opacity:.45}
.ch-card-top{
  padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;
}
.ch-card.locked .ch-card-top{cursor:default}
.ch-num{
  font-family:var(--mono);font-size:13px;color:var(--dim);
  background:var(--surface2);border-radius:6px;padding:3px 9px;white-space:nowrap;
  min-width:56px;text-align:center;
}
.ch-num.active{color:var(--accent);background:rgba(200,240,96,.08);border:1px solid rgba(200,240,96,.15)}
.ch-info{flex:1}
.ch-title{font-family:var(--serif);font-size:18px;color:var(--text)}
.ch-words{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:2px}
.ch-stars{font-size:18px;letter-spacing:2px}
.ch-lock{font-size:22px;color:var(--dim)}

.ch-actions{
  padding:0 18px 16px;display:flex;gap:8px;
}
.btn-learn{
  flex:1;padding:10px;border-radius:10px;
  border:1px solid rgba(200,240,96,.3);background:rgba(200,240,96,.06);
  color:var(--accent);font-family:var(--sans);font-size:15px;cursor:pointer;
  transition:all .15s;
}
.btn-learn:hover{background:rgba(200,240,96,.12)}
.btn-learn:disabled{opacity:.35;cursor:not-allowed}
.btn-quiz{
  flex:1;padding:10px;border-radius:10px;
  border:1px solid rgba(96,200,240,.3);background:rgba(96,200,240,.06);
  color:var(--accent2);font-family:var(--sans);font-size:15px;cursor:pointer;
  transition:all .15s;
}
.btn-quiz:hover{background:rgba(96,200,240,.12)}
.btn-quiz:disabled{opacity:.35;cursor:not-allowed}
.btn-review{
  flex:1;padding:10px;border-radius:10px;
  border:1px solid rgba(240,160,96,.3);background:rgba(240,160,96,.06);
  color:var(--orange);font-family:var(--sans);font-size:15px;cursor:pointer;
  transition:all .15s;
}
.review-due{
  display:inline-block;font-family:var(--mono);font-size:11px;
  background:rgba(240,160,96,.15);color:var(--orange);
  border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;
}

/* ── Learn / Quiz / Result screens ── */
.screen-wrap{padding:20px 20px 60px}

/* card flip */
.flip-wrap{perspective:1200px;width:100%;aspect-ratio:3/2;cursor:pointer;user-select:none}
.flip-inner{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;transition:transform .45s;
}
.flip-inner.flipped{transform:rotateY(180deg)}
.flip-face{
  position:absolute;inset:0;border-radius:16px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;
}
.flip-front{
  background:var(--surface);border:1px solid var(--border);
  align-items:center;justify-content:center;gap:8px;
}
.flip-back{
  background:#0e1a0f;border:1px solid rgba(200,240,96,.15);
  transform:rotateY(180deg);overflow:hidden;
}
.card-word{font-family:var(--serif);font-size:clamp(32px,8vw,52px);color:var(--accent)}
.card-phonetic{font-family:var(--mono);font-size:15px;color:var(--muted)}
.card-pos{font-family:var(--mono);font-size:13px;color:var(--dim)}

/* progress bar */
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.prog-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.prog-label{font-family:var(--mono);font-size:13px;color:var(--dim);white-space:nowrap}

/* quiz opts */
.quiz-word{font-family:var(--serif);font-size:28px;color:var(--accent2);margin-bottom:4px}
.quiz-q{font-size:16px;color:var(--muted);margin-bottom:18px}
.opt-list{display:flex;flex-direction:column;gap:9px}
.opt{
  padding:13px 16px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface2);font-size:16px;color:var(--text);
  cursor:pointer;transition:all .18s;text-align:left;font-family:var(--sans);
  display:flex;align-items:center;gap:10px;
}
.opt:hover:not(:disabled){border-color:var(--accent2);background:rgba(96,200,240,.06)}
.opt.correct{border-color:var(--accent)!important;background:rgba(200,240,96,.08)!important;color:var(--accent)}
.opt.wrong{border-color:var(--red)!important;background:rgba(240,100,100,.06)!important;color:var(--red)}
.opt:disabled{cursor:default}
.opt-key{font-family:var(--mono);font-size:13px;color:var(--dim);min-width:20px}
.feedback{
  margin-top:12px;padding:11px 14px;border-radius:10px;font-size:14px;line-height:1.7;
}
.feedback.ok{background:rgba(200,240,96,.07);border:1px solid rgba(200,240,96,.2);color:var(--accent)}
.feedback.bad{background:rgba(240,100,100,.06);border:1px solid rgba(240,100,100,.2);color:var(--text)}
.feedback.bad .fb-detail{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.8}

.next-btn{
  width:100%;padding:13px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface2);font-family:var(--sans);font-size:16px;
  color:var(--text);cursor:pointer;margin-top:12px;transition:all .18s;
}
.next-btn:hover{border-color:var(--accent2);color:var(--accent2)}

/* result */
.result-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:28px 24px;text-align:center;margin-bottom:16px;
}
.result-stars{font-size:36px;letter-spacing:6px;margin:12px 0}
.result-score{font-family:var(--serif);font-size:48px;color:var(--accent)}
.result-label{font-family:var(--mono);font-size:14px;color:var(--muted)}
.result-msg{font-size:15px;color:var(--muted);margin-top:8px;line-height:1.7}
.result-next{
  background:var(--surface2);border-radius:10px;
  padding:10px 14px;margin:14px 0;
  font-family:var(--mono);font-size:13px;color:var(--dim);line-height:1.8;
}
.btn-primary{
  width:100%;padding:14px;border-radius:12px;border:none;
  background:var(--accent);color:#0e0f11;font-family:var(--sans);
  font-size:16px;font-weight:700;cursor:pointer;transition:all .18s;
}
.btn-primary:hover{background:#d8ff70}
.btn-secondary{
  width:100%;padding:12px;border-radius:12px;
  border:1px solid var(--border);background:transparent;
  font-family:var(--sans);font-size:15px;color:var(--muted);
  cursor:pointer;margin-top:8px;transition:all .18s;
}
.btn-secondary:hover{color:var(--text);border-color:var(--muted)}

/* back scrollbar hide */
.flip-back-inner{
  flex:1;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;-ms-overflow-style:none;
}
.flip-back-inner::-webkit-scrollbar{display:none}

/* root chips */
.root-chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.root-chip{
  font-family:var(--mono);font-size:12px;
  background:rgba(96,200,240,.07);border:1px solid rgba(96,200,240,.15);
  color:var(--accent2);border-radius:5px;padding:2px 8px;
  display:flex;align-items:center;gap:4px;
}
.root-chip-meaning{color:var(--dim);font-size:11px}
.divider{height:1px;background:var(--border);margin:8px 0}

/* word guide */
.guide-panel{
  margin-top:14px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
}
.guide-head{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 14px;background:transparent;border:0;color:var(--text);
  font-family:var(--sans);font-size:15px;cursor:pointer;
}
.guide-head span:first-child{font-family:var(--serif);font-size:17px;color:var(--accent)}
.guide-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.guide-row{background:var(--surface2);border:1px solid rgba(255,255,255,.04);border-radius:10px;padding:10px 12px}
.guide-label{
  font-family:var(--mono);font-size:11px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;
}
.guide-text{font-size:14px;color:var(--text);line-height:1.65}
.guide-muted{color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <a href="index.html" class="back-btn">←</a>
    <div id="headerTitle">章節學習</div>
    <div id="headerSub"></div>
  </div>
  <div id="screen"></div>
</div>

<script>

// ══════════════════════════════════════════════
// GAMIFICATION ENGINE (shared across pages)
// ══════════════════════════════════════════════
const GAME = {
  KEY: 'wr_gamification',

  load() {
    try { return JSON.parse(localStorage.getItem(this.KEY) || 'null') || this.defaults(); }
    catch { return this.defaults(); }
  },

  defaults() {
    return {
      xp: 0,
      level: 1,
      streak: 0,
      lastLogin: null,
      totalWordsLearned: 0,
      totalQuizCorrect: 0,
      totalQuizAnswered: 0,
      rootsUnlocked: [],
      achievements: [],
    };
  },

  save(g) { localStorage.setItem(this.KEY, JSON.stringify(g)); },

  // XP values
  XP: {
    wordLearned: 5,
    quizCorrect: 10,
    quizWrong: 2,
    chapterPass: 50,
    chapterStar2: 80,
    chapterStar3: 120,
    rootUnlock: 30,
    dailyLogin: 20,
  },

  // Level thresholds
  LEVELS: [
    {lv:1, name:'詞彙學徒', min:0},
    {lv:2, name:'單字探索者', min:200},
    {lv:3, name:'字根獵人', min:600},
    {lv:4, name:'語言武士', min:1500},
    {lv:5, name:'詞彙大師', min:3500},
    {lv:6, name:'字根宗師', min:7000},
  ],

  getLevel(xp) {
    let cur = this.LEVELS[0];
    for (const lv of this.LEVELS) { if (xp >= lv.min) cur = lv; }
    const next = this.LEVELS.find(l => l.min > xp);
    const pct = next ? Math.round((xp - cur.min) / (next.min - cur.min) * 100) : 100;
    return { ...cur, xp, nextMin: next ? next.min : cur.min, nextName: next ? next.name : '—', pct };
  },

  // Check and update daily streak
  checkStreak() {
    const g = this.load();
    const today = new Date().toISOString().slice(0, 10);
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    let xpGained = 0;
    if (g.lastLogin === today) return { g, xpGained: 0, streakChanged: false };
    if (g.lastLogin === yesterday) {
      g.streak++;
    } else if (g.lastLogin !== today) {
      g.streak = g.lastLogin ? 1 : 1;
    }
    g.lastLogin = today;
    xpGained = this.XP.dailyLogin + (g.streak >= 7 ? 30 : g.streak >= 3 ? 10 : 0);
    g.xp += xpGained;
    this.save(g);
    return { g, xpGained, streakChanged: true };
  },

  // Add XP and check achievements
  addXP(type, count = 1) {
    const g = this.load();
    const amount = (this.XP[type] || 0) * count;
    g.xp += amount;
    if (type === 'wordLearned') g.totalWordsLearned += count;
    if (type === 'quizCorrect') g.totalQuizCorrect += count;
    if (type === 'quizWrong' || type === 'quizCorrect') g.totalQuizAnswered += count;
    const newAchievements = this.checkAchievements(g);
    this.save(g);
    return { amount, newAchievements, totalXP: g.xp };
  },

  // Unlock a root
  unlockRoot(rootId) {
    const g = this.load();
    if (g.rootsUnlocked.includes(rootId)) return { alreadyHad: true, amount: 0 };
    g.rootsUnlocked.push(rootId);
    g.xp += this.XP.rootUnlock;
    const newAchievements = this.checkAchievements(g);
    this.save(g);
    return { alreadyHad: false, amount: this.XP.rootUnlock, newAchievements };
  },

  // Achievement definitions
  ACHIEVEMENTS: [
    { id: 'first_word', name: '第一個單字', icon: '🌱', desc: '學習第一個單字', check: g => g.totalWordsLearned >= 1 },
    { id: 'words_50', name: '半百學徒', icon: '📖', desc: '學習 50 個單字', check: g => g.totalWordsLearned >= 50 },
    { id: 'words_200', name: '單字達人', icon: '📚', desc: '學習 200 個單字', check: g => g.totalWordsLearned >= 200 },
    { id: 'quiz_100', name: '測驗達人', icon: '🎯', desc: '答對 100 題', check: g => g.totalQuizCorrect >= 100 },
    { id: 'roots_5', name: '字根收藏者', icon: '🌿', desc: '收集 5 個字根', check: g => g.rootsUnlocked.length >= 5 },
    { id: 'roots_20', name: '字根獵人', icon: '🔍', desc: '收集 20 個字根', check: g => g.rootsUnlocked.length >= 20 },
    { id: 'roots_50', name: '字根宗師', icon: '🏆', desc: '收集 50 個字根', check: g => g.rootsUnlocked.length >= 50 },
    { id: 'streak_3', name: '三天連勝', icon: '🔥', desc: '連續登入 3 天', check: g => g.streak >= 3 },
    { id: 'streak_7', name: '一週不間斷', icon: '⚡', desc: '連續登入 7 天', check: g => g.streak >= 7 },
    { id: 'streak_30', name: '月度冠軍', icon: '👑', desc: '連續登入 30 天', check: g => g.streak >= 30 },
  ],

  checkAchievements(g) {
    const newOnes = [];
    for (const ach of this.ACHIEVEMENTS) {
      if (!g.achievements.includes(ach.id) && ach.check(g)) {
        g.achievements.push(ach.id);
        newOnes.push(ach);
      }
    }
    return newOnes;
  },
};

// ══════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════
const CH_SIZE = 20;
const PASS_LEARN = 100;   // learn just needs completion
const PASS_QUIZ   = 70;   // % to pass first quiz
const PASS_REV1   = 80;   // % to get ⭐⭐
const PASS_REV2   = 90;   // % to get ⭐⭐⭐
const REV1_DAYS   = 3;
const REV2_DAYS   = 7;
const STORAGE_KEY = 'wr_chapters';

// ── XP Toast ──
function showXPToast(lines) {
  const existing = document.getElementById('xp-toast');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.id = 'xp-toast';
  div.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e2026;border:1px solid rgba(200,240,96,.3);border-radius:12px;padding:12px 20px;font-family:var(--mono);font-size:14px;color:var(--accent);z-index:200;text-align:center;pointer-events:none;animation:fadeInUp .3s ease;min-width:180px;box-shadow:0 4px 20px rgba(0,0,0,.4)';
  div.innerHTML = lines.join('<br>');
  document.body.appendChild(div);
  setTimeout(() => div.style.opacity = '0', 1800);
  setTimeout(() => div.remove(), 2100);
}

// ── Achievement Toast ──
function showAchievement(ach) {
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1a2a1a;border:1px solid rgba(200,240,96,.4);border-radius:14px;padding:14px 22px;font-family:var(--sans);font-size:14px;color:var(--text);z-index:201;text-align:center;min-width:220px;box-shadow:0 6px 30px rgba(0,0,0,.5)';
  div.innerHTML = `<div style="font-size:32px;margin-bottom:6px">${ach.icon}</div><div style="color:var(--accent);font-weight:700;margin-bottom:2px">成就解鎖！</div><div>${ach.name}</div><div style="font-size:12px;color:var(--muted);margin-top:3px">${ach.desc}</div>`;
  document.body.appendChild(div);
  setTimeout(() => { div.style.transition = 'opacity .5s'; div.style.opacity = '0'; }, 2500);
  setTimeout(() => div.remove(), 3000);
}

const LEVELS = [
  {lv:1, name:'詞彙學徒',    min:0},
  {lv:2, name:'單字探索者',  min:3},
  {lv:3, name:'字根獵人',    min:8},
  {lv:4, name:'語言武士',    min:20},
  {lv:5, name:'詞彙大師',    min:50},
  {lv:6, name:'字根宗師',    min:100},
];

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let VOCAB = [];
let chapterProgress = {};
let view = { name:'list' };  // list | learn | quiz | result

// ── Progress helpers ──
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); }
  catch{ return {}; }
}
function saveProgress(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(chapterProgress)); }

function getChapterWords(chIdx){
  return VOCAB.slice(chIdx*CH_SIZE, (chIdx+1)*CH_SIZE);
}
function totalChapters(){ return Math.ceil(VOCAB.length/CH_SIZE); }

function getCh(i){
  return chapterProgress[i] || {
    status:'locked', stars:0,
    learnDone:false, quizScore:null,
    reviewDue:null, reviewStage:0, reviewScore:null
  };
}
function setCh(i,data){
  chapterProgress[i]={...getCh(i),...data};
  saveProgress();
}

function addDays(d){ const dt=new Date(); dt.setDate(dt.getDate()+d); return dt.toISOString().slice(0,10); }
function today(){ return new Date().toISOString().slice(0,10); }
function isReviewDue(i){ const ch=getCh(i); return ch.reviewDue && ch.reviewDue<=today(); }

function totalStars(){
  return Object.values(chapterProgress).reduce((s,c)=>s+(c.stars||0),0);
}
function getLevel(){
  const stars = totalStars();
  let cur = LEVELS[0];
  for(const lv of LEVELS){ if(stars>=lv.min) cur=lv; }
  const next = LEVELS.find(l=>l.min>stars);
  const pct = next ? Math.round((stars-cur.min)/(next.min-cur.min)*100) : 100;
  return {...cur, stars, nextMin:next?next.min:cur.min, pct};
}

// ══════════════════════════════════════════════
// RENDER — LIST
// ══════════════════════════════════════════════
function renderList(){
  const n = totalChapters();
  const lv = getLevel();
  document.getElementById('headerSub').textContent = `${totalStars()} 顆星`;

  const gd = GAME.load();
  const lvi = GAME.getLevel(gd.xp);
  const streakStr = gd.streak >= 2 ? `🔥 ${gd.streak} 天連勝` : '';
  let html = `
    <div class="level-banner">
      <div class="level-row">
        <div class="level-badge">Lv${lvi.lv}</div>
        <div class="level-info">
          <div class="level-name">${lvi.name} ${streakStr}</div>
          <div class="level-sub">${gd.xp} XP · 字根 ${gd.rootsUnlocked.length} 個</div>
        </div>
      </div>
      <div class="xp-bar-wrap"><div class="xp-bar" style="width:${lvi.pct}%"></div></div>
      <div class="xp-label">${gd.xp} / ${lvi.nextMin} XP → ${lvi.nextName}</div>
    </div>`;

  // Check if any review due
  const dueChs = [];
  for(let i=0;i<n;i++){ if(isReviewDue(i)) dueChs.push(i); }
  if(dueChs.length>0){
    html += `<div class="sec-title">🔄 需要複習</div>`;
    for(const i of dueChs){
      html += renderChCard(i, true);
    }
  }

  html += `<div class="sec-title">📖 所有章節</div>`;
  for(let i=0;i<n;i++){
    if(!dueChs.includes(i)) html += renderChCard(i, false);
  }
  html += `<div style="height:32px"></div>`;

  document.getElementById('screen').innerHTML = html;
}

function renderChCard(i, highlight){
  const ch = getCh(i);
  const words = getChapterWords(i);
  const first = words[0]?.word||'';
  const last = words[words.length-1]?.word||'';
  const due = isReviewDue(i);
  const stars = '⭐'.repeat(ch.stars) + '☆'.repeat(3-ch.stars);

  // Determine status
  const isLocked = ch.status==='locked' && i>0;
  const canLearn = !isLocked;
  const canQuiz = ch.learnDone;
  const canReview = due;

  const numCls = ch.status!=='locked'?'ch-num active':'ch-num';
  const lockIcon = isLocked?'<div class="ch-lock">🔒</div>':'';
  const starsHtml = ch.quizScore!==null?`<div class="ch-stars">${stars}</div>`:'';
  const reviewTag = due?`<span class="review-due">複習</span>`:'';

  let actions = '';
  if(!isLocked){
    actions = `<div class="ch-actions">`;
    if(!ch.learnDone){
      actions += `<button class="btn-learn" onclick="startLearn(${i})">📖 探索</button>`;
    } else if(ch.quizScore===null){
      actions += `<button class="btn-learn" onclick="startLearn(${i})">📖 再看一遍</button>`;
      actions += `<button class="btn-quiz" onclick="startQuiz(${i},'first')">🎯 測驗</button>`;
    } else if(due){
      actions += `<button class="btn-review" onclick="startQuiz(${i},'review')">🔄 複習測驗</button>`;
    } else {
      actions += `<button class="btn-learn" onclick="startLearn(${i})">📖 重看</button>`;
      actions += `<button class="btn-quiz btn-review" onclick="startQuiz(${i},'first')" style="border-color:rgba(96,200,240,.3);color:var(--accent2);background:rgba(96,200,240,.06)">🎯 再次測驗</button>`;
    }
    actions += `</div>`;
  }

  return `
    <div class="ch-card${isLocked?' locked':''}${highlight?' active':''}">
      <div class="ch-card-top" onclick="${isLocked?'':''}">
        <div class="${numCls}">Ch.${i+1}</div>
        <div class="ch-info">
          <div class="ch-title">Chapter ${i+1} ${reviewTag}</div>
          <div class="ch-words">${first} – ${last} · ${words.length} 個單字</div>
        </div>
        ${starsHtml}
        ${lockIcon}
      </div>
      ${actions}
    </div>`;
}

let learnState = {};

function startLearn(chIdx){
  const words = getChapterWords(chIdx);
  learnState = { chIdx, words, idx:0, flipped:false, guideOpen:true };
  view = {name:'learn'};
  renderLearn();
}

function guideRootsText(w){
  const roots=w.roots||w.etymology?.roots||[];
  if(!roots.length)return '這個單字暫時沒有字根資料，先用意思和例句建立印象。';
  return roots.map(r=>`${r.root} = ${r.meaning_zh||r.meaning||''}`).join(' + ');
}

function renderWordGuide(w){
  if(!learnState.guideOpen){
    return `<div class="guide-panel">
      <button class="guide-head" onclick="toggleGuide()">

      </button>
    </div>`;
  }
  const rootsText=guideRootsText(w);
  const zh=(w.definition_zh||'').split('；')[0]||w.definition_zh||'';
  const example=w.example_zh?`${w.example}<br><span class="guide-muted">${w.example_zh}</span>`:w.example;
  const memory=w.mnemonic?.root_memory||w.mnemonic?.story_zh||'把單字、意思、例句連在同一個情境裡記。';
  return `<div class="guide-panel">
    <button class="guide-head" onclick="toggleGuide()">
      <span>單字導讀</span><span style="font-family:var(--mono);color:var(--dim)">收合 -</span>
    </button>
    <div class="guide-body">

        <div class="guide-label">Core meaning</div>

      </div>
      <div class="guide-row">

      </div>
      <div class="guide-row">
        <div class="guide-label">Example</div>
        <div class="guide-text">${example||'這個單字目前沒有例句資料。'}</div>
      </div>

function renderQuizGuide(q){
  if(!quizState.guideOpen){
    return `<div class="guide-panel">
      <button class="guide-head" onclick="toggleQuizGuide()">
        <span>測驗導讀</span><span style="font-family:var(--mono);color:var(--dim)">展開 +</span>
      </button>
    </div>`;
  }
  const answered=quizState.answered;
  const rootsText=guideRootsText(q);
  const example=answered&&q.example_zh
    ? `${q.example}<br><span class="guide-muted">${q.example_zh}</span>`
    : q.example;
  const memory=answered
    ? (q.mnemonic?.story_zh||q.mnemonic?.root_memory||'把字根、例句和答案連在一起記。')
    : (q.mnemonic?.root_memory||'先看字根和例句，試著推回中文意思。');
  const answerRow=answered
    ? `<div class="guide-row">
        <div class="guide-label">Answer meaning</div>
        <div class="guide-text">${q.word} = ${q.definition_zh}<br><span class="guide-muted">${q.definition}</span></div>
      </div>`
    : `<div class="guide-row">
        <div class="guide-label">Quiz hint</div>
        <div class="guide-text">先不要急著看答案。用字根、詞性和例句判斷它最接近哪個中文選項。</div>
      </div>`;
  return `<div class="guide-panel">
    <button class="guide-head" onclick="toggleQuizGuide()">
      <span>測驗導讀</span><span style="font-family:var(--mono);color:var(--dim)">收合 -</span>
    </button>
    <div class="guide-body">
      ${answerRow}
      <div class="guide-row">
        <div class="guide-label">Roots</div>
        <div class="guide-text">${rootsText}</div>
      </div>
      <div class="guide-row">
        <div class="guide-label">Example</div>
        <div class="guide-text">${example||'這個單字目前沒有例句資料。'}</div>
      </div>
      <div class="guide-row">
        <div class="guide-label">Memory cue</div>
        <div class="guide-text">${(q.mnemonic?.emojis||[]).join('  ')} ${memory}</div>
      </div>
    </div>
  </div>`;
}

function flipCard(){ learnState.flipped=!learnState.flipped; renderLearn(); }
function toggleGuide(){ learnState.guideOpen=!learnState.guideOpen; renderLearn(); }
function learnPrev(){ if(learnState.idx>0){learnState.idx--;learnState.flipped=false;learnState.guideOpen=true;renderLearn();} }
function learnNext(){
  if(learnState.idx<learnState.words.length-1){
    learnState.idx++;learnState.flipped=false;learnState.guideOpen=true;renderLearn();
  } else {
    // Mark learn done
    setCh(learnState.chIdx,{learnDone:true,status:'available'});
  const _lxp = GAME.addXP('wordLearned', learnState.words.length);
  showXPToast([`📖 探索完成！`, `+${_lxp.amount} XP`]);
  _lxp.newAchievements.forEach(a => setTimeout(()=>showAchievement(a), 500));

    showLearnDone();
  }
}

// QUIZ SCREEN

let quizState = {};

function startQuiz(chIdx, mode){
  const words = getChapterWords(chIdx);
  // Build 20 questions: each word, ask zh meaning
  const questions = words.map(w=>{
    const correct = w.definition_zh.split('；')[0].split('、')[0].slice(0,12);
    const pool = [...new Set(
      VOCAB
        .filter(v=>v.word!==w.word)
        .map(v=>v.definition_zh.split('；')[0].split('、')[0].slice(0,12))
        .filter(opt=>opt && opt!==correct)
    )];
    const shuffled = pool.sort(()=>Math.random()-.5).slice(0,3);
    const opts = [correct,...shuffled].sort(()=>Math.random()-.5);
    return { word:w.word, phonetic:w.phonetic, pos:w.pos, correct, opts,
      ansIdx: opts.indexOf(correct),
      definition: w.definition,
      definition_zh: w.definition_zh,
      example: w.example,
      example_zh: w.example_zh,
      mnemonic: w.mnemonic,
      roots: w.roots||w.etymology?.roots||[] };
  });

  quizState = {
    chIdx, mode, questions, idx:0,
    answered:false, selected:null, guideOpen:true,
    corrects:0, wrongs:0, wrongWords:[]
  };
  view = {name:'quiz'};
  renderQuiz();
}

function renderQuiz(){
  const {questions, idx, answered, selected, chIdx, mode} = quizState;
  const q = questions[idx];
  const pct = Math.round(idx/questions.length*100);
  const modeLabel = mode==='review'?'複習測驗':'測驗';

  document.getElementById('headerTitle').textContent = `Chapter ${chIdx+1} ${modeLabel}`;
  document.getElementById('headerSub').textContent = `${idx+1} / ${questions.length}`;

  const opts = q.opts.map((opt,i)=>{
    let cls='';
    if(answered){
      if(i===q.ansIdx) cls='correct';
      else if(i===selected && selected!==q.ansIdx) cls='wrong';
    }
    return `<button class="opt ${cls}" onclick="answerQuiz(${i})" ${answered?'disabled':''}>
      <span class="opt-key">${['A','B','C','D'][i]}</span>${opt}
    </button>`;
  }).join('');

  let feedback = '';
  if(answered){
    const ok = selected===q.ansIdx;
    const rootText = (q.roots||[]).slice(0,2).map(r=>`${r.root}（${r.meaning_zh}）`).join(' + ');
    feedback = ok
      ? `<div class="feedback ok">✓ 答對了！</div>`
      : `<div class="feedback bad">
           <div>✗ 答錯了，正確答案是「${q.correct}」</div>
           ${rootText?`<div class="fb-detail">${q.word} = ${rootText}</div>`:''}
           <div class="fb-detail" style="color:var(--dim);font-size:12px">${q.definition}</div>
         </div>`;
  }

  document.getElementById('screen').innerHTML = `
    <div class="screen-wrap">
      <div class="prog-row">
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%" id="qprog"></div></div>
        <div class="prog-label">${quizState.corrects}✓ ${quizState.wrongs}✗</div>
      </div>
      <div class="quiz-word">${q.word}</div>
      <div class="quiz-q">${q.phonetic} · ${q.pos||''} · 選出正確的中文意思</div>
      ${renderQuizGuide(q)}
      <div class="opt-list" style="margin-top:12px">${opts}</div>
      ${feedback}
      ${answered?`<button class="next-btn" onclick="nextQuiz()">${idx+1<questions.length?'下一題 →':'查看結果 →'}</button>`:''}
      <div style="text-align:center;margin-top:14px">
        <button class="btn-secondary" style="width:auto;padding:5px 16px;font-size:13px" onclick="exitToList()">← 放棄測驗</button>
      </div>
    </div>`;
}

function toggleQuizGuide(){ quizState.guideOpen=!quizState.guideOpen; renderQuiz(); }

function answerQuiz(optIdx){
  if(quizState.answered) return;
  quizState.answered=true;
  quizState.selected=optIdx;
  const q=quizState.questions[quizState.idx];
  if(optIdx===q.ansIdx){ quizState.corrects++; }
  else { quizState.wrongs++; quizState.wrongWords.push(q.word); }
  renderQuiz();
}

function nextQuiz(){
  quizState.answered=false;
  quizState.selected=null;
  quizState.guideOpen=true;
  if(quizState.idx<quizState.questions.length-1){
    quizState.idx++;
    renderQuiz();
  } else {
    finishQuiz();
  }
}

function finishQuiz(){
  const {chIdx, mode, corrects, questions, wrongWords} = quizState;
  const total = questions.length;
  const score = Math.round(corrects/total*100);
  quizState.score = score;

  // XP for quiz
  const _qxp = GAME.addXP('quizCorrect', corrects);
  GAME.addXP('quizWrong', total - corrects);
  const xpLines = [`🎯 測驗完成！`, `+${_qxp.amount} XP`];

  // XP for chapter pass
  let passXP = 0;

  const ch = getCh(chIdx);
  let newStars = ch.stars;
  let nextReview = null;
  let reviewStage = ch.reviewStage||0;

  if(mode==='first'){
    if(score>=PASS_QUIZ){
      newStars = Math.max(newStars, 1);
      nextReview = addDays(REV1_DAYS);
      reviewStage = 1;
      // Unlock next chapter
      const nextCh = chIdx+1;
      if(nextCh < totalChapters()){
        const nc = getCh(nextCh);
        if(nc.status==='locked') setCh(nextCh,{status:'available'});
      }
    }
    setCh(chIdx,{quizScore:score, stars:newStars, reviewDue:nextReview, reviewStage, status:'available'});
    if (score >= PASS_QUIZ) {
      passXP = GAME.XP.chapterPass;
      GAME.addXP('chapterPass');
      xpLines.push(`+${passXP} XP 章節通過！`);
      // Unlock roots from this chapter's words
      const chWords = getChapterWords(chIdx);
      const rootsSeen = new Set();
      chWords.forEach(w => (w.roots||[]).forEach(r => { if(r.root) rootsSeen.add(r.root); }));
      let newRoots = 0;
      rootsSeen.forEach(rootId => {
        const res = GAME.unlockRoot(rootId);
        if (!res.alreadyHad) newRoots++;
        res.newAchievements && res.newAchievements.forEach(a => setTimeout(()=>showAchievement(a), 800));
      });
      if (newRoots > 0) xpLines.push(`🌿 +${newRoots} 個字根收集！`);
    }
    _qxp.newAchievements.forEach(a => setTimeout(()=>showAchievement(a), 600));
    setTimeout(() => showXPToast(xpLines), 200);
  } else if(mode==='review'){
    if(reviewStage===1 && score>=PASS_REV1){
      newStars=Math.max(newStars,2);
      nextReview=addDays(REV2_DAYS);
      reviewStage=2;
    } else if(reviewStage>=2 && score>=PASS_REV2){
      newStars=Math.max(newStars,3);
      nextReview=null; // mastered
      reviewStage=3;
    } else if(score<70){
      // failed — reschedule in 1 day
      nextReview=addDays(1);
    } else {
      nextReview=addDays(REV1_DAYS);
    }
    setCh(chIdx,{reviewScore:score, stars:newStars, reviewDue:nextReview, reviewStage});
  }

  renderResult();
}

function renderResult(){
  const {chIdx, mode, score, corrects, questions, wrongWords} = quizState;
  const total = questions.length;
  const ch = getCh(chIdx);
  const passed = mode==='first'?score>=PASS_QUIZ : score>= (ch.reviewStage>=2?PASS_REV2:PASS_REV1);
  const stars = '⭐'.repeat(ch.stars)+'☆'.repeat(3-ch.stars);
  const nextCh = chIdx+1;
  const hasNext = nextCh < totalChapters() && passed && mode==='first';

  let msg = '';
  if(passed){
    if(mode==='first') msg=`章節解鎖成功！${nextCh<totalChapters()?`Chapter ${nextCh+1} 現在開放了。`:''}`;
    else if(ch.stars===3) msg='完美精通！這組單字已長期記憶。';
    else msg=`複習通過！${ch.reviewDue?`下次複習：${ch.reviewDue}`:''}`;
  } else {
    msg=`答對率需達 ${mode==='first'?PASS_QUIZ:PASS_REV1}% 才能過關。明天再試一次！`;
  }

  let wrongSection = '';
  if(wrongWords.length>0){
    wrongSection=`<div style="background:rgba(240,100,100,.05);border:1px solid rgba(240,100,100,.15);border-radius:10px;padding:12px 14px;margin-bottom:12px">
      <div style="font-family:var(--mono);font-size:12px;color:var(--red);margin-bottom:6px">需要加強</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${wrongWords.map(w=>`<span style="font-family:var(--mono);font-size:14px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 8px;color:var(--text)">${w}</span>`).join('')}
      </div>
    </div>`;
  }

  document.getElementById('headerTitle').textContent = `Chapter ${chIdx+1} 結果`;
  document.getElementById('headerSub').textContent = '';
  document.getElementById('screen').innerHTML = `
    <div class="screen-wrap">
      <div class="result-card">
        <div class="result-score">${score}%</div>
        <div class="result-label">${corrects} / ${total} 答對</div>
        <div class="result-stars">${stars}</div>
        <div class="result-msg">${passed?'✓ 通過':'✗ 未通過'} · ${msg}</div>
        ${ch.reviewDue&&passed?`<div class="result-next">📅 下次複習安排在 ${ch.reviewDue}</div>`:''}
      </div>
      ${wrongSection}
      ${hasNext?`<button class="btn-primary" onclick="startLearn(${nextCh})">前往 Chapter ${nextCh+1} →</button>`:''}
      <button class="${hasNext?'btn-secondary':'btn-primary'}" onclick="exitToList()">回章節列表</button>
    </div>`;
}
