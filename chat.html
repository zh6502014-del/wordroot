<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>WordRoot Chat</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0f11;--surface:#16181c;--surface2:#1e2026;--border:#2a2d35;
  --accent:#c8f060;--accent2:#60c8f0;--red:#f06464;
  --text:#e8eaf0;--muted:#6b7080;--dim:#3a3f50;
  --bot-bg:#1a1f2e;--user-bg:#1a2a1a;
  --serif:'DM Serif Display',serif;--mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto}

/* ── Header ── */
#header{
  flex-shrink:0;padding:14px 20px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
  background:var(--bg);
}
#header .bot-avatar{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,rgba(200,240,96,.15),rgba(96,200,240,.1));
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
#header .bot-info .name{font-family:var(--serif);font-size:16px;color:var(--text)}
#header .bot-info .status{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.06em}
#header .back-btn{
  margin-left:auto;background:none;border:1px solid var(--border);
  border-radius:8px;padding:5px 12px;color:var(--muted);
  font-family:var(--mono);font-size:11px;cursor:pointer;text-decoration:none;
  display:flex;align-items:center;gap:5px;
}
#header .back-btn:hover{color:var(--text);border-color:var(--text)}

/* ── Messages ── */
#messages{
  flex:1;overflow-y:auto;padding:20px 16px;
  display:flex;flex-direction:column;gap:14px;
  scroll-behavior:smooth;
}
#messages::-webkit-scrollbar{width:4px}
#messages::-webkit-scrollbar-track{background:transparent}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.msg-row{display:flex;gap:10px;align-items:flex-end}
.msg-row.user{flex-direction:row-reverse}
.msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid var(--border)}
.msg-avatar.bot{background:var(--bot-bg)}
.msg-avatar.user{background:var(--user-bg)}

.bubble{
  max-width:75%;padding:11px 14px;border-radius:16px;
  font-size:14px;line-height:1.65;position:relative;
}
.bubble .msg-content{white-space:pre-line}
.bubble.bot{
  background:var(--bot-bg);border:1px solid var(--border);
  border-bottom-left-radius:4px;color:var(--text);
}
.bubble.user{
  background:var(--user-bg);border:1px solid rgba(200,240,96,.2);
  border-bottom-right-radius:4px;color:var(--text);
}
.bubble .time{
  font-family:var(--mono);font-size:9px;color:var(--dim);
  margin-top:5px;display:block;
}
.msg-row.user .bubble .time{text-align:right}

/* vocab word underline */
.vocab-word{
  border-bottom:1px solid var(--accent2);color:var(--accent2);
  cursor:pointer;position:relative;white-space:nowrap;
}
.vocab-word:hover{color:var(--accent)}

/* ── Grammar fix block ── */
.grammar-fix{
  margin-top:8px;padding:8px 12px;
  background:rgba(240,100,100,.06);border:1px solid rgba(240,100,100,.2);
  border-radius:8px;font-size:12px;
}
.grammar-fix .fix-label{
  font-family:var(--mono);font-size:10px;color:var(--red);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;
}
.grammar-fix .fix-wrong{color:var(--red);text-decoration:line-through;margin-right:6px}
.grammar-fix .fix-right{color:var(--accent)}
.grammar-fix .fix-explain{color:var(--muted);font-size:11px;margin-top:3px}

/* ── Bubble actions (translate, quote) ── */
.bubble-actions{
  display:none;position:absolute;
  bottom:-28px;right:0;
  display:flex;gap:4px;z-index:10;
}
.msg-row.bot .bubble{position:relative;overflow:visible}
.msg-row.bot .bubble:hover .bubble-actions{display:flex}
.bubble-actions button{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;padding:3px 8px;font-size:11px;
  cursor:pointer;color:var(--muted);transition:all .15s;
  white-space:nowrap;
}
.bubble-actions button:hover{color:var(--text);border-color:var(--muted)}
.bubble-actions button.active{color:var(--accent2);border-color:var(--accent2)}
.translated-text{
  margin-top:8px;padding:8px 10px;
  background:rgba(96,200,240,.06);border:1px solid rgba(96,200,240,.2);
  border-radius:8px;font-size:13px;color:var(--accent2);line-height:1.6;
  display:none;
}
.translated-text.show{display:block}

/* ── Quote bar above input ── */
#quote-bar{
  display:none;padding:8px 16px;
  border-top:1px solid var(--border);background:var(--surface);
  flex-shrink:0;
}
#quote-bar.show{display:flex;align-items:flex-start;gap:10px}
#quote-bar .qb-line{
  width:3px;height:100%;background:var(--accent2);border-radius:2px;flex-shrink:0;align-self:stretch;
}
#quote-bar .qb-text{
  flex:1;font-size:12px;color:var(--muted);line-height:1.5;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
#quote-bar .qb-cancel{
  background:none;border:none;color:var(--dim);font-size:18px;
  cursor:pointer;padding:0 4px;flex-shrink:0;line-height:1;
}
#quote-bar .qb-cancel:hover{color:var(--text)}

/* ── Quoted message inside bubble ── */
.quote-ref{
  background:var(--surface2);border-left:3px solid var(--accent2);
  border-radius:4px;padding:6px 10px;margin-bottom:6px;
  font-size:12px;color:var(--muted);line-height:1.5;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}

/* ── Quick phrase chips ── */
#quick-phrases{
  padding:8px 16px 12px;
  display:flex;flex-wrap:wrap;gap:8px;
}
.qp-chip{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:7px 14px;
  font-size:13px;color:var(--muted);cursor:pointer;
  transition:all .18s;white-space:nowrap;
  font-family:var(--sans);
}
.qp-chip:hover{
  border-color:var(--accent2);color:var(--accent2);
  background:rgba(96,200,240,.07);
}

/* ── Typing indicator ── */
.typing-dots{display:flex;gap:4px;padding:6px 2px}
.typing-dots span{
  width:7px;height:7px;border-radius:50%;background:var(--muted);
  animation:dotBounce .9s ease infinite;
}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes dotBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* ── Input area ── */
#input-area{
  flex-shrink:0;padding:12px 16px;
  border-top:1px solid var(--border);background:var(--bg);
  display:flex;gap:10px;align-items:flex-end;
}
#input-area textarea{
  flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:10px 14px;color:var(--text);
  font-family:var(--sans);font-size:14px;resize:none;
  line-height:1.5;min-height:44px;max-height:120px;
  overflow-y:auto;outline:none;transition:border-color .15s;
}
#input-area textarea:focus{border-color:var(--accent2)}
#input-area textarea::placeholder{color:var(--dim)}
#send-btn{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:rgba(200,240,96,.1);border:1px solid rgba(200,240,96,.3);
  color:var(--accent);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
#send-btn:hover{background:rgba(200,240,96,.2)}
#send-btn:disabled{opacity:.4;cursor:default}

/* ── Tooltip ── */
#tooltip{
  position:fixed;z-index:200;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:12px 14px;
  min-width:200px;max-width:280px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  display:none;
}
#tooltip.show{display:block}
#tooltip .tt-word{font-family:var(--serif);font-size:20px;color:var(--accent);margin-bottom:2px}
#tooltip .tt-phonetic{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px}
#tooltip .tt-def{font-size:12px;color:var(--text);line-height:1.5;margin-bottom:4px}
#tooltip .tt-def-zh{font-size:11px;color:var(--muted);margin-bottom:8px}
#tooltip .tt-syns{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
#tooltip .tt-syn{font-family:var(--mono);font-size:10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 6px;color:var(--muted)}
#tooltip .tt-speak{
  background:none;border:1px solid var(--border);border-radius:6px;
  padding:4px 10px;color:var(--muted);font-family:var(--mono);font-size:11px;
  cursor:pointer;transition:all .15s;width:100%;
}
#tooltip .tt-speak:hover{border-color:var(--accent2);color:var(--accent2)}

/* ── Date divider ── */
.date-divider{
  text-align:center;font-family:var(--mono);font-size:10px;
  color:var(--dim);margin:4px 0;letter-spacing:.06em;
}

/* ── Proactive banner ── */
.proactive-banner{
  background:linear-gradient(135deg,rgba(200,240,96,.06),var(--surface));
  border:1px solid rgba(200,240,96,.2);border-radius:10px;
  padding:10px 14px;font-size:12px;color:var(--muted);
  font-family:var(--mono);text-align:center;
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="bot-avatar">🤖</div>
    <div class="bot-info">
      <div class="name">WordBot</div>
      <div class="status" id="statusText">ONLINE</div>
    </div>
    <a href="index.html" class="back-btn">← 回首頁</a>
  </div>
  <div id="messages"></div>
  <div id="quick-phrases"></div>
  <div id="quote-bar">
    <div class="qb-line"></div>
    <div class="qb-text" id="quotedText"></div>
    <button class="qb-cancel" onclick="cancelQuote()">✕</button>
  </div>
  <div id="input-area">
    <textarea id="msgInput" placeholder="Type something in English..." rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">↑</button>
  </div>
</div>
<div id="tooltip"></div>

<script>
// ══════════════════════════════════════════════
// VOCAB DATA — loaded from split JSON files
// ══════════════════════════════════════════════
let VOCAB = [];
let VOCAB_BY_WORD = new Map();
let VOCAB_WORD_SET = new Set();
let VOCAB_BY_TAG = new Map();
let VOCAB_BY_ROOT = new Map();

const VOCAB_FILES = Array.from({length:40},(_,i)=>{
  const batch=String(i+1).padStart(2,'0');
  const start=String(i*50+1).padStart(3,'0');
  const end=String((i+1)*50).padStart(3,'0');
  return `./data/vocab_${batch}_${start}-${end}.json`;
});

Promise.all(VOCAB_FILES.map(u=>fetch(u).then(r=>r.ok?r.json():[])))
  .then(results=>{
    VOCAB=results.flat();
    buildVocabIndexes();
    console.log('Vocab loaded:',VOCAB.length,'words');
    const st=document.getElementById('statusText');
    if(st&&VOCAB.length)st.textContent=`ONLINE · ${VOCAB.length} WORDS`;
    // Re-highlight any bot messages rendered before vocab finished loading
    document.querySelectorAll('.msg-row.bot .msg-content').forEach(el=>{
      if(el.dataset.raw)el.innerHTML=highlightVocab(el.dataset.raw);
    });
  })
  .catch(err=>{ console.warn('Vocab load failed:',err); });

function buildVocabIndexes(){
  VOCAB_BY_WORD=new Map();
  VOCAB_WORD_SET=new Set();
  VOCAB_BY_TAG=new Map();
  VOCAB_BY_ROOT=new Map();
  VOCAB.forEach(w=>{
    const key=w.word.toLowerCase();
    VOCAB_BY_WORD.set(key,w);
    VOCAB_WORD_SET.add(key);
    (w.tags||[]).forEach(tag=>{
      if(!VOCAB_BY_TAG.has(tag))VOCAB_BY_TAG.set(tag,[]);
      VOCAB_BY_TAG.get(tag).push(w);
    });
    (w.etymology?.roots||[]).forEach(r=>{
      const root=(r.root||'').toLowerCase().split('/')[0].trim();
      if(!root)return;
      if(!VOCAB_BY_ROOT.has(root))VOCAB_BY_ROOT.set(root,[]);
      VOCAB_BY_ROOT.get(root).push(w);
    });
  });
}

function tokenizeWords(text){
  return (text.toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g)||[])
    .map(w=>w.replace(/'s$/,''));
}

function getVocabWord(word){
  return VOCAB_BY_WORD.get(String(word||'').toLowerCase())||null;
}

function findMentionedVocab(text){
  const tokens=tokenizeWords(text);
  for(const token of tokens){
    const direct=getVocabWord(token);
    if(direct)return direct;
    // Generate candidate base forms (handles studies→study, planning→plan, analyzed→analyze)
    const candidates=[];
    if(token.endsWith('ies'))candidates.push(token.slice(0,-3)+'y');
    if(token.endsWith('ied'))candidates.push(token.slice(0,-3)+'y');
    if(token.endsWith('ing')){
      candidates.push(token.slice(0,-3),token.slice(0,-3)+'e');
      if(/([a-z])\1ing$/.test(token))candidates.push(token.slice(0,-4)); // doubled consonant
    }
    if(token.endsWith('ed')){
      candidates.push(token.slice(0,-2),token.slice(0,-1));
      if(/([a-z])\1ed$/.test(token))candidates.push(token.slice(0,-3));
    }
    if(token.endsWith('es'))candidates.push(token.slice(0,-2));
    if(token.endsWith('s'))candidates.push(token.slice(0,-1));
    for(const c of candidates){
      const base=getVocabWord(c);
      if(base)return base;
    }
  }
  return null;
}

function pickRandom(arr){
  return arr&&arr.length?arr[Math.floor(Math.random()*arr.length)]:null;
}

function pickRelatedVocab(topic=null,userText=''){
  const mentioned=findMentionedVocab(userText);
  if(mentioned)return mentioned;
  const topicTagMap={
    study:['academic','language','TOEFL','college'],
    work:['business','economics','finance'],
    health:['science','psychology','medical'],
    money:['finance','economics','business'],
    technology:['technology','science'],
    feeling:['psychology','philosophy'],
    motivation:['common','psychology'],
    hobby:['art','language'],
    travel:['history','geography','culture'],
    relationships:['psychology','social'],
    opinion:['philosophy','politics'],
  };
  const candidates=[];
  (topicTagMap[topic]||[]).forEach(tag=>candidates.push(...(VOCAB_BY_TAG.get(tag)||[])));
  return pickRandom(candidates)||pickRandom(VOCAB);
}

const PHRASE_SCENARIOS={
  daily:{
    zh:'日常用語',
    topic:'daily',
    tags:['common','psychology','college'],
    nouns:['plan','routine','choice','habit','idea','problem'],
    places:['at home','after work','this morning','during the day'],
  },
  work:{
    zh:'職場用語',
    topic:'work',
    tags:['business','economics','finance','academic'],
    nouns:['project','proposal','meeting','deadline','strategy','report'],
    places:['in the meeting','with the team','at work','before the deadline'],
  },
  travel:{
    zh:'旅行用語',
    topic:'travel',
    tags:['history','geography','culture','common'],
    nouns:['trip','route','reservation','destination','schedule','hotel'],
    places:['at the airport','during the trip','in a new city','before departure'],
  },
  social:{
    zh:'社交用語',
    topic:'social',
    tags:['psychology','social','common','language'],
    nouns:['conversation','invitation','friendship','message','event','relationship'],
    places:['at dinner','with friends','after the event','in the group chat'],
  },
};

function detectPhraseScenario(text){
  const lower=text.toLowerCase();
  if(/職場|工作|商務|會議|work|business|office|meeting/.test(lower))return 'work';
  if(/旅行|旅遊|機場|飯店|travel|trip|airport|hotel/.test(lower))return 'travel';
  if(/社交|朋友|聊天|邀請|social|friend|invitation|conversation/.test(lower))return 'social';
  if(/日常|生活|daily|everyday|casual/.test(lower))return 'daily';
  return null;
}

function detectPhraseTense(text){
  const lower=text.toLowerCase();
  if(/過去|昨天|上次|以前|past|yesterday|last/.test(lower))return 'past';
  if(/未來|明天|下次|將來|future|tomorrow|next/.test(lower))return 'future';
  if(/現在|平常|目前|present|now|usually/.test(lower))return 'present';
  return 'mixed';
}

function isPhraseIntent(text){
  const lower=text.toLowerCase();
  return /用語|句子|造句|口說|會話|情境|組合|日常|職場|旅行|旅遊|社交/.test(lower)||
    /(?:daily|everyday|work|business|travel|social).*(?:phrase|sentence|expression|conversation)/.test(lower)||
    /(?:phrase|sentence|expression).*(?:daily|everyday|work|business|travel|social)/.test(lower);
}

function pickScenarioWord(scenarioKey,userText){
  const mentioned=findMentionedVocab(userText);
  if(mentioned)return mentioned;
  const scenario=PHRASE_SCENARIOS[scenarioKey]||PHRASE_SCENARIOS.daily;
  const candidates=[];
  scenario.tags.forEach(tag=>candidates.push(...(VOCAB_BY_TAG.get(tag)||[])));
  const filtered=candidates.filter(w=>
    ['verb','noun','adjective'].includes(String(w.pos||'').toLowerCase())&&
    Number(w.frequency_rank||9999)<=800&&
    /^[a-z-]{3,14}$/.test(w.word)
  );
  return pickRandom(filtered)||pickRandom(candidates)||pickRandom(VOCAB);
}

function articleFor(word){
  return /^[aeiou]/i.test(word)?'an':'a';
}

function simplePastVerb(word){
  if(/e$/.test(word))return word+'d';
  if(/[^aeiou]y$/.test(word))return word.slice(0,-1)+'ied';
  return word+'ed';
}

function phraseSentence(w,scenarioKey,tense,kind){
  const scenario=PHRASE_SCENARIOS[scenarioKey]||PHRASE_SCENARIOS.daily;
  const noun=pickRandom(scenario.nouns);
  const place=pickRandom(scenario.places);
  const word=w.word;
  const pos=String(w.pos||'').toLowerCase();
  const isVerb=pos.includes('verb');
  const isAdj=pos.includes('adjective');
  const isNoun=pos.includes('noun');
  const nounUse=isNoun?word:noun;
  const adjUse=isAdj?word:'important';
  const verbUse=isVerb?word:'consider';
  const pastVerb=isVerb?simplePastVerb(word):'considered';

  let templates;
  if(isVerb){
    templates={
      present:[`I usually ${verbUse} the ${noun} carefully ${place}.`,`We need to ${verbUse} this ${noun} before we decide.`],
      past:[`I ${pastVerb} the ${noun} carefully ${place}.`,`We tried to ${verbUse} the ${noun}, but it took more time than expected.`],
      future:[`I will ${verbUse} the ${noun} carefully ${place}.`,`I hope we can ${verbUse} the ${noun} before the next step.`],
      question:[`Could you help me ${verbUse} this ${noun}?`,`What is the best way to ${verbUse} the ${noun} ${place}?`],
    };
  }else if(isAdj){
    templates={
      present:[`This ${noun} is ${adjUse}, so I want to handle it carefully.`,`A ${adjUse} ${noun} needs clear communication.`],
      past:[`The ${noun} was ${adjUse}, so we discussed it again.`,`I thought the ${noun} was ${adjUse} ${place}.`],
      future:[`We are going to review this ${adjUse} ${noun} tomorrow.`,`This ${noun} will be ${adjUse} for the next step.`],
      question:[`Do you think this ${noun} is ${adjUse}?`,`Would a ${adjUse} ${noun} help in this situation?`],
    };
  }else{
    templates={
      present:[`I usually review the ${nounUse} carefully ${place}.`,`The ${nounUse} matters, so I pay attention to the details.`],
      past:[`I reviewed the ${nounUse} carefully ${place}.`,`The ${nounUse} affected our decision yesterday.`],
      future:[`I will review the ${nounUse} carefully ${place}.`,`We are going to discuss the ${nounUse} before the next step.`],
      question:[`Could you help me review this ${nounUse}?`,`What should we do about the ${nounUse} ${place}?`],
    };
  }
  return pickRandom(templates[kind]||templates.present);
}

function buildScenarioPhrases(userText){
  const scenarioKey=detectPhraseScenario(userText)||'daily';
  const tense=detectPhraseTense(userText);
  const w=pickScenarioWord(scenarioKey,userText);
  if(!w)return "I can do that once the vocab data finishes loading. Try again in a second.";
  const kinds=tense==='mixed'?['present','past','future','question']:[tense,tense,'question','future'];
  const lines=kinds.map((kind,i)=>`${i+1}. ${phraseSentence(w,scenarioKey,tense,kind)}`);
  const scenario=PHRASE_SCENARIOS[scenarioKey];
  return `${scenario.zh}：用 "${w.word}" 組合成自然英文\n${lines.join('\n')}\n\nWord note: ${w.word} (${w.pos}) = ${w.definition_zh||w.definition}`;
}

function isVocabIntent(text){
  const lower=text.toLowerCase().trim();
  return /^(?:define|meaning of|tell me about|what(?:'s| is)|use|using|example of|example sentence for|sentence with)\s+/.test(lower)||
    /(?:意思|例句|造句|解釋|查詢|單字|詞根|字根|搭配|同義|近義|反義|考|測驗|小考|用語|情境)/.test(lower)||
    /^[a-z]+\s*(?:詞根|字根|來源|搭配|片語|用法|同義|近義|反義|例句|造句|意思|root|etymology|collocations?|synonyms?|antonyms?|example|sentence|meaning)$/.test(lower)||
    /(?:quiz|test|challenge|check|ask)\s*(?:me|my vocab)?/.test(lower);
}

function formatVocabCard(w,mode='full'){
  const bits=[`${w.word} (${w.pos})`];
  if(w.phonetic)bits.push(w.phonetic);
  const head=bits.join(' · ');
  const zh=w.definition_zh?`中文：${w.definition_zh}`:'';
  const example=w.example?`Example: "${w.example}"`:'';
  const coll=(w.collocations||[]).slice(0,3).join(', ');
  const syn=(w.synonyms||[]).slice(0,4).join(', ');
  const ant=(w.antonyms||[]).slice(0,3).join(', ');
  const roots=(w.etymology?.roots||[]).map(r=>`${r.root} = ${r.meaning_zh||r.meaning}`).join('; ');
  if(mode==='example')return `Sure! ${example} ${w.word} means: ${w.definition} (${w.definition_zh}).`;
  if(mode==='roots')return roots?`${head}\n詞根：${roots}\n${w.mnemonic?.root_memory||''}`:`${head}\nI don't have root notes for this word yet.`;
  if(mode==='collocations')return coll?`${head}\n常見搭配：${coll}\n${example}`:`${head}\nI don't have collocations for this word yet, but ${example}`;
  if(mode==='synonyms')return `${head}\nSynonyms: ${syn||'none listed'}\nAntonyms: ${ant||'none listed'}`;
  return `${head}\n${w.definition}\n${zh}\n${example}${coll?`\nCollocations: ${coll}`:''}${syn?`\nSynonyms: ${syn}`:''}`;
}

// LANGUAGETOOL — grammar check
// ══════════════════════════════════════════════
async function checkGrammar(text){
  // Skip grammar check for Chinese-dominant or non-English input —
  // LanguageTool en-US on CJK text produces meaningless flags
  const enWords=(text.match(/[a-zA-Z]{2,}/g)||[]).length;
  if(enWords===0)return[];
  if(/[\u3400-\u9fff]/.test(text)&&enWords<3)return[];
  try{
    const params=new URLSearchParams({language:'en-US',text});
    const res=await fetch('https://api.languagetool.org/v2/check',{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:params,signal:AbortSignal.timeout(5000)
    });
    if(!res.ok)return localGrammarCheck(text);
    const data=await res.json();
    return data.matches||[];
  }catch{return localGrammarCheck(text)}
}

// Local fallback grammar rules
function localGrammarCheck(text){
  const issues=[];
  const rules=[
    {re:/\ba ([aeiouAEIOU]\w*)/g, fix:(m,w)=>`an ${w}`, msg:`Use "an" before vowel sounds`},
    {re:/\ban ([^aeiouAEIOU\s]\w*)/g, fix:(m,w)=>`a ${w}`, msg:`Use "a" before consonant sounds`},
    {re:/\b(he|she|it) (don't)\b/gi, fix:(m,s,v)=>`${s} doesn't`, msg:`Third person singular: use "doesn't"`},
    {re:/\b(i) (is|are|was|were)\b/gi, fix:(m,s,v)=>`I ${v==='are'?'am':v==='were'?'was':v}`, msg:`"I" takes "am/was"`},
    {re:/\bI are\b/g, fix:()=>'I am', msg:`Use "I am"`},
    {re:/\byesterday i will\b/gi, fix:()=>'yesterday I', msg:`"Yesterday" requires past tense`},
    {re:/\b(goed)\b/g, fix:()=>'went', msg:`"go" past tense is "went"`},
    {re:/\b(thinked)\b/g, fix:()=>'thought', msg:`"think" past tense is "thought"`},
    {re:/\b(buyed)\b/g, fix:()=>'bought', msg:`"buy" past tense is "bought"`},
    {re:/\b(catched)\b/g, fix:()=>'caught', msg:`"catch" past tense is "caught"`},
  ];
  rules.forEach(rule=>{
    let m;const re=new RegExp(rule.re.source,rule.re.flags);
    while((m=re.exec(text))!==null){
      issues.push({
        offset:m.index,length:m[0].length,
        message:rule.msg,
        replacements:[{value:rule.fix(...m)}],
        _local:true
      });
    }
  });
  return issues;
}

// AUDIO
// ══════════════════════════════════════════════
// ── Audio Engine ──
// Strategy: TTS first (always works), then try mp3 for better quality
const AudioCache={};

function ttsSpeak(word,rate=0.82){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);
  u.lang='en-US';u.rate=rate;u.pitch=1;
  // Pick best English voice if available
  const voices=speechSynthesis.getVoices();
  const eng=voices.find(v=>v.lang==='en-US'&&v.localService)||
            voices.find(v=>v.lang.startsWith('en')&&v.localService)||
            voices.find(v=>v.lang.startsWith('en'));
  if(eng)u.voice=eng;
  speechSynthesis.speak(u);
}

async function speakWord(word){
  // Always play TTS immediately so user hears something right away
  ttsSpeak(word);
  // Then silently cache mp3 for next time (better quality)
  if(AudioCache[word]===undefined){
    try{
      const r=await fetch(
        `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`,
        {signal:AbortSignal.timeout(4000)}
      );
      if(!r.ok)throw 0;
      const d=await r.json();
      const f=(d[0]?.phonetics||[]).find(p=>p.audio?.trim());
      AudioCache[word]=f?f.audio:null;
    }catch{AudioCache[word]=null;}
  }
}

// On second+ click, use cached mp3 if available
const _origSpeak=speakWord;
const speakWordSmart=async(word)=>{
  if(AudioCache[word]){
    const a=new Audio(AudioCache[word]);
    a.onerror=()=>ttsSpeak(word);
    a.play().catch(()=>ttsSpeak(word));
  } else {
    await _origSpeak(word);
  }
};
// Override
const speakWordFn=speakWordSmart;

// TOOLTIP
// ══════════════════════════════════════════════
const tooltip=document.getElementById('tooltip');
let tooltipTimeout;

function showTooltip(el,word){
  const w=getVocabWord(word); // O(1) map lookup instead of O(n) scan
  if(!w)return;
  clearTimeout(tooltipTimeout);
  const safeWord=escapeHtml(w.word);
  tooltip.innerHTML=`
    <div class="tt-word">${safeWord}</div>
    <div class="tt-phonetic">${escapeHtml(w.phonetic||'')} · ${escapeHtml(w.pos||'')}</div>
    <div class="tt-def">${escapeHtml(w.definition||'')}</div>
    <div class="tt-def-zh">${escapeHtml(w.definition_zh||'')}</div>
    <div class="tt-syns">${(w.synonyms||[]).slice(0,4).map(s=>`<span class="tt-syn">${escapeHtml(s)}</span>`).join('')}</div>
    <button class="tt-speak">🔊 Play pronunciation</button>
  `;
  tooltip.querySelector('.tt-speak').onclick=()=>speakWordFn(w.word);
  const rect=el.getBoundingClientRect();
  const tw=280;
  let left=rect.left;
  let top=rect.bottom+8;
  if(left+tw>window.innerWidth)left=window.innerWidth-tw-12;
  if(top+200>window.innerHeight)top=rect.top-210;
  tooltip.style.left=left+'px';
  tooltip.style.top=top+'px';
  tooltip.classList.add('show');
}
function hideTooltip(){
  tooltipTimeout=setTimeout(()=>tooltip.classList.remove('show'),200);
}
document.addEventListener('click',e=>{
  if(!e.target.classList.contains('vocab-word')&&!tooltip.contains(e.target)){
    tooltip.classList.remove('show');
  }
});
tooltip.addEventListener('mouseenter',()=>clearTimeout(tooltipTimeout));
tooltip.addEventListener('mouseleave',()=>hideTooltip());

// Precompiled trigger index: single words → exact-token match, phrases → word-boundary regex.
// Fixes substring false positives ("eat" in "great", "ill" in "still", "hot" in "photo").
let TOPIC_INDEX=null;
function buildTopicIndex(){
  TOPIC_INDEX=Object.entries(TOPICS).map(([key,topic])=>{
    const single=new Set(),phrases=[];
    topic.triggers.forEach(t=>{
      if(t.includes(' ')||t.includes("'")){
        phrases.push({re:new RegExp('\\b'+escapeRegex(t)+'\\b','i'),len:t.split(' ').length});
      }else{
        single.add(t);
      }
    });
    return {key,topic,single,phrases};
  });
}

const CTX={
  history:[],   // [{role:'user'|'bot', text, topic}]
  maxLen:5,
  push(role,text,topic=null){
    this.history.push({role,text,topic,ts:Date.now()});
    if(this.history.length>this.maxLen*2) this.history=this.history.slice(-this.maxLen*2);
  },
  lastUserTopic(){
    for(let i=this.history.length-1;i>=0;i--){
      if(this.history[i].role==='user'&&this.history[i].topic) return this.history[i].topic;
    }
    return null;
  },
  lastBotText(){
    for(let i=this.history.length-1;i>=0;i--){
      if(this.history[i].role==='bot') return this.history[i].text;
    }
    return '';
  },
  recentTopics(){
    return this.history.filter(h=>h.topic).map(h=>h.topic).slice(-4);
  },
  botJustAskedQuestion(){
    const last=this.lastBotText();
    return last.endsWith('?');
  },
};

// ── Negation detector ──
const NEGATIONS=['not','no','never','nothing','nobody','nowhere','neither','nor','dont','doesnt','didnt','wont','wouldnt','cant','couldnt','shouldnt','isnt','arent','wasnt','werent','hardly','barely','scarcely'];
function hasNegation(text){
  // strip apostrophes so "don't" → "dont" matches the list
  const tokens=tokenizeWords(text).map(t=>t.replace(/'/g,''));
  return tokens.some(t=>NEGATIONS.includes(t));
}

// ── Sentiment detector ──
const POS_WORDS=['great','good','amazing','wonderful','fantastic','excellent','happy','love','enjoy','excited','thrilled','glad','pleased','awesome','brilliant','perfect','nice','fun','interesting'];
const NEG_WORDS=['bad','terrible','awful','horrible','sad','hate','dislike','angry','frustrated','miserable','depressed','upset','disappointed','annoyed','stressed','worried','scared','nervous','anxious','exhausted','lonely'];
function getSentiment(text){
  const tokens=new Set(tokenizeWords(text));
  const pos=POS_WORDS.filter(w=>tokens.has(w)).length;
  const neg=NEG_WORDS.filter(w=>tokens.has(w)).length;
  if(neg>pos) return 'negative';
  if(pos>neg) return 'positive';
  return 'neutral';
}

const UMEM={
  data:{},
  set(key,val){this.data[key]=val},
  get(key){return this.data[key]||null},
  extract(text){
    const lower=text.toLowerCase();
    const nameMatch=lower.match(/(?:i'm|i am|my name is|call me)\s+([a-z]+)/);
    if(nameMatch&&!this.get('name'))this.set('name',nameMatch[1]);
    const jobMatch=lower.match(/i(?:'m| am) (?:a |an )?([a-z\s]+(?:designer|developer|teacher|student|engineer|doctor|nurse|manager|writer|chef|artist|lawyer|accountant))/);
    if(jobMatch)this.set('job',jobMatch[1].trim());
    const locMatch=lower.match(/(?:i live in|i'm from|i'm in|based in)\s+([a-z\s]+?)(?:\.|,|$)/);
    if(locMatch)this.set('location',locMatch[1].trim());
  },
  personalTouch(){
    const name=this.get('name');
    if(name&&Math.random()<0.25)return name.charAt(0).toUpperCase()+name.slice(1)+', ';
    return '';
  }
};

function safeParse(raw,fallback){
  if(!raw)return fallback;
  try{const v=JSON.parse(raw);return v==null?fallback:v}catch{return fallback}
}

const QUIZ={
  active:false,
  word:null,
  type:null, // 'meaning' | 'brutal'
  opts:[],   // [{word, definition_zh}] for brutal

  // Start a meaning quiz
  startMeaning(){
    if(!VOCAB.length)return null;
    const w=VOCAB[Math.floor(Math.random()*VOCAB.length)];
    this.active=true;this.word=w;this.type='meaning';this.opts=[];
    return w;
  },

  // Start brutal 2-choice (needs mistakes from localStorage)
  startBrutal(){
    const raw=localStorage.getItem('wr_mistakes');
    if(!raw)return null;
    const mistakes=Object.entries(safeParse(raw,{}));
    if(!mistakes.length)return null;
    const [correctWord,data]=mistakes[Math.floor(Math.random()*mistakes.length)];
    const correctVocab=getVocabWord(correctWord);
    const wrongVocab=getVocabWord(data.wrongWord);
    if(!correctVocab||!wrongVocab)return null;
    this.active=true;this.word=correctVocab;this.type='brutal';
    this.opts=shuffle([
      {word:correctVocab.word,def:correctVocab.definition_zh},
      {word:wrongVocab.word,def:wrongVocab.definition_zh},
    ]);
    return {correct:correctVocab,wrong:wrongVocab,opts:this.opts};
  },

  // Check answer
  checkMeaning(userAnswer){
    if(!this.active||!this.word)return null;
    const w=this.word;
    this.active=false;this.word=null;this.type=null;
    const synonyms=[...(w.synonyms||[])];
    const answer=userAnswer.toLowerCase();
    const zhParts=(w.definition_zh||'').replace(/[；;，,。]/g,' ').split(/\s+/).filter(Boolean);
    const correct=synonyms.some(s=>answer.includes(s.toLowerCase()))||
      answer.includes(w.word.toLowerCase())||
      answer.includes(w.definition.toLowerCase().split(' ').slice(0,3).join(' '))||
      zhParts.some(part=>part.length>=2&&userAnswer.includes(part));
    return{word:w,isCorrect:correct};
  },

  checkBrutal(userAnswer){
    if(!this.active||!this.word)return null;
    const correct=this.word;
    const chosen=this.opts.find(o=>
      userAnswer.includes('a')&&this.opts.indexOf(o)===0||
      userAnswer.includes('b')&&this.opts.indexOf(o)===1||
      userAnswer.toLowerCase().includes(o.def.substring(0,8).toLowerCase())||
      userAnswer.toLowerCase().includes(o.word.toLowerCase())
    );
    this.active=false;this.word=null;this.type=null;
    const isCorrect=chosen&&chosen.word===correct.word;
    // Update localStorage streak
    if(isCorrect){
      const raw=localStorage.getItem('wr_mistakes');
      if(raw){
        const all=safeParse(raw,{});
        if(all[correct.word]){
          all[correct.word].streak=(all[correct.word].streak||0)+1;
          if(all[correct.word].streak>=2)delete all[correct.word];
          localStorage.setItem('wr_mistakes',JSON.stringify(all));
        }
      }
    } else {
      const raw=localStorage.getItem('wr_mistakes');
      if(raw){
        const all=safeParse(raw,{});
        if(all[correct.word])all[correct.word].streak=0;
        localStorage.setItem('wr_mistakes',JSON.stringify(all));
      }
    }
    return{word:correct,isCorrect,chosen};
  },

  hasMistakes(){
    const raw=localStorage.getItem('wr_mistakes');
    if(!raw)return false;
    return Object.keys(safeParse(raw,{})).length>0;
  },
};

function shuffle(arr){return[...arr].sort(()=>Math.random()-.5)}

function buildCallbackPrefix(currentTopic){
  const recentTopics=CTX.recentTopics();
  const prevTopic=recentTopics[recentTopics.length-2];
  if(!prevTopic||prevTopic===currentTopic)return '';
  const CALLBACKS={

function getBotResponse(userText,quoteText=null,grammarMatches=[]){
  // Grammar-linked opening: naturally acknowledge error before continuing
  const hasErrors=grammarMatches&&grammarMatches.length>0;
  const GRAMMAR_OPENERS=[
    "I get what you mean — just a small thing worth noting! ",
    "I understood you perfectly! Quick language note: ",
    "Nice effort! One small tweak: ",
    "Got it! By the way, ",
  ];
  const grammarPrefix=hasErrors&&Math.random()<0.55
    ?GRAMMAR_OPENERS[Math.floor(Math.random()*GRAMMAR_OPENERS.length)]
    :'';
  // If user quoted a bot message, inject it as context
  if(quoteText){
    const quoteLower=quoteText.toLowerCase();
    // Score quoted text against topics to extract topic (whole-word matching)
    if(!TOPIC_INDEX)buildTopicIndex();
    const qTokens=new Set(tokenizeWords(quoteLower));
    let qBest=null,qScore=0;
    for(const {key,single,phrases} of TOPIC_INDEX){
      let s=0;
      for(const tok of qTokens){if(single.has(tok))s+=1}
      for(const p of phrases){if(p.re.test(quoteLower))s+=p.len}
      if(s>qScore){qScore=s;qBest=key}
    }
    if(qBest&&qScore>0){
      // Push quoted topic into context so continuation logic picks it up
      CTX.push('user','[quoted: '+quoteText.slice(0,60)+']',qBest);
    }
    // Prepend acknowledgement
    const acks=[
      "Coming back to what I said earlier — ",
      "Right, on that point — ",
      "Good call bringing that up again — ",
      "Picking up from that — ",
    ];
    const ack=acks[Math.floor(Math.random()*acks.length)];
    // Get normal response and prepend ack
    const base=_getBotResponseCore(userText);
    return grammarPrefix+ack+base;
  }
  return grammarPrefix+_getBotResponseCore(userText);
}
function _getBotResponseCore(userText){
  const lower=userText.toLowerCase().trim();
  const words=lower.split(/\s+/);
  const isNegated=hasNegation(lower);
  const sentiment=getSentiment(lower);
  const lastTopic=CTX.lastUserTopic();
  const recentTopics=CTX.recentTopics();
  const botAskedQ=CTX.botJustAskedQuestion();
  shiftCooldown=Math.max(0,shiftCooldown-1);
  UMEM.extract(userText);
  const prefix=UMEM.personalTouch();

  // 0. QUIZ ANSWER — must run FIRST, before any other branch can hijack the reply
  if(QUIZ.active){
    if(QUIZ.type==='meaning'){
      const result=QUIZ.checkMeaning(userText);
      if(result){
        CTX.push('user',userText,'quiz');
        if(result.isCorrect){
          return `✅ Exactly right! "${result.word.word}" means ${result.word.definition}. Great job — your vocabulary is strong!`;
        } else {
          return `Not quite! "${result.word.word}" means: ${result.word.definition} (${result.word.definition_zh}). The example: "${result.word.example}" — now you know!`;
        }
      }
    }
    if(QUIZ.type==='brutal'){
      const result=QUIZ.checkBrutal(userText);
      if(result){
        CTX.push('user',userText,'quiz');
        if(result.isCorrect){
          return `💪 Correct! "${result.word.word}" — ${result.word.definition_zh}. You're chipping away at your mistake list!`;
        } else {
          return `💀 Not this time! The correct answer was "${result.word.word}" — ${result.word.definition_zh}. Example: "${result.word.example}". Keep at it!`;
        }
      }
    }
  }

  // -2. Scenario phrase generator — daily/work/travel/social expressions
  if(isPhraseIntent(userText)){
    CTX.push('user',userText,'vocab_cmd');
    return buildScenarioPhrases(userText);
  }

  // -1. Celebrate if user naturally used a vocab word
  const usedVocab=(!lower.startsWith('what')&&!lower.startsWith('define')&&
    !lower.includes('use the word')&&words.length>3)
      ? findMentionedVocab(userText)
      : null;
  if(usedVocab&&Math.random()<0.45){
    // Celebrate + ask a natural follow-up (no vocab injection after this)
    const c=[
      `Nice use of "${usedVocab.word}"! That's exactly the right context.`,
      `I noticed you used "${usedVocab.word}" — great vocabulary!`,
      `Good one — "${usedVocab.word}" fits perfectly there.`,
    ][Math.floor(Math.random()*3)];
    CTX.push('user',userText,null);
    CTX._lastCelebrated=usedVocab.word; // prevent double-mention
    const f=[
      " What's going on exactly?",
      " Tell me more about the situation.",
      " What made you realize that?",
      " How are you planning to handle it?",
    ][Math.floor(Math.random()*4)];
    return c+f;
  }

  // 0. Direct vocab mode — "advocate 詞根" / "advocate collocations"
  const directVocabMode=lower.match(/^([a-z]+)\s*(詞根|字根|來源|搭配|片語|用法|同義|近義|反義|例句|造句|意思|root|etymology|collocations?|synonyms?|antonyms?|example|sentence|meaning)$/);
  if(directVocabMode){
    const found=getVocabWord(directVocabMode[1]);
    const mode=directVocabMode[2];
    if(found){
      CTX.push('user',userText,'vocab_cmd');
      if(/root|etymology|詞根|字根|來源/.test(mode))return formatVocabCard(found,'roots');
      if(/collocation|搭配|片語|用法/.test(mode))return formatVocabCard(found,'collocations');
      if(/synonym|antonym|同義|近義|反義/.test(mode))return formatVocabCard(found,'synonyms');
      if(/example|sentence|例句|造句/.test(mode))return formatVocabCard(found,'example');
      return formatVocabCard(found,'full');
    }
  }

  // 0a. Vocab command — "use X in a sentence" / "what does X mean" / "example of X"
  const vocabCmdMatch=lower.match(/(?:use|using|example of|example sentence for|sentence with|what (?:is|does)|define|meaning of|tell me about|意思|例句|造句|解釋|查詢|單字)\s+(?:the word\s+)?['""]?([a-z]+)['""]?/);
  if(vocabCmdMatch){
    const reqWord=vocabCmdMatch[1].toLowerCase();
    const found=getVocabWord(reqWord);
    if(found){
      const wantsRoots=/root|etymology|詞根|字根|來源/.test(lower);
      const wantsCollocations=/collocation|搭配|片語|用法/.test(lower);
      const wantsSynonyms=/synonym|antonym|同義|近義|反義/.test(lower);
      const wantsExample=/example|sentence|例句|造句|use|using/.test(lower);
      CTX.push('user',userText,'vocab_cmd');
      if(wantsRoots)return formatVocabCard(found,'roots');
      if(wantsCollocations)return formatVocabCard(found,'collocations');
      if(wantsSynonyms)return formatVocabCard(found,'synonyms');
      if(wantsExample)return formatVocabCard(found,'example');
      return formatVocabCard(found,'full');
    }
  }

  // 0b. Root lookup — "words with spect" / "spect 詞根"
  const rootMatch=lower.match(/(?:root|字根|詞根|words with|包含)\s+([a-z]{2,})|([a-z]{2,})\s*(?:root|字根|詞根)/);
  if(rootMatch){
    const root=(rootMatch[1]||rootMatch[2]||'').toLowerCase();
    const matches=VOCAB_BY_ROOT.get(root)||[];
    if(matches.length){
      CTX.push('user',userText,'vocab_cmd');
      const sample=matches.slice(0,6).map(w=>`${w.word} (${w.definition_zh})`).join(', ');
      return `Words connected to the root "${root}": ${sample}. Want me to quiz you on one of them?`;
    }
  }

  // Explicit quiz request — strict matching to avoid false triggers like "check my email"
  const wantsQuiz=/(?:^|\s)quiz(?:\s+me)?\b/.test(lower)||
    /\b(?:test|challenge)\s+(?:me|my vocab)\b/.test(lower)||
    /考考|測驗|小考|單字考/.test(userText)||
    lower==='quiz'||lower==='test me'||lower==='challenge me';
  if(wantsQuiz){
    // Prefer brutal if mistakes exist
    if(QUIZ.hasMistakes()&&Math.random()<0.6){
      const data=QUIZ.startBrutal();
      if(data){
        CTX.push('user',userText,'quiz');
        return `💀 Brutal mode! You got this one wrong before. Which definition is correct for "${data.correct.word}"?\nA. ${data.opts[0].def}\nB. ${data.opts[1].def}`;
      }
    }
    const w=QUIZ.startMeaning();
    if(w){
      CTX.push('user',userText,'quiz');
      return `🎯 Vocab quiz! What does the word "${w.word}" (${w.pos}) mean? Just tell me in your own words!`;
    }
  }

  // 0d. Pure vocab question — "what is abandon" / "define analyze"
  const defineMatch=lower.match(/^(?:what(?:'s| is) |define |meaning of |tell me about )([a-z]+)\??$/);
  if(defineMatch){
    const reqWord=defineMatch[1].toLowerCase();
    const found=getVocabWord(reqWord);
    if(found){
      CTX.push('user',userText,'vocab_cmd');
      return formatVocabCard(found,'full');
    }
  }

  // 1. Short reply after bot asked a question
  if(botAskedQ&&words.length<=5){
    if(sentiment==='positive')return [
      prefix+"That's good to hear! What's been the best part?",
      "Nice! I'm glad things are going okay. What else is on your mind?",
      prefix+"Love that! Keep it up. What's next for you?",
      "Great! That must feel good. How long has it been that way?",
    ][Math.floor(Math.random()*4)];
    if(sentiment==='negative')return [
      prefix+"Aw, I'm sorry to hear that. Want to talk about what's going on?",
      "That sounds tough. What's been the hardest part of it?",
      "I hear you. Is there anything that's been helping, even a little?",
      prefix+"That's rough. How long has it been like this?",
      "I'm sorry. Does it feel like things might improve soon, or does it feel stuck?",
    ][Math.floor(Math.random()*5)];
    return [
      "I see! That's interesting. Can you say more about that?",
      prefix+"Got it. And how do you feel about it overall?",
      "Okay! What's your take on it?",
      "Fair enough. What led you to that?",
      "Interesting. Is that something that's been on your mind for a while?",
    ][Math.floor(Math.random()*5)];
  }

  // 2. Negation overrides
  if(isNegated){
    for(const [key,resps] of Object.entries(NEGATION_OVERRIDES)){
      if(lower.includes(key))return resps[Math.floor(Math.random()*resps.length)];
    }
    if(words.length<=6)return [
      "Oh interesting — so it's more the opposite? Tell me more.",
      "Ah I see — not quite that. What's it actually like?",
      "Got it, so that's not quite right. How would you describe it?",
    ][Math.floor(Math.random()*3)];
  }

  // 3. Topic continuation
  if(lastTopic&&recentTopics.filter(t=>t===lastTopic).length>=1&&FOLLOWUPS[lastTopic]){
    if(Math.random()<0.38){
      const pool=FOLLOWUPS[lastTopic];
      return pool[Math.floor(Math.random()*pool.length)];
    }
  }

  // 4. Score and match topics (whole-word matching via precompiled index)
  const hasQuestionStructure=lower.includes('?')||['what','who','where','when','why','how','can you','could you','do you','would you'].some(q=>lower.startsWith(q));
  if(!TOPIC_INDEX)buildTopicIndex();
  const tokenSet=new Set(tokenizeWords(lower));
  let bestTopic=null,bestScore=0;
  for(const {key,topic,single,phrases} of TOPIC_INDEX){
    let score=0;
    for(const tok of tokenSet){
      if(single.has(tok))score+=1.5;
    }
    for(const p of phrases){
      if(p.re.test(lower))score+=p.len+0.5;
    }
    // Penalize greeting if sentence is long or has question structure
    if(key==='greeting'&&(words.length>4||hasQuestionStructure)) score*=0.2;
    if(score>bestScore){bestScore=score;bestTopic={key,topic};}
  }
  // Boost score if user mentioned a vocab word related to a topic
  if(VOCAB.length){
    const mentionedVocab=findMentionedVocab(userText);
    for(const [key,topic] of Object.entries(TOPICS)){
      const tagMap={
        study:['academic','language','math'],work:['business','economics'],
        health:['science','psychology'],money:['finance','economics'],
        technology:['technology'],feeling:['psychology'],
        legal:['law','politics'],motivation:['common'],
      };
      const tags=tagMap[key]||[];
      const vocabHit=mentionedVocab&&tags.some(t=>(mentionedVocab.tags||[]).includes(t));
      if(vocabHit&&(!bestTopic||bestScore<2)){
        bestTopic={key,topic};bestScore=2;
      }
    }
  }

  if(bestTopic&&bestScore>0){
    const pool=bestTopic.topic.responses;
    const cb=buildCallbackPrefix(bestTopic.key);
    const base=pool[Math.floor(Math.random()*pool.length)];
    CTX.push('user',userText,bestTopic.key);
    if(shiftCooldown===0&&Math.random()<0.12){
      shiftCooldown=4;
      // 30% chance of proactive quiz instead of shift phrase
      if(Math.random()<0.3&&VOCAB.length){
        if(QUIZ.hasMistakes()&&Math.random()<0.5){
          const data=QUIZ.startBrutal();
          if(data) return base+' 💀 By the way — brutal quiz time! Which is correct for "'+data.correct.word+'"?\nA. '+data.opts[0].def+'\nB. '+data.opts[1].def;
        }
        const w=QUIZ.startMeaning();
        if(w) return base+' 🎯 Quick vocab check: what does "'+w.word+'" mean?';
      }
      return base+' '+PROACTIVE_SHIFTS[Math.floor(Math.random()*PROACTIVE_SHIFTS.length)];
    }
    return cb+base;
  }
  CTX.push('user',userText,null);

  // 5. Sentiment fallbacks
  if(sentiment==='negative')return [
    prefix+"That doesn't sound great. What's been happening?",
    "I'm sorry to hear that. Do you want to talk about what's going on?",
    "That sounds rough. What's been the hardest part?",
    prefix+"I hear that. How long has it been like this for you?",
    "That's a lot. Is there anything that's been helping, even a little?",
    "Oof. Sometimes things just pile up. What would make the biggest difference right now?",
  ][Math.floor(Math.random()*6)];
  if(sentiment==='positive')return [
    prefix+"That's great to hear! What's been making things feel good?",
    "Love the positivity! What's been the highlight?",
    "That's really nice! How did that come about?",
    prefix+"Great! It's always good to hear when things go well. What's next?",
    "Sounds like you're in a good place! What's been the best part?",
  ][Math.floor(Math.random()*5)];

  // 6. Structure-aware
  const questionWords=['what','who','where','when','why','how','do you','are you','can you','have you','did you','would you'];
  if(lower.endsWith('?')||questionWords.some(q=>lower.startsWith(q)))return [
    "That's a great question! What's your own take on it?",
    "Hmm, it really depends. What made you think of that?",
    "Good question! What do you think the answer might be?",
    "I'd love to explore that. What's your gut feeling?",
    "Interesting question — have you been thinking about this for a while?",
  ][Math.floor(Math.random()*5)];
  if(words.length<=4)return [
    "Tell me more! I'd love to hear your full thoughts.",
    "Interesting! Can you expand on that a bit?",
    "Go on — I'm all ears!",
    "Really? What do you mean exactly?",
    "Say more! What's behind that?",
    "I want to hear more. What's the context?",
  ][Math.floor(Math.random()*6)];

  // 7. Rich general fallbacks
  const base=[
    prefix+"That's really interesting! How did that come about?",
    "I see what you mean. How do you feel about it overall?",
    "Interesting perspective! What made you think about that?",
    "I hadn't considered that angle. Can you tell me more?",
    "That sounds like quite an experience. What happened next?",
    prefix+"I'd love to understand more. What's your take on it?",
    "That's a great point. Has it always been like that for you?",
    "I appreciate you sharing that. What would you do differently?",
    "Fascinating! Does that come up often?",
    "Sounds like there's more to it. What's the backstory?",
    "Wow, that's a lot to sit with. How are you processing it?",
    "That really resonates. What do you think the next step is?",
    "I like how you put that. Do others around you see it the same way?",
    "That's worth thinking about. What does that mean for you going forward?",
  ][Math.floor(Math.random()*14)];
  if(shiftCooldown===0&&Math.random()<0.10){shiftCooldown=4;return base+' '+PROACTIVE_SHIFTS[Math.floor(Math.random()*PROACTIVE_SHIFTS.length)];}
  return base;
}


// ══════════════════════════════════════════════
// RENDER HELPERS
// ══════════════════════════════════════════════
function formatTime(date){
  return date.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});
}

function highlightVocab(text){
  if(!VOCAB.length)return escapeHtml(text);
  // Split text into tokens preserving spaces and punctuation
  const tokens=text.split(/([\s\.,!?;:'"\-()]+)/);
  return tokens.map(token=>{
    const lower=token.toLowerCase().replace(/[^a-z]/g,'');
    if(VOCAB_WORD_SET.has(lower)){
      const safe=escapeHtml(token);
      return `<span class="vocab-word" onclick="handleVocabClick(this,'${lower}')" onmouseenter="showTooltip(this,'${lower}')" onmouseleave="hideTooltip()">${safe}</span>`;
    }
    return escapeHtml(token);
  }).join('');
}

function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escapeRegex(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

function handleVocabClick(el,word){showTooltip(el,word)}

function renderGrammarFixes(matches,originalText){
  if(!matches.length)return'';
  const fixes=matches.slice(0,3).map(m=>{
    const wrong=originalText.substr(m.offset,m.length);
    const right=m.replacements?.[0]?.value||'—';
    return`<div style="margin-bottom:4px">
      <span class="fix-wrong">${escapeHtml(wrong)}</span>→
      <span class="fix-right">${escapeHtml(right)}</span>
      <div class="fix-explain">${escapeHtml(m.message||'')}</div>
    </div>`;
  }).join('');
  return`<div class="grammar-fix">
    <div class="fix-label">💡 Quick fix</div>
    ${fixes}
  </div>`;
}

// ══════════════════════════════════════════════
// MESSAGE RENDERING
// ══════════════════════════════════════════════
const messagesEl=document.getElementById('messages');

function appendMessage(role,text,grammarFixes=[],quoteText=null){
  const row=document.createElement('div');
  row.className=`msg-row ${role}`;
  const avatar=document.createElement('div');
  avatar.className=`msg-avatar ${role}`;
  avatar.textContent=role==='bot'?'🤖':'🙂';
  const bubble=document.createElement('div');
  bubble.className=`bubble ${role}`;

  // Quote reference (if this message quotes a previous one)
  if(quoteText){
    const qRef=document.createElement('div');
    qRef.className='quote-ref';
    qRef.textContent=quoteText;
    bubble.appendChild(qRef);
  }

  const content=document.createElement('div');
  content.className='msg-content';
  content.innerHTML=role==='bot'?highlightVocab(text):escapeHtml(text);
  if(role==='bot')content.dataset.raw=text;
  bubble.appendChild(content);

  // Translate area (bot only)
  if(role==='bot'){
    const transEl=document.createElement('div');
    transEl.className='translated-text';
    bubble.appendChild(transEl);
  }

  if(grammarFixes.length){
    const fix=document.createElement('div');
    fix.innerHTML=renderGrammarFixes(grammarFixes,text);
    bubble.appendChild(fix);
  }

  const time=document.createElement('span');
  time.className='time';
  time.textContent=formatTime(new Date());
  bubble.appendChild(time);

  // Actions toolbar (bot only)
  if(role==='bot'){
    const actions=document.createElement('div');
    actions.className='bubble-actions';

    const transBtn=document.createElement('button');
    transBtn.textContent='🌐 譯';
    transBtn.title='翻譯成中文';
    transBtn.onclick=()=>toggleTranslate(transBtn,bubble,text);

    const quoteBtn=document.createElement('button');
    quoteBtn.textContent='💬 引用';
    quoteBtn.title='引用這條訊息';
    quoteBtn.onclick=()=>quoteMessage(text);

    actions.appendChild(transBtn);
    actions.appendChild(quoteBtn);
    bubble.appendChild(actions);
  }

  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop=messagesEl.scrollHeight;
  return bubble;
}

function showTyping(){
  const row=document.createElement('div');
  row.className='msg-row bot';row.id='typing-row';
  const avatar=document.createElement('div');
  avatar.className='msg-avatar bot';avatar.textContent='🤖';
  const bubble=document.createElement('div');
  bubble.className='bubble bot';
  bubble.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';
  row.appendChild(avatar);row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop=messagesEl.scrollHeight;
}
function hideTyping(){
  const el=document.getElementById('typing-row');
  if(el)el.remove();
}

// ══════════════════════════════════════════════
// CHAT LOGIC
// ══════════════════════════════════════════════
const LS_LAST_CHAT='wr_chat_last';
const LS_HISTORY='wr_chat_history';
let isProcessing=false;

// ── CHAT HISTORY PERSISTENCE ──
// Restores the last 30 messages on reload and seeds CTX so context survives refresh
const HISTORY={
  max:30,
  load(){return safeParse(localStorage.getItem(LS_HISTORY),[])},
  push(role,text){
    const h=this.load();
    h.push({role,text,ts:Date.now()});
    try{localStorage.setItem(LS_HISTORY,JSON.stringify(h.slice(-this.max)))}catch{}
  },
  restore(){
    const h=this.load();
    if(!h.length)return false;
    h.forEach(m=>{
      appendMessage(m.role,m.text);
      CTX.push(m.role,m.text);
    });
    return true;
  },
};

// ── SMART VOCAB INTEGRATION ──
// Use vocab example sentences as natural conversation injections
function maybeInjectVocab(botText,userText){
  if(QUIZ.active)return botText; // never append random vocab onto a quiz question
  if(Math.random()>0.22||!VOCAB.length)return botText;

  // 1. Try to find a word directly mentioned by user
  // Skip if we just celebrated this word (avoid double-mention)
  let pick=findMentionedVocab(userText);
  if(pick&&pick.word===CTX._lastCelebrated)pick=null;
  CTX._lastCelebrated=null; // reset after one use

  // 2. Try topic-relevance: match vocab tags to current topic
  if(!pick){
    pick=pickRelatedVocab(CTX.lastUserTopic(),userText);
  }

  // 3. Fallback: random word
  if(!pick) pick=VOCAB[Math.floor(Math.random()*VOCAB.length)];

  // Use vocab example sentence as bridge — grammatically guaranteed correct
  const bridges=[
    w=>`By the way, here's a vocab word that comes to mind: "${w.word}" — as in, "${w.example}"`,
    w=>`This reminds me of the word "${w.word}" (${w.definition}). For example: "${w.example}"`,
    w=>`Random vocab note: "${w.word}" — ${w.definition}. Example: "${w.example}"`,
    w=>`Speaking of which — the word "${w.word}" fits here nicely. "${w.example}"`,
  ];
  const bridge=bridges[Math.floor(Math.random()*bridges.length)];
  return botText+' '+bridge(pick);
}

// ── TRANSLATE ──
// Try multiple free APIs in sequence
async function translateText(text){
  // 1. MyMemory API
  try{
    const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|zh-TW`;
    const r=await fetch(url,{signal:AbortSignal.timeout(6000)});
    if(r.ok){
      const d=await r.json();
      if(d.responseStatus===200&&d.responseData?.translatedText&&
         !d.responseData.translatedText.includes('QUERY LENGTH')){
        return d.responseData.translatedText;
      }
    }
  }catch{}
  // 2. Lingva Translate (open source Google Translate frontend)
  try{
    const url=`https://lingva.ml/api/v1/en/zh/${encodeURIComponent(text)}`;
    const r=await fetch(url,{signal:AbortSignal.timeout(6000)});
    if(r.ok){
      const d=await r.json();
      if(d.translation) return d.translation;
    }
  }catch{}
  // 3. Fallback: use browser's built-in if available
  return null;
}

async function toggleTranslate(btn,bubble,originalText){
  const transEl=bubble.querySelector('.translated-text');
  if(transEl.classList.contains('show')){
    transEl.classList.remove('show');
    btn.textContent='🌐 譯';
    btn.classList.remove('active');
    return;
  }
  btn.textContent='⏳';btn.disabled=true;
  if(transEl.dataset.cached){
    transEl.textContent=transEl.dataset.cached;
    transEl.classList.add('show');
    btn.textContent='🌐 譯';btn.classList.add('active');btn.disabled=false;
    return;
  }
  const result=await translateText(originalText);
  if(result){
    transEl.textContent=result;
    transEl.dataset.cached=result;
    transEl.classList.add('show');
    btn.classList.add('active');
  }else{
    transEl.textContent='翻譯服務暫時無法使用，請稍後再試。';
    transEl.classList.add('show');
  }
  btn.textContent='🌐 譯';btn.disabled=false;
}

// ── QUOTE ──
let quotedMessage=null;
function quoteMessage(text){
  quotedMessage=text;
  document.getElementById('quotedText').textContent=text;
  document.getElementById('quote-bar').classList.add('show');
  document.getElementById('msgInput').focus();
}
function cancelQuote(){
  quotedMessage=null;
  document.getElementById('quote-bar').classList.remove('show');
}

function saveLastChat(){localStorage.setItem(LS_LAST_CHAT,new Date().toISOString())}

async function sendMessage(){
  const input=document.getElementById('msgInput');
  const text=input.value.trim();
  if(!text||isProcessing)return;
  isProcessing=true;
  input.value='';
  autoResize(input);
  document.getElementById('send-btn').disabled=true;

  // Hide quick phrases on first message
  hideQuickPhrases();
  // User bubble — include quote reference if active
  const activeQuote=quotedMessage;
  appendMessage('user',text,[],activeQuote);
  HISTORY.push('user',text);
  saveLastChat();

  // Grammar check runs IN PARALLEL with the typing delay —
  // perceived latency becomes max(grammar, delay) instead of grammar + delay
  showTyping();
  const typingDelay=new Promise(r=>setTimeout(r,600+Math.random()*800));
  let [grammarMatches]=await Promise.all([checkGrammar(text),typingDelay]);
  if(isVocabIntent(text))grammarMatches=[];
  if(activeQuote) cancelQuote();

  // Grammar-linked response: if errors found, bot weaves correction into reply
  let botText=getBotResponse(text,activeQuote,grammarMatches);
  if(!isPhraseIntent(text))botText=maybeInjectVocab(botText,text);
  hideTyping();

  // Bot reply
  appendMessage('bot',botText);
  CTX.push('bot',botText);
  HISTORY.push('bot',botText);

  // Grammar fix bubble (separate, only for multiple errors or complex ones)
  const complexErrors=grammarMatches.filter(m=>m.replacements&&m.replacements.length>0&&m.message);
  if(complexErrors.length>1||(complexErrors.length===1&&text.split(' ').length>6)){
    await new Promise(r=>setTimeout(r,420));
    const fixBubble=document.createElement('div');
    fixBubble.className='msg-row bot';
    const av=document.createElement('div');av.className='msg-avatar bot';av.textContent='🤖';
    const bu=document.createElement('div');bu.className='bubble bot';
    bu.innerHTML=renderGrammarFixes(complexErrors,text);
    const ti=document.createElement('span');ti.className='time';ti.textContent=formatTime(new Date());
    bu.appendChild(ti);
    fixBubble.appendChild(av);fixBubble.appendChild(bu);
    messagesEl.appendChild(fixBubble);
    messagesEl.scrollTop=messagesEl.scrollHeight;
  }

  isProcessing=false;
  document.getElementById('send-btn').disabled=false;
  input.focus();
}

// ══════════════════════════════════════════════
// PROACTIVE MESSAGE (if no chat for >24h)
// ══════════════════════════════════════════════
function checkProactive(){
  const last=localStorage.getItem(LS_LAST_CHAT);
  if(!last)return; // first visit — let greeting handle it
  const diff=Date.now()-new Date(last).getTime();
  const h24=24*60*60*1000;
  if(diff>h24){
    const msg=PROACTIVE_OPENERS[Math.floor(Math.random()*PROACTIVE_OPENERS.length)];
    setTimeout(()=>{
      const banner=document.createElement('div');
      banner.className='proactive-banner';
      banner.textContent="WordBot missed you! 👋";
      messagesEl.appendChild(banner);
      messagesEl.scrollTop=messagesEl.scrollHeight;
      setTimeout(()=>appendMessage('bot',msg),800);
    },500);
  }
}

// ══════════════════════════════════════════════
// INPUT HANDLING
// ══════════════════════════════════════════════
function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}
const input=document.getElementById('msgInput');
input.addEventListener('input',()=>autoResize(input));
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}
});

// BOOT
// ══════════════════════════════════════════════
const QUICK_PHRASES=[
  {label:"👋  How are you?",           text:"Hey! How are you doing today?"},
  {label:"📚  Talk about studying",    text:"I've been studying English lately. Any tips?"},
  {label:"💼  Talk about work",        text:"Work has been pretty hectic for me recently."},
  {label:"🌍  Use a vocab word",       text:"Can you use the word 'analyze' in a sentence?"},
  {label:"🧩  情境用語",              text:"請用這些單字庫組合 4 句職場用語，包含現在、過去、未來和問句。"},
  {label:"😄  Just chat",             text:"I just want to have a casual conversation!"},
];

function showQuickPhrases(){
  const container=document.getElementById('quick-phrases');
  container.innerHTML='';
  QUICK_PHRASES.forEach(p=>{
    const chip=document.createElement('button');
    chip.className='qp-chip';
    chip.textContent=p.label;
    chip.onclick=()=>{
      hideQuickPhrases();
      document.getElementById('msgInput').value=p.text;
      sendMessage();
    };
    container.appendChild(chip);
  });
}

function hideQuickPhrases(){
  const container=document.getElementById('quick-phrases');
  container.style.transition='opacity .25s';
  container.style.opacity='0';
  setTimeout(()=>{container.innerHTML='';container.style.opacity='';container.style.transition='';},260);
}

window.addEventListener('load',()=>{
  const greetings=[
    "Hey! Welcome back. Feel free to chat with me in English about anything.",
    "Hello! I'm WordBot. Chat with me in English — I'll gently correct any grammar issues I spot.",
    "Hi there! Let's have a conversation. Don't worry about mistakes — that's how we learn!",
    "Hey! Great to have you here. What's on your mind today?",
  ];
  const isFirstVisit=!localStorage.getItem(LS_LAST_CHAT);
  if(isFirstVisit){
    setTimeout(()=>{
      appendMessage('bot',greetings[Math.floor(Math.random()*greetings.length)]);
      setTimeout(showQuickPhrases,300);
    },400);
  } else {
    const restored=HISTORY.restore();
    checkProactive();
    if(!restored)setTimeout(showQuickPhrases,600);
  }
  input.focus();
});
</script>
