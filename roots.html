<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>字根探索 — WordRoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#c8f060;--accent2:#60c8f0;--red:#f06464;--orange:#f0a060;
  --bg:#0e0f11;--surface:#16181c;--surface2:#1e2026;
  --border:#2a2d35;--text:#e8eaf0;--muted:#6b7080;--dim:#3a3f50;
  --serif:'DM Serif Display',serif;--mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ── Header ── */
#header{
  padding:16px 20px;display:flex;align-items:center;gap:14px;
  border-bottom:1px solid var(--border);background:var(--bg);
  position:sticky;top:0;z-index:50;
}
.back-btn{
  color:var(--muted);font-size:20px;text-decoration:none;
  line-height:1;padding:4px;border-radius:6px;transition:color .15s;
}
.back-btn:hover{color:var(--text)}
.header-title{font-family:var(--serif);font-size:20px;color:var(--text);flex:1}
.header-sub{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* ── Screen container ── */
#screen{flex:1;padding:20px;display:flex;flex-direction:column;gap:16px}

/* ── Today task card ── */
.task-card{
  background:linear-gradient(135deg,rgba(200,240,96,.07),rgba(200,240,96,.02));
  border:1px solid rgba(200,240,96,.2);border-radius:16px;padding:20px;
}
.task-label{font-family:var(--mono);font-size:13px;color:var(--accent);
  text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.task-title{font-family:var(--serif);font-size:26px;color:var(--text);margin-bottom:6px}
.task-items{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.task-item{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--muted)}
.task-item span.num{font-family:var(--mono);font-size:14px;color:var(--accent);
  background:rgba(200,240,96,.1);border-radius:4px;padding:1px 7px}
.task-time{font-family:var(--mono);font-size:13px;color:var(--dim);margin-top:8px}
.btn-primary{
  width:100%;padding:14px;border-radius:12px;border:none;
  background:var(--accent);color:#0e0f11;font-family:var(--sans);font-size:16px;
  font-weight:700;cursor:pointer;margin-top:12px;transition:all .18s;
}
.btn-primary:hover{background:#d8ff70}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}

/* ── Stats row ── */
.stats-row{
  display:flex;gap:10px;
}
.stat-chip{
  flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px;text-align:center;
}
.stat-num{font-family:var(--serif);font-size:22px;color:var(--text)}
.stat-lbl{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}

/* ── Root intro card ── */
.root-intro{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;overflow:hidden;
}
.root-header{
  background:linear-gradient(135deg,rgba(96,200,240,.08),transparent);
  padding:28px 24px 20px;border-bottom:1px solid var(--border);
  text-align:center;
}
.root-chip{
  display:inline-block;font-family:var(--mono);font-size:28px;color:var(--accent2);
  background:rgba(96,200,240,.08);border:1px solid rgba(96,200,240,.2);
  border-radius:10px;padding:8px 20px;margin-bottom:14px;letter-spacing:2px;
}
.root-meaning-en{font-family:var(--serif);font-size:22px;color:var(--text);margin-bottom:4px}
.root-meaning-zh{font-size:16px;color:var(--muted)}
.root-origin{font-family:var(--mono);font-size:13px;color:var(--dim);margin-top:8px}
.root-body{padding:18px 20px}
.root-hint{font-size:15px;color:var(--muted);line-height:1.7;
  background:var(--surface2);border-radius:8px;padding:12px 14px}
.root-hint strong{color:var(--accent2)}

/* ── Word card ── */
.word-cards{display:flex;flex-direction:column;gap:12px}
.word-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:18px 20px;
}
.word-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.word-en{font-family:var(--serif);font-size:24px;color:var(--text)}
.word-pos{font-family:var(--mono);font-size:13px;color:var(--dim);margin-top:4px}
.word-phonetic{font-family:var(--mono);font-size:14px;color:var(--muted)}
.word-breakdown{
  display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;
}
.break-part{
  font-family:var(--mono);font-size:13px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:5px;padding:3px 9px;color:var(--muted);
}
.break-part .accent{color:var(--accent2)}
.word-zh{font-size:17px;color:var(--text);margin:6px 0 2px}
.word-example{font-size:13px;color:var(--dim);font-style:italic;line-height:1.6;border-left:2px solid var(--border);padding-left:10px;margin-top:8px}

/* ── Quiz ── */
.quiz-progress{
  display:flex;gap:8px;align-items:center;margin-bottom:4px;
}
.quiz-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .3s}
.quiz-dot.done{background:var(--accent)}
.quiz-dot.current{background:var(--accent2)}
.quiz-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:20px;
}
.quiz-q{font-size:17px;color:var(--text);line-height:1.6;margin-bottom:16px}
.quiz-word{font-family:var(--serif);font-size:26px;color:var(--accent2);display:block;margin-bottom:4px}
.quiz-opts{display:flex;flex-direction:column;gap:9px}
.quiz-opt{
  padding:13px 16px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface2);font-size:16px;color:var(--text);
  cursor:pointer;transition:all .18s;text-align:left;font-family:var(--sans);
  display:flex;align-items:center;gap:10px;
}
.quiz-opt:hover:not(:disabled){border-color:var(--accent2);background:rgba(96,200,240,.06)}
.quiz-opt.correct{border-color:var(--accent)!important;background:rgba(200,240,96,.08)!important;color:var(--accent)}
.quiz-opt.wrong{border-color:var(--red)!important;background:rgba(240,100,100,.06)!important;color:var(--red)}
.quiz-opt:disabled{cursor:default}
.opt-key{font-family:var(--mono);font-size:13px;color:var(--dim);min-width:20px}
.quiz-feedback{
  margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15px;line-height:1.6;
}
.quiz-feedback.ok{background:rgba(200,240,96,.08);border:1px solid rgba(200,240,96,.2);color:var(--accent)}
.quiz-feedback.bad{background:rgba(240,100,100,.07);border:1px solid rgba(240,100,100,.2);color:var(--text)}
.quiz-feedback.bad .fb-breakdown{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.8}
.quiz-feedback.bad .fb-breakdown strong{color:var(--accent2)}
.next-btn{
  width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface2);font-family:var(--sans);font-size:16px;
  color:var(--text);cursor:pointer;margin-top:10px;transition:all .18s;
}
.next-btn:hover{border-color:var(--accent2);color:var(--accent2)}

/* ── Unlock screen ── */
.unlock-card{
  background:linear-gradient(135deg,rgba(200,240,96,.06),rgba(96,200,240,.04));
  border:1px solid rgba(200,240,96,.25);border-radius:18px;
  padding:32px 24px;text-align:center;
}
.unlock-icon{font-size:52px;margin-bottom:12px}
.unlock-title{font-family:var(--serif);font-size:26px;color:var(--text);margin-bottom:6px}
.unlock-root{
  display:inline-block;font-family:var(--mono);font-size:22px;color:var(--accent2);
  background:rgba(96,200,240,.08);border:1px solid rgba(96,200,240,.2);
  border-radius:8px;padding:6px 18px;margin:10px 0 6px;
}
.unlock-meaning{font-size:16px;color:var(--muted);margin-bottom:16px}
.unlock-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:13px;color:var(--accent);
  background:rgba(200,240,96,.08);border:1px solid rgba(200,240,96,.15);
  border-radius:20px;padding:5px 14px;margin-bottom:20px;
}

/* ── Completion screen ── */
.done-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:28px 24px;text-align:center;
}
.done-title{font-family:var(--serif);font-size:28px;color:var(--text);margin-bottom:6px}
.done-stats{
  display:flex;justify-content:center;gap:24px;
  margin:20px 0;
}
.done-stat{text-align:center}
.done-stat .n{font-family:var(--serif);font-size:32px;color:var(--accent)}
.done-stat .l{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:2px}
.done-next{
  font-family:var(--mono);font-size:13px;color:var(--dim);
  background:var(--surface2);border-radius:8px;padding:10px 14px;
  margin:16px 0;line-height:1.7;
}

/* ── Root collection ── */
.collection-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.root-cell{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px 10px;text-align:center;cursor:pointer;
  transition:all .18s;
}
.root-cell.locked{opacity:.4;cursor:default}
.root-cell:not(.locked):hover{border-color:var(--accent2)}
.root-cell-icon{font-size:22px;margin-bottom:4px}
.root-cell-word{font-family:var(--mono);font-size:15px;color:var(--accent2)}
.root-cell-zh{font-size:12px;color:var(--muted);margin-top:2px}
.root-cell-lv{
  font-family:var(--mono);font-size:11px;margin-top:5px;
}
.lv1{color:var(--dim)} .lv2{color:var(--muted)} .lv3{color:var(--orange)}
.lv4{color:var(--accent)}

/* ── nav tabs ── */
.tab-bar{
  display:flex;gap:0;border-bottom:1px solid var(--border);
  padding:0 20px;margin-bottom:4px;
}
.tab{
  padding:10px 16px;font-family:var(--mono);font-size:14px;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;
}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent2)}

/* ── misc ── */
.divider{height:1px;background:var(--border);margin:10px 0}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:15px;line-height:2}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <a href="index.html" class="back-btn">←</a>
    <div class="header-title">字根探索</div>
    <div class="header-sub" id="headerSub">載入中…</div>
  </div>
  <div class="tab-bar">
    <div class="tab active" id="tabToday" onclick="switchTab('today')">今日任務</div>
    <div class="tab" id="tabCollection" onclick="switchTab('collection')">字根圖鑑</div>
  </div>
  <div id="screen"></div>
</div>

// ══════════════════════════════════════════════
// PROGRESS STORE
// ══════════════════════════════════════════════
const PROGRESS = {
  load(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null') || this.defaultProgress(); }
    catch{ return this.defaultProgress(); }
  },
  save(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); },
  defaultProgress(){
    return {
      unlockedRoots: [],
      rootLevels: {},
      wordProgress: {},
      dailyStats: {},
      lastTaskDate: null,
      dailyTask: null,
    };
  },
  today(){ return new Date().toISOString().slice(0,10); },
};

// ══════════════════════════════════════════════
// TASK GENERATOR
// ══════════════════════════════════════════════
function generateTask(p) {
  const today = PROGRESS.today();
  const due = [];
  for(const [wid, wp] of Object.entries(p.wordProgress)){
    if(wp.nextReviewAt <= today && wp.reviewStage < 7){
      due.push({wordId: wid, ...wp});
    }
  }
  due.sort((a,b) => a.nextReviewAt.localeCompare(b.nextReviewAt));
  const reviewItems = due.slice(0, 8);

  const lockedRoot = ROOT_GROUPS.find(r => !p.unlockedRoots.includes(r.id));
  const shouldAddNew = reviewItems.length < 5 && lockedRoot;

  return {
    reviewItems,
    newRoot: shouldAddNew ? lockedRoot : null,
    estimatedMinutes: Math.ceil((reviewItems.length + (shouldAddNew ? 4 : 0)) * 0.4) || 2,
  };
}

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let progress = PROGRESS.load();
let currentTab = 'today';
let state = {
  phase: 'task',      // task | intro | words | quiz | unlock | done | collection
  task: null,
  currentRoot: null,
  wordIdx: 0,
  quizIdx: 0,
  quizAnswered: false,
  quizSelected: null,
  quizCorrects: 0,
  quizWrongs: 0,
  wrongWords: [],
};

// ══════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════
function render() {
  const screen = document.getElementById('screen');
  const sub = document.getElementById('headerSub');
  const unlocked = progress.unlockedRoots.length;
  sub.textContent = `已解鎖 ${unlocked} / ${ROOT_GROUPS.length} 個字根`;

  if(currentTab === 'collection'){
    renderCollection(screen); return;
  }

  switch(state.phase){
    case 'task':       renderTask(screen); break;
    case 'intro':      renderIntro(screen); break;
    case 'words':      renderWords(screen); break;
    case 'quiz':       renderQuiz(screen); break;
    case 'unlock':     renderUnlock(screen); break;
    case 'done':       renderDone(screen); break;
  }
}

// ── Today task screen ──
function renderTask(el){
  const task = generateTask(progress);
  state.task = task;
  const hasContent = task.newRoot || task.reviewItems.length > 0;

  if(!hasContent){
    el.innerHTML = `
      <div class="task-card">
        <div class="task-label">今日任務</div>
        <div class="task-title" style="font-size:22px">🎉 今天的任務完成了！</div>
        <div class="task-time" style="margin-top:8px">明天系統會幫你安排複習，繼續保持！</div>
      </div>
      <div class="stats-row">${statsHTML()}</div>`;
    return;
  }

  const items = [];
  if(task.newRoot) items.push(`<div class="task-item"><span class="num">1</span>探索「${task.newRoot.root}」字根 + 學習 ${task.newRoot.words.length} 個代表單字</div>`);
  if(task.reviewItems.length) items.push(`<div class="task-item"><span class="num">${task.newRoot?2:1}</span>複習 ${task.reviewItems.length} 個舊單字</div>`);

  el.innerHTML = `
    <div class="task-card">
      <div class="task-label">今日任務</div>
      <div class="task-title">準備好了嗎？</div>
      <div class="task-items">${items.join('')}</div>
      <div class="task-time">⏱ 預估約 ${task.estimatedMinutes} 分鐘</div>
      <button class="btn-primary" onclick="startTask()">開始今日任務</button>
    </div>
    <div class="stats-row">${statsHTML()}</div>`;
}

function statsHTML(){
  const total = Object.keys(progress.wordProgress).length;
  const mastered = Object.values(progress.wordProgress).filter(w=>w.reviewStage>=5).length;
  const unlocked = progress.unlockedRoots.length;
  return `
    <div class="stat-chip"><div class="stat-num">${unlocked}</div><div class="stat-lbl">字根解鎖</div></div>
    <div class="stat-chip"><div class="stat-num">${total}</div><div class="stat-lbl">已學單字</div></div>
    <div class="stat-chip"><div class="stat-num">${mastered}</div><div class="stat-lbl">已精通</div></div>`;
}

// ── Root intro ──
function renderIntro(el){
  const r = state.currentRoot;
  el.innerHTML = `
    <div class="root-intro">
      <div class="root-header">
        <div class="root-chip">${r.root}</div>
        <div class="root-meaning-en">${r.meaning}</div>
        <div class="root-meaning-zh">${r.meaning_zh}</div>
        <div class="root-origin">源自 ${r.origin}</div>
      </div>
      <div class="root-body">
        <div class="root-hint">${r.hint}</div>
      </div>
    </div>
    <button class="btn-primary" onclick="goToWords()">看代表單字 →</button>`;
}

// ── Word cards ──
function renderWords(el){
  const r = state.currentRoot;
  const cards = r.words.map((w,i)=>{
    const breakdown = w.breakdown.map(p=>
      `<span class="break-part">${p.hl?`<span class="accent">${p.part}</span>`:p.part}</span>`
    ).join('<span style="color:var(--dim);margin:0 2px">+</span>');
    return `
      <div class="word-card" style="opacity:0;transform:translateY(12px);transition:all .35s ${i*0.1}s" id="wc${i}">
        <div class="word-card-top">
          <div>
            <div class="word-en">${w.word}</div>
            <div class="word-pos">${w.pos}</div>
          </div>
          <div class="word-phonetic">${w.phonetic}</div>
        </div>
        <div class="word-breakdown">${breakdown}</div>
        <div style="font-size:13px;color:var(--dim);margin-bottom:4px">${w.breakdown_zh}</div>
        <div class="divider"></div>
        <div class="word-zh">${w.zh}</div>
        <div class="word-example">${w.example}</div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div style="font-family:var(--mono);font-size:14px;color:var(--muted);margin-bottom:4px">
      字根 <strong style="color:var(--accent2)">${r.root}</strong> 的代表單字
    </div>
    <div class="word-cards">${cards}</div>
    <button class="btn-primary" onclick="goToQuiz()">開始小測驗 →</button>`;

  // animate in
  requestAnimationFrame(()=>{
    r.words.forEach((_,i)=>{
      const el = document.getElementById(`wc${i}`);
      if(el){ el.style.opacity='1'; el.style.transform='translateY(0)'; }
    });
  });
}

// ── Quiz ──
function renderQuiz(el){
  const r = state.currentRoot;
  const q = r.quizzes[state.quizIdx];
  const total = r.quizzes.length;

  const dots = r.quizzes.map((_,i)=>{
    const cls = i < state.quizIdx ? 'done' : i===state.quizIdx ? 'current' : '';
    return `<div class="quiz-dot ${cls}"></div>`;
  }).join('');

  const opts = q.opts.map((opt,i)=>{
    let cls = '';
    if(state.quizAnswered){
      if(i===q.ans) cls='correct';
      else if(i===state.quizSelected && state.quizSelected!==q.ans) cls='wrong';
    }
    return `<button class="quiz-opt ${cls}" onclick="answerQuiz(${i})"
      ${state.quizAnswered?'disabled':''}>
      <span class="opt-key">${['A','B','C','D'][i]}</span>${opt}
    </button>`;
  }).join('');

  let feedback = '';
  if(state.quizAnswered){
    const correct = state.quizSelected === q.ans;
    feedback = correct
      ? `<div class="quiz-feedback ok">✓ 答對了！</div>`
      : `<div class="quiz-feedback bad">
           <div>✗ 答錯了，沒關係。</div>
           <div class="fb-breakdown">${q.feedback_root.replace(/(\w+=\w+|[\u4e00-\u9fff]+)/g, m=>`<strong>${m}</strong>`)}</div>
         </div>`;
  }

  el.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-progress">${dots}<span style="font-family:var(--mono);font-size:13px;color:var(--dim);margin-left:auto">${state.quizIdx+1} / ${total}</span></div>
      <div class="quiz-q"><span class="quiz-word">${q.word}</span>${q.q}</div>
      <div class="quiz-opts">${opts}</div>
      ${feedback}
    </div>
    ${state.quizAnswered ? `<button class="next-btn" onclick="nextQuiz()">${state.quizIdx+1<total ? '下一題 →' : '查看結果 →'}</button>` : ''}`;
}

// ── Unlock ──
function renderUnlock(el){
  const r = state.currentRoot;
  const lv = progress.rootLevels[r.id] || 1;
  const lvLabels = ['','已發現','已理解','已熟悉','已精通'];
  el.innerHTML = `
    <div class="unlock-card">
      <div class="unlock-icon">🔓</div>
      <div class="unlock-title">你解鎖了新字根！</div>
      <div class="unlock-root">${r.root}</div>
      <div class="unlock-meaning">${r.meaning_zh}</div>
      <div class="unlock-badge">✦ 已加入字根圖鑑</div>
      <div style="font-family:var(--mono);font-size:14px;color:var(--muted);margin-bottom:20px">
        等級 Lv${lv}：${lvLabels[lv]||'已發現'}
      </div>
      <button class="btn-primary" onclick="goToDone()">查看今日成果 →</button>
    </div>`;
}

// ── Done ──
function renderDone(el){
  const task = state.task;
  const newRootName = state.currentRoot ? state.currentRoot.root : null;
  const total = state.quizCorrects + state.quizWrongs;
  const acc = total ? Math.round(state.quizCorrects/total*100) : 100;

  // record daily stats
  const today = PROGRESS.today();
  if(!progress.dailyStats[today]) progress.dailyStats[today]={completedTasks:0,correctAnswers:0,wrongAnswers:0};
  progress.dailyStats[today].completedTasks++;
  progress.dailyStats[today].correctAnswers += state.quizCorrects;
  progress.dailyStats[today].wrongAnswers += state.quizWrongs;
  PROGRESS.save(progress);

  el.innerHTML = `
    <div class="done-card">
      <div class="done-title">今日任務完成！🎉</div>
      <div style="font-size:15px;color:var(--muted);margin-top:4px">你今天：</div>
      <div class="done-stats">
        ${newRootName?`<div class="done-stat"><div class="n">1</div><div class="l">字根解鎖</div></div>`:''}
        <div class="done-stat"><div class="n">${total}</div><div class="l">題完成</div></div>
        <div class="done-stat"><div class="n">${acc}%</div><div class="l">答對率</div></div>
      </div>
      ${newRootName?`<div class="done-next">📅 明天會幫你複習「${newRootName}」相關單字</div>`:''}
      <div style="display:flex;gap:10px;margin-top:4px">
        <button class="next-btn" style="flex:1" onclick="switchTab('collection')">字根圖鑑</button>
        <button class="btn-primary" style="flex:1;margin-top:0" onclick="goBackToTask()">回首頁</button>
      </div>
    </div>`;
}

// ── Collection ──
function renderCollection(el){
  const cells = ROOT_GROUPS.map(r=>{
    const unlocked = progress.unlockedRoots.includes(r.id);
    const lv = progress.rootLevels[r.id] || 0;
    const icons = ['🔒','👀','✅','🔥','🏆'];
    const lvClass = unlocked ? `lv${Math.min(lv,4)}` : '';
    return `
      <div class="root-cell ${unlocked?'':'locked'}" onclick="${unlocked?`reviewRoot('${r.id}')`:''}" >
        <div class="root-cell-icon">${icons[lv]||'🔒'}</div>
        <div class="root-cell-word">${r.root}</div>
        <div class="root-cell-zh">${r.meaning_zh}</div>
        ${unlocked?`<div class="root-cell-lv ${lvClass}">Lv${lv}</div>`:''}
      </div>`;
  }).join('');

  const total = ROOT_GROUPS.length;
  const unlocked = progress.unlockedRoots.length;
  const mastered = Object.entries(progress.rootLevels).filter(([,v])=>v>=4).length;

  el.innerHTML = `
    <div style="font-family:var(--mono);font-size:14px;color:var(--muted);padding:0 0 4px">
      已收集 <strong style="color:var(--accent2)">${unlocked}</strong> /
      ${total} 個字根　精通 <strong style="color:var(--accent)">${mastered}</strong>
    </div>
    <div class="collection-grid">${cells}</div>
    ${unlocked===0?`<div class="empty-state">完成今日任務後<br>字根會出現在這裡</div>`:''}`;
}

// ══════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════
function startTask(){
  const task = state.task;
  state.quizCorrects = 0;
  state.quizWrongs = 0;
  state.wrongWords = [];
  if(task.newRoot){
    state.currentRoot = task.newRoot;
    state.phase = 'intro';
  } else if(task.reviewItems.length > 0){
    startReviewSession(task.reviewItems);
    return;
  }
  render();
}

function startReviewSession(items){
  // Build review quizzes from wordProgress words
  // For simplicity, use the word's root group quizzes
  const reviewRoot = ROOT_GROUPS.find(r=>
    r.words.some(w=> items.some(i=>i.wordId===`word_${w.word}`))
  );
  if(reviewRoot){
    state.currentRoot = reviewRoot;
    state.quizIdx = 0;
    state.quizAnswered = false;
    state.phase = 'quiz';
    render();
  } else {
    state.phase = 'done';
    render();
  }
}

function goToWords(){
  state.phase = 'words';
  render();
}

function goToQuiz(){
  state.quizIdx = 0;
  state.quizAnswered = false;
  state.quizSelected = null;
  state.phase = 'quiz';
  render();
}

function answerQuiz(optIdx){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  state.quizSelected = optIdx;
  const r = state.currentRoot;
  const q = r.quizzes[state.quizIdx];
  const correct = optIdx === q.ans;
  if(correct) state.quizCorrects++;
  else { state.quizWrongs++; state.wrongWords.push(q.word); }

  // Update word progress
  const wid = `word_${q.word}`;
  if(!progress.wordProgress[wid]){
    progress.wordProgress[wid] = {reviewStage:0,correctCount:0,wrongCount:0,lastReviewedAt:PROGRESS.today(),nextReviewAt:PROGRESS.today()};
  }
  const wp = progress.wordProgress[wid];
  if(correct){
    wp.correctCount++;
    wp.reviewStage = Math.min(wp.reviewStage+1, STAGES.length-1);
  } else {
    wp.wrongCount++;
    wp.reviewStage = Math.max(wp.reviewStage-1, 1);
  }
  const daysAhead = STAGES[wp.reviewStage] || 1;
  const next = new Date();
  next.setDate(next.getDate() + daysAhead);
  wp.nextReviewAt = next.toISOString().slice(0,10);
  wp.lastReviewedAt = PROGRESS.today();
  PROGRESS.save(progress);
  render();
}

function nextQuiz(){
  const r = state.currentRoot;
  if(state.quizIdx + 1 < r.quizzes.length){
    state.quizIdx++;
    state.quizAnswered = false;
    state.quizSelected = null;
    render();
  } else {
    // Quiz done — unlock root
    unlockRoot(r);
  }
}

function unlockRoot(r){
  if(!progress.unlockedRoots.includes(r.id)){
    progress.unlockedRoots.push(r.id);
    // Set Lv2 (completed first quiz)
    progress.rootLevels[r.id] = 2;
    PROGRESS.save(progress);
    state.phase = 'unlock';
    render();
  } else {
    // Already unlocked — update level
    const currentLv = progress.rootLevels[r.id] || 1;
    if(state.quizCorrects >= r.quizzes.length){
      progress.rootLevels[r.id] = Math.min(currentLv+1, 4);
    }
    PROGRESS.save(progress);
    goToDone();
  }
}

function goToDone(){
  state.phase = 'done';
  render();
}

function goBackToTask(){
  state.phase = 'task';
  state.currentRoot = null;
  render();
}

function reviewRoot(rootId){
  const r = ROOT_GROUPS.find(x=>x.id===rootId);
  if(!r) return;
  state.currentRoot = r;
  state.quizCorrects = 0;
  state.quizWrongs = 0;
  state.wrongWords = [];
  state.task = {reviewItems:[], newRoot:null, estimatedMinutes:2};
  state.phase = 'intro';
  switchTab('today');
}

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabToday').className = 'tab' + (tab==='today'?' active':'');
  document.getElementById('tabCollection').className = 'tab' + (tab==='collection'?' active':'');
  render();
}

// ── Boot ──
render();
</script>
