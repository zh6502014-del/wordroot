<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordRoot — 字根記憶單字卡</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--accent:#c8f060;--accent2:#60c8f0;--red:#f06464;--orange:#f0a060;--bg:#0e0f11;--surface:#16181c;--surface2:#1e2026;--border:#2a2d35;--text:#e8eaf0;--muted:#6b7080;--dim:#3a3f50;--serif:'DM Serif Display',serif;--mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
::selection{background:transparent}
html,body,#root{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans)}
.flip-scene{perspective:1200px;cursor:pointer;width:100%;aspect-ratio:16/9}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .52s cubic-bezier(.4,0,.2,1)}
.flip-inner.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden;border:1px solid var(--border)}
.flip-back{transform:rotateY(180deg)}
.flip-back ::-webkit-scrollbar{width:3px}
.flip-back ::-webkit-scrollbar-track{background:transparent}
.flip-back ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card-enter{animation:cardIn .28s ease both}
.opt-btn{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:all .15s;text-align:left;width:100%;color:var(--text);font-family:var(--sans)}
.opt-btn:hover:not(:disabled){border-color:var(--muted);background:var(--surface2)}
.opt-btn:disabled{cursor:default}
.opt-correct{border-color:var(--accent)!important;background:rgba(200,240,96,.1)!important}
.opt-wrong{border-color:var(--red)!important;background:rgba(240,100,100,.08)!important}
.opt-reveal{border-color:rgba(200,240,96,.3)!important;background:rgba(200,240,96,.04)!important}
@keyframes speakPulse{from{box-shadow:0 0 0 0 rgba(96,200,240,.4)}to{box-shadow:0 0 0 7px rgba(96,200,240,0)}}
.speaking{animation:speakPulse .6s ease infinite alternate}
.book-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s;width:100%;text-align:left;font-family:var(--sans);color:var(--text)}
.book-item:hover{background:var(--surface2);border-color:var(--muted)}
.nav-btn{font-family:var(--mono);font-size:16px;padding:5px 12px;border-radius:6px;cursor:pointer;letter-spacing:.04em;transition:all .15s;border:1px solid var(--border);background:transparent;color:var(--muted)}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{background:var(--surface2);color:var(--text);border-color:var(--muted)}
/* ── Chat float btn ── */
#chat-float{
  position:fixed;bottom:24px;right:24px;z-index:99;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,rgba(200,240,96,.15),rgba(96,200,240,.1));
  border:1px solid rgba(200,240,96,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;cursor:pointer;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  transition:all .2s;text-decoration:none;
}
#chat-float:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(200,240,96,.2)}
.rate-btn{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-family:var(--sans);font-size:16px;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--muted)}
.rate-btn:disabled{opacity:.4;cursor:default}
.rate-btn.again{border-color:rgba(240,100,100,.3);color:var(--red)}
.rate-btn.good{border-color:rgba(200,240,96,.3);color:var(--accent)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:500px;max-height:82vh;overflow-y:auto;padding:24px;position:relative}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
.progress-track{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.tag{font-family:var(--mono);font-size:14px;color:var(--dim);background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 7px}
.divider{height:1px;background:var(--border);margin:10px 0}
.syn-tooltip-wrap{position:relative;display:inline-flex;align-items:center;flex-shrink:0}
.syn-btn{font-family:var(--mono);font-size:14px;padding:2px 6px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);color:var(--dim);cursor:default;user-select:none;line-height:1.4;transition:all .15s}
.syn-btn:hover{border-color:var(--accent2);color:var(--accent2);background:rgba(96,200,240,.08)}
.syn-tip{position:absolute;left:0;top:calc(100% + 6px);z-index:50;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-width:180px;max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.4);pointer-events:none}
.syn-tip-label{font-family:var(--mono);font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.syn-tip-chips{display:flex;flex-wrap:wrap;gap:4px}
.syn-chip{font-family:var(--mono);font-size:16px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:var(--muted)}
.resume-card{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:18px 20px;cursor:pointer;transition:all .2s;width:100%;text-align:left;font-family:var(--sans);color:var(--text);display:flex;flex-direction:column;gap:10px}
.resume-card:hover{border-color:var(--muted);background:var(--surface2)}
.resume-progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden;width:100%}
.resume-progress-fill{height:100%;border-radius:2px;transition:width .4s}
.session-btn{padding:9px 18px;border-radius:8px;font-family:var(--sans);font-size:16px;cursor:pointer;transition:all .18s;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
.session-btn:hover{background:var(--surface2);color:var(--text)}
.session-btn.primary{border-color:rgba(200,240,96,.3);background:rgba(200,240,96,.06);color:var(--accent)}
.session-btn.primary:hover{background:rgba(200,240,96,.12)}
.session-btn.danger{border-color:rgba(240,100,100,.25);color:var(--red)}
.session-btn.danger:hover{background:rgba(240,100,100,.08);border-color:rgba(240,100,100,.4)}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback}=React;

// ── VOCAB DATA ──
// Loaded async from data/vocab_batch_001.json
let VOCAB_DATA = [];
// ── FSRS-lite ──
const FSRS={
  MULT:{again:.5,hard:1,good:2,easy:4},
  all:()=>JSON.parse(localStorage.getItem("wr_p")||"{}"),
  get(w){const a=this.all();return a[w]||{interval:1,dueDate:null,reps:0}},
  save(word,rating){
    const all=this.all(),prev=all[word]||{interval:1,reps:0};
    const ni=rating==="again"?1:Math.round(prev.interval*this.MULT[rating]*10)/10;
    const due=new Date();due.setDate(due.getDate()+ni);
    all[word]={interval:ni,dueDate:due.toISOString(),reps:(prev.reps||0)+1,lastRating:rating,lastReview:new Date().toISOString()};
    localStorage.setItem("wr_p",JSON.stringify(all));
    return all[word];
  },
  isDue(w){const p=this.get(w);return!p.dueDate||new Date(p.dueDate)<=new Date()},
  stats(){const all=Object.values(this.all()),now=new Date();return{total:all.length,due:all.filter(w=>new Date(w.dueDate)<=now).length,mastered:all.filter(w=>w.interval>=7).length}},
};

// ── Session Storage ──
const SESSION={
  KEY_L:"wr_session_learn",
  KEY_Q:"wr_session_quiz",
  save(type,deck,idx){
    const key=type==="learn"?this.KEY_L:this.KEY_Q;
    localStorage.setItem(key,JSON.stringify({deck,idx,savedAt:new Date().toISOString()}));
  },
  load(type){
    const key=type==="learn"?this.KEY_L:this.KEY_Q;
    const raw=localStorage.getItem(key);
    return raw?JSON.parse(raw):null;
  },
  clear(type){
    localStorage.removeItem(type==="learn"?this.KEY_L:this.KEY_Q);
  },
};

// ── MISTAKES (殘酷二選一) ──
const MISTAKES={
  KEY:"wr_mistakes",
  all(){return JSON.parse(localStorage.getItem(this.KEY)||"{}") },
  add(correctWord,correctDef,wrongWord,wrongDef){
    const all=this.all();
    if(!all[correctWord]){
      all[correctWord]={wrongWord,wrongDef,correctDef,streak:0,addedAt:new Date().toISOString()};
      localStorage.setItem(this.KEY,JSON.stringify(all));
    }
  },
  answer(word,isCorrect){
    const all=this.all();
    if(!all[word])return;
    if(isCorrect){
      all[word].streak=(all[word].streak||0)+1;
      if(all[word].streak>=2){
        delete all[word];
      }
    } else {
      all[word].streak=0;
    }
    localStorage.setItem(this.KEY,JSON.stringify(all));
  },
  count(){return Object.keys(this.all()).length},
  list(){return Object.entries(this.all()).map(([word,v])=>({word,...v}))},
};

const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const buildDeck=vocab=>{
  const due=vocab.filter(w=>FSRS.isDue(w.word));
  if(due.length>=5)return shuffle(due);
  const seen=new Set(Object.keys(FSRS.all()));
  const unseen=vocab.filter(w=>!seen.has(w.word));
  return shuffle([...due,...unseen.slice(0,Math.max(10,15-due.length))]);
};

const getStatus=word=>{
  const p=FSRS.get(word);
  if(!p.reps)return"new";
  if(p.interval>=7)return"mastered";
  if(FSRS.isDue(word))return"due";
  return"learning";
};

// ── Audio ──
const Audio_={
  _cache:{},_audio:null,
  speak(word,onPlay,onDone){
    onPlay?.();
    // TTS first — always works, instant response
    this._tts(word);
    // Silently cache mp3 for next time
    if(!(word in this._cache)){
      this._url(word).then(url=>{this._cache[word]=url;}).catch(()=>{this._cache[word]=null;});
    }
    onDone?.();
  },
  async _url(word){
    if(word in this._cache)return this._cache[word];
    try{
      const r=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`,{signal:AbortSignal.timeout(4000)});
      if(!r.ok)throw 0;
      const d=await r.json();
      const f=(d[0]?.phonetics||[]).find(p=>p.audio?.trim());
      return(this._cache[word]=f?f.audio:null);
    }catch{return(this._cache[word]=null)}
  },
  _mp3(url){
    return new Promise((res,rej)=>{
      if(this._audio){this._audio.pause();this._audio=null}
      const a=new Audio(url);this._audio=a;
      a.onended=res;a.onerror=rej;a.play().catch(rej);
    });
  },
  _tts(word){
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(word);
    u.lang="en-US";u.rate=0.82;u.pitch=1;
    const voices=speechSynthesis.getVoices();
    const eng=voices.find(v=>v.lang==="en-US"&&v.localService)||
              voices.find(v=>v.lang.startsWith("en")&&v.localService)||
              voices.find(v=>v.lang.startsWith("en"));
    if(eng)u.voice=eng;
    speechSynthesis.speak(u);
  },
};

// ── Shared Components ──
function SpeakBtn({word}){
  const[playing,setPlaying]=useState(false);
  return(
    <button
      onClick={e=>{e.stopPropagation();Audio_.speak(word,()=>setPlaying(true),()=>setPlaying(false))}}
      className={playing?"speaking":""}
      style={{background:"none",border:`1px solid ${playing?"var(--accent2)":"var(--border)"}`,borderRadius:"50%",width:28,height:28,cursor:"pointer",fontSize:14,color:playing?"var(--accent2)":"var(--muted)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all .18s"}}>
      {playing?"🔉":"🔊"}
    </button>
  );
}

function RootChips({roots}){
  return(
    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
      {roots.map((r,i)=>(
        <div key={i} style={{display:"flex",alignItems:"center",gap:5,background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:6,padding:"3px 9px",fontSize:16}}>
          <span style={{fontFamily:"var(--mono)",color:"var(--accent2)",fontWeight:500}}>{r.root}</span>
          <span style={{color:"var(--dim)"}}>→</span>
          <span style={{color:"var(--muted)"}}>{r.meaning} / {r.meaning_zh}</span>
          <span style={{fontSize:14,color:"var(--dim)",fontStyle:"italic"}}>{r.origin}</span>
        </div>
      ))}
    </div>
  );
}

// ── LEARN ──
function LearnScreen({vocab,resumeData,onDone}){
  const deckData=resumeData?resumeData.deck:buildDeck(vocab);
  const[deck]=useState(()=>deckData);
  const[idx,setIdx]=useState(()=>resumeData?resumeData.idx:0);
  const[flipped,setFlipped]=useState(false);
  const[stats,setStats]=useState({again:0,hard:0,good:0,easy:0,skip:0});
  const[done,setDone]=useState(false);
  const[cardKey,setCardKey]=useState(0);
  const[toast,setToast]=useState(null);
  const[confirmCancel,setConfirmCancel]=useState(false);
  const w=deck[idx];
  const prog=w?FSRS.get(w.word):null;

  const saveAndExit=()=>{
    SESSION.save("learn",deck,idx);
    onDone();
  };

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),1200)};

  const advance=useCallback(()=>{
    const next=idx+1;
    if(next>=deck.length){setDone(true);return}
    setFlipped(false);
    setTimeout(()=>{setIdx(next);setCardKey(k=>k+1)},300);
  },[idx,deck.length]);

  const rate=useCallback(rating=>{
    const result=FSRS.save(w.word,rating);
    setStats(s=>({...s,[rating]:s[rating]+1}));
    showToast("📅 "+(result.interval<1?"稍後複習":`${result.interval} 天後複習`));
    advance();
  },[w,advance]);

  const skip=useCallback(()=>{setStats(s=>({...s,skip:s.skip+1}));advance()},[advance]);

  useEffect(()=>{
    const fn=e=>{
      if(e.code==="Space"){e.preventDefault();setFlipped(f=>!f);return}
      if(e.key.toLowerCase()==="n"){e.preventDefault();skip();return}
      if(flipped){
        if(e.key==="1")rate("again");
        else if(e.key==="2")rate("hard");
        else if(e.key==="3")rate("good");
        else if(e.key==="4")rate("easy");
      }
    };
    window.addEventListener("keydown",fn);
    return()=>window.removeEventListener("keydown",fn);
  },[flipped,rate,skip]);

  if(!deck.length){
    return(
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,padding:"60px 20px",textAlign:"center"}}>
        <div style={{fontSize:44}}>🎉</div>
        <div style={{fontFamily:"var(--serif)",fontSize:22,color:"var(--text)"}}>沒有待學的單字</div>
        <div style={{fontFamily:"var(--mono)",fontSize:14,color:"var(--muted)"}}>所有單字都已複習過，明天再來！</div>
        <button onClick={onDone} style={{marginTop:4,padding:"10px 24px",borderRadius:10,border:"1px solid rgba(200,240,96,.3)",background:"rgba(200,240,96,.06)",color:"var(--accent)",fontFamily:"var(--sans)",fontSize:14,cursor:"pointer"}}>回首頁</button>
      </div>
    );
  }
  if(done||!w){
    const s=FSRS.stats();
    return(
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:20,padding:"60px 20px",textAlign:"center"}}>
        <div style={{fontSize:48}}>🎉</div>
        <div style={{fontFamily:"var(--serif)",fontSize:26,color:"var(--accent)"}}>學習完成！</div>
        <div style={{fontSize:16,color:"var(--muted)",lineHeight:1.8}}>
          完成 <strong style={{color:"var(--accent)"}}>{deck.length}</strong> 張<br/>
          再複習 {stats.again}　有點難 {stats.hard}　記住了 {stats.good}　太簡單 {stats.easy}　跳過 {stats.skip}<br/>
          <span style={{color:"var(--dim)",fontSize:14}}>累計 {s.total} 字　熟練 {s.mastered} 字</span>
        </div>
        <button onClick={()=>{SESSION.clear("learn");onDone()}} style={{padding:"10px 28px",borderRadius:10,border:"1px solid rgba(200,240,96,.3)",background:"rgba(200,240,96,.06)",color:"var(--accent)",fontFamily:"var(--sans)",fontSize:14,cursor:"pointer"}}>回首頁</button>
      </div>
    );
  }

  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,padding:"20px 20px 48px",width:"100%",maxWidth:660,margin:"0 auto"}}>
      {/* progress */}
      <div style={{display:"flex",alignItems:"center",gap:10,width:"100%"}}>
        <div className="progress-track"><div className="progress-fill" style={{width:`${(idx/deck.length)*100}%`}}/></div>
        <span style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--muted)",whiteSpace:"nowrap"}}>{idx} / {deck.length}</span>
      </div>

      {/* flip card */}
      <div className="flip-scene" onClick={()=>setFlipped(f=>!f)}>
        <div className={"flip-inner"+(flipped?" flipped":"")}>
          {/* FRONT */}
          <div className={"flip-face card-enter"} key={"front"+cardKey}
            style={{background:"var(--surface)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,padding:"40px 32px",userSelect:"none"}}>
            <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 30% 40%,rgba(200,240,96,.06),transparent 60%)",borderRadius:16,pointerEvents:"none"}}/>
            <span style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--accent)",background:"rgba(200,240,96,.1)",padding:"3px 10px",borderRadius:20,border:"1px solid rgba(200,240,96,.2)",zIndex:1}}>
              {prog?.reps>0?`${w.pos} · 複習 ${prog.reps} 次`:`${w.pos} · 初次學習`}
            </span>
            <div style={{fontFamily:"var(--serif)",fontSize:"clamp(40px,8vw,66px)",lineHeight:1,color:"var(--text)",textAlign:"center",zIndex:1}}>{w.word}</div>
            <div style={{display:"flex",alignItems:"center",gap:8,zIndex:1}}>
              <span style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--muted)"}}>{w.phonetic}</span>
              <SpeakBtn word={w.word}/>
            </div>
            <div style={{fontSize:"clamp(18px,4vw,24px)",letterSpacing:5,opacity:.7,zIndex:1}}>{w.mnemonic.emojis.join("  ")}</div>
            <div style={{position:"absolute",bottom:14,right:18,fontFamily:"var(--mono)",fontSize:16,color:"var(--dim)"}}>↺ 點擊翻面</div>
          </div>
          {/* BACK */}
          <div className="flip-face flip-back"
            style={{background:"#0e1a0f",display:"flex",flexDirection:"column",userSelect:"none",overflow:"hidden"}}>
            <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 70% 30%,rgba(200,240,96,.07),transparent 60%)",borderRadius:16,pointerEvents:"none",zIndex:0}}/>
            <div style={{flex:1,overflowY:"auto",overflowX:"hidden",display:"flex",flexDirection:"column",position:"relative",zIndex:1}}>
              <div style={{padding:"16px 20px 12px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,flexShrink:0}}>
                <div>
                  <div style={{fontSize:16,color:"var(--text)",lineHeight:1.5}}>{w.definition}</div>
                  <div style={{fontSize:14,color:"var(--muted)",marginTop:2}}>{w.definition_zh}</div>
                </div>
                <div style={{fontFamily:"var(--serif)",fontSize:21,color:"var(--accent)",whiteSpace:"nowrap",flexShrink:0}}>{w.word}</div>
              </div>
              <div style={{padding:"12px 20px",display:"flex",flexDirection:"column",gap:10}}>
                <RootChips roots={w.roots}/>
                <div style={{background:"linear-gradient(135deg,rgba(200,240,96,.05),rgba(200,240,96,.02))",border:"1px solid rgba(200,240,96,.15)",borderRadius:10,padding:"10px 12px",display:"flex",flexDirection:"column",gap:5}}>

// ── QUIZ ──
function QuizScreen({vocab,resumeData,onDone}){
  const deckData=resumeData?resumeData.deck:buildDeck(vocab);
  const[deck]=useState(()=>deckData);
  const[idx,setIdx]=useState(()=>resumeData?resumeData.idx:0);
  const[opts,setOpts]=useState([]);
  const[answered,setAnswered]=useState(false);
  const[selected,setSelected]=useState(null);
  const[stats,setStats]=useState({correct:0,wrong:0});
  const[done,setDone]=useState(false);
  const[confirmCancel,setConfirmCancel]=useState(false);
  const w=deck[idx];

  const saveAndExit=()=>{
    SESSION.save("quiz",deck,idx);
    onDone();
  };

  useEffect(()=>{
    if(!w)return;
    const pool=vocab.filter(v=>v.word!==w.word);
    const dist=shuffle(pool).slice(0,Math.min(3,pool.length));
    if(dist.length<1){onDone();return;}
    setOpts(shuffle([w,...dist]));
  },[idx]);

  const answer=useCallback(opt=>{
    if(answered)return;
    setAnswered(true);setSelected(opt.word);
    const correct=opt.word===w.word;
    FSRS.save(w.word,correct?"good":"again");
    if(!correct){
      MISTAKES.add(w.word,w.definition_zh,opt.word,opt.definition_zh);
    }
    setStats(s=>({...s,[correct?"correct":"wrong"]:s[correct?"correct":"wrong"]+1}));
  },[answered,w]);

  const next=useCallback(()=>{
    const nx=idx+1;
    if(nx>=deck.length){setDone(true);return}
    setIdx(nx);setAnswered(false);setSelected(null);
  },[idx,deck.length]);

  useEffect(()=>{
    const fn=e=>{
      if(answered&&e.code==="Space"){e.preventDefault();next();return}
      if(!answered){
        const map={a:0,b:1,c:2,d:3};
        const i=map[e.key.toLowerCase()];
        if(i!=null&&opts[i])answer(opts[i]);
      }
    };
    window.addEventListener("keydown",fn);
    return()=>window.removeEventListener("keydown",fn);
  },[answered,opts,next,answer]);

  if(!deck.length){
    return(
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,padding:"60px 20px",textAlign:"center"}}>
        <div style={{fontSize:44}}>🎉</div>
        <div style={{fontFamily:"var(--serif)",fontSize:22,color:"var(--text)"}}>沒有可測驗的單字</div>
        <div style={{fontFamily:"var(--mono)",fontSize:14,color:"var(--muted)"}}>先去學習模式學幾個單字吧！</div>
        <button onClick={onDone} style={{marginTop:4,padding:"10px 24px",borderRadius:10,border:"1px solid rgba(96,200,240,.3)",background:"rgba(96,200,240,.06)",color:"var(--accent2)",fontFamily:"var(--sans)",fontSize:14,cursor:"pointer"}}>回首頁</button>
      </div>
    );
  }
  if(done){
    const total=stats.correct+stats.wrong,acc=Math.round(stats.correct/total*100)||0;
    return(
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:20,padding:"60px 20px",textAlign:"center"}}>
        <div style={{fontSize:48}}>{acc>=80?"🏆":acc>=60?"💪":"📚"}</div>
        <div style={{fontFamily:"var(--serif)",fontSize:26,color:"var(--accent)"}}>測驗完成！</div>
        <div style={{fontSize:16,color:"var(--muted)",lineHeight:1.8}}>
          答對 <strong style={{color:"var(--accent)"}}>{stats.correct}</strong> / {total} 題　正確率 <strong style={{color:"var(--accent)"}}>{acc}%</strong>
        </div>
        <button onClick={()=>{SESSION.clear("quiz");onDone()}} style={{padding:"10px 28px",borderRadius:10,border:"1px solid rgba(200,240,96,.3)",background:"rgba(200,240,96,.06)",color:"var(--accent)",fontFamily:"var(--sans)",fontSize:14,cursor:"pointer"}}>回首頁</button>
  const keys=["A","B","C","D"],isCorrect=selected===w.word;

  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:14,padding:"20px 20px 48px",width:"100%",maxWidth:620,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,width:"100%"}}>
        <div className="progress-track"><div className="progress-fill" style={{width:`${(idx/deck.length)*100}%`}}/></div>
        <span style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--muted)"}}>{idx+1} / {deck.length}</span>
      </div>

      <div style={{width:"100%",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:16,padding:"28px 24px",display:"flex",flexDirection:"column",alignItems:"center",gap:10,textAlign:"center",position:"relative"}}>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 50% 30%,rgba(200,240,96,.05),transparent 60%)",borderRadius:16,pointerEvents:"none"}}/>
        <span style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--accent)",background:"rgba(200,240,96,.1)",padding:"3px 10px",borderRadius:20,border:"1px solid rgba(200,240,96,.2)",zIndex:1}}>{w.pos}</span>
        <div style={{fontFamily:"var(--serif)",fontSize:"clamp(38px,8vw,62px)",color:"var(--text)",lineHeight:1,zIndex:1}}>{w.word}</div>
        <div style={{display:"flex",alignItems:"center",gap:8,zIndex:1}}>
          <span style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--muted)"}}>{w.phonetic}</span>
          <SpeakBtn word={w.word}/>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,width:"100%"}}>
        {opts.map((opt,i)=>{
          let cls="opt-btn";
          if(answered){
            if(opt.word===w.word)cls+=" "+(selected===w.word&&opt.word===selected?"opt-correct":"opt-reveal");
            else if(opt.word===selected)cls+=" opt-wrong";
          }
          return(
            <button key={opt.word} className={cls} disabled={answered} onClick={()=>answer(opt)}>
              <span style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--dim)",background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:4,padding:"1px 6px",flexShrink:0,marginTop:2}}>{keys[i]}</span>
              <span style={{fontSize:16,lineHeight:1.5}}>{opt.definition_zh}</span>
            </button>
          );
        })}
      </div>

      {answered&&(
        <div style={{width:"100%",background:isCorrect?"rgba(200,240,96,.06)":"rgba(240,100,100,.05)",border:`1px solid ${isCorrect?"rgba(200,240,96,.2)":"rgba(240,100,100,.18)"}`,borderRadius:12,padding:"14px 18px"}}>
          <div style={{fontFamily:"var(--serif)",fontSize:15,color:isCorrect?"var(--accent)":"var(--text)",marginBottom:4}}>
            {isCorrect?"✓ 正確！":"✗ 正確答案："+w.definition_zh}
          </div>
          <div style={{fontSize:14,color:"var(--muted)",lineHeight:1.6}}>{w.mnemonic.story_zh}</div>
        </div>
      )}
      {answered&&(
        <button onClick={next} style={{width:"100%",padding:"12px 0",borderRadius:10,border:"1px solid rgba(200,240,96,.3)",background:"rgba(200,240,96,.06)",color:"var(--accent)",fontFamily:"var(--sans)",fontSize:14,cursor:"pointer"}}>
          下一題 → <span style={{fontFamily:"var(--mono)",fontSize:16,opacity:.6}}>Space</span>
        </button>
      )}
      <div style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--dim)"}}>A B C D 選題　答完後 Space 下一題</div>
      <div style={{display:"flex",gap:8,width:"100%"}}>
        <button className="session-btn danger" onClick={()=>setConfirmCancel(true)} style={{flex:1}}>取消測驗</button>
        <button className="session-btn primary" onClick={saveAndExit} style={{flex:1}}>下次繼續</button>
      </div>
      {confirmCancel&&<ConfirmDialog
        title="取消測驗？"
        desc="取消之後，本次進度將不會保留在首頁。確定取消？"
        onConfirm={()=>{SESSION.clear("quiz");onDone()}}
        onCancel={()=>setConfirmCancel(false)}
      />}
    </div>
  );
}

// ── SYNONYM TOOLTIP ──
function SynonymTooltip({synonyms}){
  const[show,setShow]=useState(false);
  if(!synonyms||!synonyms.length)return null;
  return(
    <div className="syn-tooltip-wrap"
      onMouseEnter={()=>setShow(true)}
      onMouseLeave={()=>setShow(false)}
      onClick={e=>e.stopPropagation()}>
      <span className="syn-btn">同</span>
      {show&&(
        <div className="syn-tip">
          <div className="syn-tip-label">同義詞</div>
          <div className="syn-tip-chips">
            {synonyms.map(s=><span key={s} className="syn-chip">{s}</span>)}
          </div>
        </div>
      )}
    </div>
  );
}

// ── BOOK ──
function BookScreen({vocab}){
  const[filter,setFilter]=useState("all");
  const[subType,setSubType]=useState(null);
  const[subVal,setSubVal]=useState(null);
  const[modalIdx,setModalIdx]=useState(null);

  const statusLabel={new:"未學習",learning:"學習中",due:"待複習",mastered:"已熟練"};
  const statusStyle={
    new:{background:"var(--surface2)",color:"var(--dim)",border:"1px solid var(--border)"},
    learning:{background:"rgba(240,160,96,.1)",color:"var(--orange)",border:"1px solid rgba(240,160,96,.2)"},
    due:{background:"rgba(240,100,100,.1)",color:"var(--red)",border:"1px solid rgba(240,100,100,.2)"},
    mastered:{background:"rgba(200,240,96,.1)",color:"var(--accent)",border:"1px solid rgba(200,240,96,.2)"},
  };

  const allInitials=[...new Set(vocab.map(w=>w.word[0].toUpperCase()))].sort();
  const allRoots=[...new Set(vocab.flatMap(w=>w.roots.map(r=>r.root)))].sort();
  const allTags=[...new Set(vocab.flatMap(w=>w.tags||[]))].sort();
  const allSynonyms=[...new Set(vocab.flatMap(w=>w.synonyms||[]))].sort();

  const fsrsAll=FSRS.all();
  let words=vocab;
  if(filter==="due")words=words.filter(w=>FSRS.isDue(w.word)&&fsrsAll[w.word]);
  else if(filter==="mastered")words=words.filter(w=>FSRS.get(w.word).interval>=7);
  else if(filter==="new")words=words.filter(w=>!fsrsAll[w.word]);
  if(subType==="initial"&&subVal)words=words.filter(w=>w.word[0].toUpperCase()===subVal);
  if(subType==="root"&&subVal)words=words.filter(w=>w.roots.some(r=>r.root===subVal));
  if(subType==="tag"&&subVal)words=words.filter(w=>(w.tags||[]).includes(subVal));
  if(subType==="synonym"&&subVal)words=words.filter(w=>(w.synonyms||[]).includes(subVal));

  const modal=modalIdx!==null?words[modalIdx]:null;
  const closeModal=()=>setModalIdx(null);
  const prevModal=()=>setModalIdx(i=>i>0?i-1:words.length-1);
  const nextModal=()=>setModalIdx(i=>i<words.length-1?i+1:0);
  const clearSub=()=>{setSubType(null);setSubVal(null);setModalIdx(null)};
  const toggleSubType=t=>{if(subType===t){clearSub()}else{setSubType(t);setSubVal(null);setModalIdx(null)}};
  const selectSubVal=v=>{setSubVal(v===subVal?null:v);setModalIdx(null)};

  useEffect(()=>{
    if(modalIdx===null)return;
    const fn=e=>{
      if(e.key==="ArrowLeft"){e.preventDefault();prevModal()}
      else if(e.key==="ArrowRight"){e.preventDefault();nextModal()}
      else if(e.key==="Escape"){closeModal()}
    };
    window.addEventListener("keydown",fn);
    return()=>window.removeEventListener("keydown",fn);
  },[modalIdx,words.length]);

  const sbBase={fontFamily:"var(--mono)",fontSize:16,padding:"3px 9px",borderRadius:5,cursor:"pointer",border:"1px solid var(--border)",background:"transparent",color:"var(--muted)",transition:"all .15s"};
  const sbActive={...sbBase,background:"var(--surface2)",color:"var(--text)",borderColor:"var(--muted)"};
  const chipBase={fontFamily:"var(--mono)",fontSize:16,padding:"3px 9px",borderRadius:5,cursor:"pointer",border:"1px solid var(--border)",background:"transparent",color:"var(--dim)",transition:"all .15s"};
  const chipActive={...chipBase,background:"rgba(200,240,96,.1)",color:"var(--accent)",borderColor:"rgba(200,240,96,.3)"};

  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10,padding:"20px 20px 48px",width:"100%",maxWidth:700,margin:"0 auto"}}>

      {/* 主篩選 */}
      <div style={{display:"flex",alignItems:"center",width:"100%",gap:8}}>
        <span style={{fontFamily:"var(--serif)",fontSize:26,color:"var(--text)"}}>單字本</span>
        <div style={{display:"flex",gap:5,marginLeft:"auto",flexWrap:"wrap"}}>
          {[["all","全部"],["due","待複習"],["mastered","已熟練"],["new","未學習"]].map(([f,l])=>(
            <button key={f} onClick={()=>{setFilter(f);setModalIdx(null)}}
              style={{fontFamily:"var(--mono)",fontSize:16,padding:"4px 10px",borderRadius:6,border:`1px solid ${filter===f?"var(--muted)":"var(--border)"}`,background:filter===f?"var(--surface2)":"transparent",color:filter===f?"var(--text)":"var(--muted)",cursor:"pointer"}}>
              {l}
            </button>
          ))}
        </div>
      </div>

      {/* 次級篩選 type bar */}
      <div style={{display:"flex",alignItems:"center",width:"100%",gap:6,flexWrap:"wrap"}}>
        <span style={{fontFamily:"var(--mono)",fontSize:14,color:"var(--dim)"}}>篩選</span>
        {[["initial","字首"],["root","字根"]].map(([t,l])=>(
          <button key={t} style={subType===t?sbActive:sbBase} onClick={()=>toggleSubType(t)}>{l}</button>
        ))}
        {(subType||subVal)&&(
          <button onClick={clearSub} style={{fontFamily:"var(--mono)",fontSize:16,padding:"3px 9px",borderRadius:5,cursor:"pointer",border:"1px solid rgba(240,100,100,.3)",background:"rgba(240,100,100,.06)",color:"var(--red)"}}>
            清除 ✕
          </button>
        )}
        <span style={{marginLeft:"auto",fontFamily:"var(--mono)",fontSize:16,color:"var(--dim)"}}>{words.length} 筆</span>
      </div>

      {/* 次級篩選 values */}
      {subType==="initial"&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:5,width:"100%"}}>
          {allInitials.map(c=><button key={c} style={subVal===c?chipActive:chipBase} onClick={()=>selectSubVal(c)}>{c}</button>)}
        </div>
      )}
      {subType==="root"&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:5,width:"100%",maxHeight:112,overflowY:"auto",paddingRight:4}}>
          {allRoots.map(r=><button key={r} style={subVal===r?chipActive:chipBase} onClick={()=>selectSubVal(r)}>{r}</button>)}
        </div>
      )}


      {/* 單字列表 */}
      {words.length===0
        ?<div style={{fontSize:16,color:"var(--muted)",padding:"40px 0"}}>沒有符合條件的單字</div>
        :words.map((w,i)=>{
          const status=getStatus(w.word),p=FSRS.get(w.word);
          return(
            <div key={w.word} className="book-item" onClick={()=>setModalIdx(i)}>
              <span style={{fontFamily:"var(--serif)",fontSize:21,color:"var(--text)",minWidth:120}}>{w.word}</span>
              <SynonymTooltip synonyms={w.synonyms||[]}/>
              <span onClick={e=>{e.stopPropagation();Audio_.speak(w.word,null,null)}}
                title="播放發音" style={{fontSize:16,cursor:"pointer",color:"var(--dim)",flexShrink:0,userSelect:"none",padding:"2px 4px",borderRadius:4}}>🔊</span>
              <span style={{fontSize:14,color:"var(--muted)",flex:1}}>{w.definition_zh}</span>
              {p.reps>0&&<span style={{fontFamily:"var(--mono)",fontSize:14,color:"var(--dim)"}}>{p.interval}d</span>}
            </div>
          );
        })
      }

      {/* Modal */}
      {modal&&(
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)closeModal()}}>
          <div className="modal-box">
            <button className="modal-close" onClick={closeModal}>✕</button>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
              <div style={{fontFamily:"var(--serif)",fontSize:32,color:"var(--accent)"}}>{modal.word}</div>
              <SpeakBtn word={modal.word}/>
            </div>
            <div style={{fontFamily:"var(--mono)",fontSize:14,color:"var(--muted)",marginBottom:12}}>{modal.phonetic} · {modal.pos}</div>
            <div style={{fontSize:16,color:"var(--text)",lineHeight:1.6}}>{modal.definition}</div>
            <div style={{fontSize:14,color:"var(--muted)",marginBottom:14}}>{modal.definition_zh}</div>
            <div className="divider"/>
            <div style={{fontFamily:"var(--mono)",fontSize:14,color:"var(--dim)",textTransform:"uppercase",marginBottom:8}}>字根</div>
            <RootChips roots={modal.roots}/>
            <div className="divider" style={{marginTop:12}}/>
            <div style={{fontFamily:"var(--mono)",fontSize:14,color:"var(--dim)",textTransform:"uppercase",marginBottom:8}}>記憶聯想</div>
            <div style={{fontSize:21,letterSpacing:5,marginBottom:8}}>{modal.mnemonic.emojis.join("  ")}</div>
            <div style={{fontSize:14,color:"var(--text)",lineHeight:1.6}}>{modal.mnemonic.story_en}</div>
            <div style={{fontSize:14,color:"var(--muted)",lineHeight:1.6,marginTop:4}}>{modal.mnemonic.story_zh}</div>
            {modal.synonyms&&modal.synonyms.length>0&&(
              <>
                <div className="divider" style={{marginTop:12}}/>
                <div style={{fontFamily:"var(--mono)",fontSize:14,color:"var(--dim)",textTransform:"uppercase",marginBottom:6}}>同義詞</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                  {modal.synonyms.map(s=>(
                    <span key={s} style={{fontFamily:"var(--mono)",fontSize:16,background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:5,padding:"2px 8px",color:"var(--muted)"}}>{s}</span>
                  ))}
                </div>
              </>
            )}
            {(()=>{const p=FSRS.get(modal.word);return p.reps
              ?<div style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--dim)",marginTop:12}}>複習 {p.reps} 次　間隔 {p.interval} 天</div>
              :<div style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--dim)",marginTop:24,textAlign:"center",lineHeight:2}}>
              此篩選條件下沒有單字<br/>
              <span style={{fontSize:13,opacity:.6}}>試試其他篩選條件</span>
            </div>
            })()}
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:20,paddingTop:14,borderTop:"1px solid var(--border)"}}>
              <button onClick={prevModal} style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:8,padding:"7px 14px",color:"var(--muted)",fontFamily:"var(--sans)",fontSize:16,cursor:"pointer"}}>← 上一個</button>
              <span style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--dim)"}}>{modalIdx+1} / {words.length}</span>
              <button onClick={nextModal} style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:8,padding:"7px 14px",color:"var(--muted)",fontFamily:"var(--sans)",fontSize:16,cursor:"pointer"}}>下一個 →</button>
            </div>
            <div style={{fontFamily:"var(--mono)",fontSize:14,color:"var(--dim)",textAlign:"center",marginTop:8}}>← → 鍵切換　Esc 關閉</div>
          </div>
        </div>
      )}
    </div>
  );
}
// ── CONFIRM DIALOG ──
function ConfirmDialog({title,desc,onConfirm,onCancel}){
  return(
    <div className="confirm-overlay">
      <div className="confirm-box">
        <div style={{fontFamily:"var(--serif)",fontSize:26,color:"var(--text)"}}>{title}</div>
        <div style={{fontSize:16,color:"var(--muted)",lineHeight:1.7}}>{desc}</div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button className="session-btn" onClick={onCancel}>再想想</button>
          <button className="session-btn danger" onClick={onConfirm}>確定取消</button>
        </div>
      </div>
    </div>
  );
}

// ── RESUME CARD ──
function ResumeCard({type,session,onResume}){
  const label=type==="learn"?"學習":"測驗";
  const pct=Math.round((session.idx/session.deck.length)*100);
  const accent=type==="learn"?"var(--accent)":"var(--accent2)";
  const accentAlpha=type==="learn"?"rgba(200,240,96,.12)":"rgba(96,200,240,.09)";
  const borderColor=type==="learn"?"rgba(200,240,96,.2)":"rgba(96,200,240,.18)";
  return(
    <>
      <div
        onClick={onResume}
        style={{background:`linear-gradient(135deg,${accentAlpha},var(--surface))`,border:`1px solid ${borderColor}`,borderRadius:14,padding:"18px 20px",display:"flex",flexDirection:"column",gap:10,cursor:"pointer",transition:"all .2s",userSelect:"none"}}
      >
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontFamily:"var(--mono)",fontSize:14,color:"var(--dim)",letterSpacing:".06em",textTransform:"uppercase",marginBottom:4}}>📌 上次{label}紀錄</div>
            <div style={{fontFamily:"var(--serif)",fontSize:16,color:"var(--text)"}}>{label}模式</div>
          </div>
          <span style={{fontFamily:"var(--mono)",fontSize:16,color:accent}}>{session.idx} / {session.deck.length} {type==="learn"?"張":"題"}　{pct}%</span>
        </div>
        <div className="resume-progress">
          <div className="resume-progress-fill" style={{width:pct+"%",background:accent}}/>
        </div>
        <div style={{fontFamily:"var(--mono)",fontSize:14,color:"var(--dim)"}}>點擊繼續 →</div>
      </div>
    </>
  );
}

// ── MODE CARD ──
function ModeCard({m,session,onNavigate}){
  const[confirm,setConfirm]=useState(false);
  const handleClick=()=>{
    if(session){setConfirm(true)}
    else{onNavigate(m.id)}
  };
  const label=m.id==="learn"?"學習":"測驗";
  return(
    <>
      <div
        onClick={handleClick}
        style={{background:`linear-gradient(135deg,${m.bg},var(--surface))`,border:`1px solid ${m.bc}`,borderRadius:14,padding:"20px 18px",cursor:"pointer",display:"flex",flexDirection:"column",gap:10,transition:"all .2s",userSelect:"none",flex:1}}>
        <div style={{fontSize:26}}>{m.icon}</div>
        <div style={{fontFamily:"var(--serif)",fontSize:16,color:"var(--text)"}}>{m.title}</div>
        <div style={{fontSize:14,color:"var(--muted)",lineHeight:1.6,flex:1}}>{m.desc}</div>
        <div style={{fontFamily:"var(--mono)",fontSize:16,color:m.ac,marginTop:4}}>{m.count}</div>
      </div>
      {confirm&&<ConfirmDialog
        title={"開新的"+label+"？"}
        desc={"你有一份進行中的"+label+"紀錄。取消紀錄後才能開新一輪，確定繼續？"}
        onConfirm={()=>{SESSION.clear(m.id);onNavigate(m.id);setConfirm(false)}}
        onCancel={()=>setConfirm(false)}
      />}
    </>
  );
}

// ── BRUTAL (殘酷二選一) ──
function BrutalScreen({vocab,onDone}){
  const mistakes=MISTAKES.list();
  const[idx,setIdx]=useState(0);
  const[answered,setAnswered]=useState(false);
  const[selected,setSelected]=useState(null);
  const[stats,setStats]=useState({correct:0,wrong:0});
  const[done,setDone]=useState(false);
  const[deck]=useState(()=>shuffle(mistakes));

  const item=deck[idx];
  // Find vocab objects
  const correctWord=item?vocab.find(v=>v.word===item.word):null;
  const wrongWord=item?vocab.find(v=>v.word===item.wrongWord):null;
  const opts=item?shuffle([
    {word:item.word,definition_zh:item.correctDef},
    {word:item.wrongWord,definition_zh:item.wrongDef},
  ]):[];

  const answer=useCallback(opt=>{
    if(answered||!item)return;
    setAnswered(true);setSelected(opt.word);
    const correct=opt.word===item.word;
    MISTAKES.answer(item.word,correct);
    FSRS.save(item.word,correct?"good":"again");
    setStats(s=>({...s,[correct?"correct":"wrong"]:s[correct?"correct":"wrong"]+1}));
  },[answered,item]);

  const next=useCallback(()=>{
    const nx=idx+1;
    if(nx>=deck.length){setDone(true);return}
    setIdx(nx);setAnswered(false);setSelected(null);
  },[idx,deck.length]);

  useEffect(()=>{
    const fn=e=>{
      if(answered&&e.code==="Space"){e.preventDefault();next()}
      if(!answered&&opts.length===2){
        if(e.key==="a"||e.key==="1")answer(opts[0]);
        if(e.key==="b"||e.key==="2")answer(opts[1]);
      }
    };
    window.addEventListener("keydown",fn);
    return()=>window.removeEventListener("keydown",fn);
  },[answered,opts,next,answer]);

  if(!deck.length||done){
    const total=stats.correct+stats.wrong;
    const acc=total?Math.round(stats.correct/total*100):0;
    const remaining=MISTAKES.count();
    return(
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:20,padding:"60px 20px",textAlign:"center"}}>
        <div style={{fontSize:48}}>{acc>=80?"💪":"💀"}</div>
        <div style={{fontFamily:"var(--serif)",fontSize:26,color:"var(--red)"}}>挑戰結束！</div>
        <div style={{fontSize:16,color:"var(--muted)",lineHeight:1.8}}>
          答對 <strong style={{color:"var(--accent)"}}>{stats.correct}</strong> / {total} 題<br/>
          {remaining>0?<span>還有 <strong style={{color:"var(--red)"}}>{remaining}</strong> 個單字待征服</span>:<span style={{color:"var(--accent)"}}>🎉 全部清零！</span>}
        </div>
        <button onClick={onDone} style={{padding:"10px 28px",borderRadius:10,border:"1px solid rgba(240,100,100,.3)",background:"rgba(240,100,100,.06)",color:"var(--red)",fontFamily:"var(--sans)",fontSize:14,cursor:"pointer"}}>回首頁</button>
      </div>
    );
  }

  const missingWord=item&&(!correctWord||!wrongWord);
  useEffect(()=>{
    if(!missingWord)return;
    const all=JSON.parse(localStorage.getItem("wr_mistakes")||"{}");
    delete all[item.word];
    localStorage.setItem("wr_mistakes",JSON.stringify(all));
    next();
  },[missingWord]);

  if(!item){return null;}
  if(missingWord){return null;}
  const isCorrect=selected===item.word;
  const keys=["A","B"];

  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:14,padding:"20px 20px 48px",width:"100%",maxWidth:580,margin:"0 auto"}}>
      {/* progress */}
      <div style={{display:"flex",alignItems:"center",gap:10,width:"100%"}}>
        <div style={{flex:1,height:3,background:"var(--border)",borderRadius:2,overflow:"hidden"}}>
          <div style={{height:"100%",background:"var(--red)",borderRadius:2,width:`${(idx/deck.length)*100}%`,transition:"width .4s"}}/>
        </div>
        <span style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--muted)"}}>{idx+1} / {deck.length}</span>
      </div>

      {/* word card */}
      <div style={{width:"100%",background:"linear-gradient(135deg,rgba(240,100,100,.06),var(--surface))",border:"1px solid rgba(240,100,100,.25)",borderRadius:16,padding:"28px 24px",display:"flex",flexDirection:"column",alignItems:"center",gap:10,textAlign:"center",position:"relative"}}>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 50% 30%,rgba(240,100,100,.05),transparent 60%)",borderRadius:16,pointerEvents:"none"}}/>
        <span style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--red)",background:"rgba(240,100,100,.1)",padding:"3px 10px",borderRadius:20,border:"1px solid rgba(240,100,100,.2)",zIndex:1}}>💀 殘酷二選一</span>
        <div style={{fontFamily:"var(--serif)",fontSize:"clamp(44px,9vw,68px)",color:"var(--text)",lineHeight:1,zIndex:1}}>{item.word}</div>
        <div style={{display:"flex",alignItems:"center",gap:8,zIndex:1}}>
          <span style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--muted)"}}>{correctWord.phonetic}</span>
          <SpeakBtn word={item.word}/>
        </div>
        <div style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--dim)",zIndex:1}}>連續答對 {item.streak||0} / 2 次可移除</div>
      </div>

      {/* two options */}
      <div style={{display:"flex",flexDirection:"column",gap:10,width:"100%"}}>
        {opts.map((opt,i)=>{
          let style={background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"16px 18px",cursor:answered?"default":"pointer",display:"flex",gap:10,alignItems:"flex-start",transition:"all .15s",width:"100%",color:"var(--text)",fontFamily:"var(--sans)",textAlign:"left"};
          if(answered){
            if(opt.word===item.word) style={...style,borderColor:"var(--accent)",background:"rgba(200,240,96,.1)"};
            else if(opt.word===selected) style={...style,borderColor:"var(--red)",background:"rgba(240,100,100,.08)"};
          }
          return(
            <button key={opt.word} style={style} disabled={answered} onClick={()=>answer(opt)}>
              <span style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--dim)",background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:4,padding:"1px 6px",flexShrink:0,marginTop:2}}>{keys[i]}</span>
              <span style={{fontSize:14,lineHeight:1.5}}>{opt.definition_zh}</span>
            </button>
          );
        })}
      </div>

      {/* feedback */}
      {answered&&(
        <div style={{width:"100%",background:isCorrect?"rgba(200,240,96,.06)":"rgba(240,100,100,.05)",border:`1px solid ${isCorrect?"rgba(200,240,96,.2)":"rgba(240,100,100,.18)"}`,borderRadius:12,padding:"14px 18px"}}>
          <div style={{fontFamily:"var(--serif)",fontSize:15,color:isCorrect?"var(--accent)":"var(--red)",marginBottom:4}}>
            {isCorrect?`✓ 正確！連續 ${(item.streak||0)} / 2 次`:"✗ 再加油！連續紀錄重置"}
          </div>
          <div style={{fontSize:14,color:"var(--muted)",lineHeight:1.6}}>{correctWord.mnemonic.story_zh}</div>
        </div>
      )}
      {answered&&(
        <button onClick={next} style={{width:"100%",padding:"12px 0",borderRadius:10,border:"1px solid rgba(240,100,100,.3)",background:"rgba(240,100,100,.06)",color:"var(--red)",fontFamily:"var(--sans)",fontSize:14,cursor:"pointer"}}>
          下一題 → <span style={{fontFamily:"var(--mono)",fontSize:16,opacity:.6}}>Space</span>
        </button>
      )}
      <div style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--dim)"}}>A / B 選題　答完後 Space 下一題</div>
    </div>
  );
}

// ── HOME ──
function HomeScreen({vocab,onNavigate,onResumeLearn,onResumeQuiz,learnSession,quizSession,refreshSessions,onBrutal}){
  const s=FSRS.stats(),due=vocab.filter(w=>FSRS.isDue(w.word));
  const modes=[
    {id:"learn",icon:"🃏",title:"學習模式",desc:"翻卡片看聯想故事，適合第一次學新單字",count:`待學 ${due.length} 張`,bc:"rgba(200,240,96,.25)",bg:"rgba(200,240,96,.04)",ac:"var(--accent)"},
    {id:"quiz",icon:"🎯",title:"測驗模式",desc:"四選一選擇題，主動回憶記憶更牢",count:`可測 ${Math.min(due.length+5,vocab.length)} 題`,bc:"rgba(96,200,240,.2)",bg:"rgba(96,200,240,.04)",ac:"var(--accent2)"},
  ];
  const sessions=[learnSession,quizSession];
  const resumes=[onResumeLearn,onResumeQuiz];
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:20,padding:"36px 20px"}}>
      <div style={{fontFamily:"var(--serif)",fontSize:32,textAlign:"center",color:"var(--text)",lineHeight:1.4}}>
        今天來練習<span style={{color:"var(--accent)"}}> {due.length} </span>個單字？
      </div>
      {/* 雙排網格：左學習，右測驗 */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,width:"100%",maxWidth:600}}>
        {modes.map((m,i)=>(
          <div key={m.id} style={{display:"flex",flexDirection:"column",gap:10}}>
            {/* 模式啟動卡 — 整張可點，有紀錄時彈窗確認 */}
            <ModeCard m={m} session={sessions[i]} onNavigate={onNavigate}/>
            {/* 紀錄卡 — 有紀錄才出現 */}
            {sessions[i]&&<ResumeCard
              type={m.id}
              session={sessions[i]}
              onResume={resumes[i]}
            />}
          </div>
        ))}
      </div>
      {/* 殘酷二選一 card */}
      {MISTAKES.count()>0&&(
        <div
          onClick={onBrutal}
          style={{width:"100%",maxWidth:600,background:"linear-gradient(135deg,rgba(240,100,100,.07),var(--surface))",border:"1px solid rgba(240,100,100,.25)",borderRadius:14,padding:"18px 20px",cursor:"pointer",display:"flex",alignItems:"center",gap:16,transition:"all .2s",userSelect:"none"}}>
          <div style={{fontSize:32}}>💀</div>
          <div style={{flex:1}}>
            <div style={{fontFamily:"var(--serif)",fontSize:16,color:"var(--text)",marginBottom:3}}>殘酷二選一</div>
            <div style={{fontSize:14,color:"var(--muted)"}}>你有 <strong style={{color:"var(--red)"}}>{MISTAKES.count()}</strong> 個答錯的單字待挑戰</div>
          </div>
          <div style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--red)"}}>挑戰 →</div>
        </div>
      )}
      {vocab.length>0&&(
        <div style={{fontFamily:"var(--mono)",fontSize:16,color:"var(--dim)"}}>
          已學 {s.total} 字　熟練 {s.mastered} 字　資料庫 {vocab.length} 字
        </div>
      )}
    </div>
  );
}

// ── APP ──
function App(){
  const[vocab,setVocab]=useState([]);
  const[loading,setLoading]=useState(true);
  const[tab,setTab]=useState("home");
  const[mistakeCount,setMistakeCount]=useState(()=>MISTAKES.count());
  const[learnResume,setLearnResume]=useState(null);
  const[quizResume,setQuizResume]=useState(null);
  const[learnSession,setLearnSession]=useState(()=>SESSION.load("learn"));
  const[quizSession,setQuizSession]=useState(()=>SESSION.load("quiz"));

  useEffect(()=>{
    const urls=[
      "./data/vocab_batch_001.json",
      // "./data/vocab_batch_002.json",
    ];
    Promise.all(urls.map(u=>fetch(u).then(r=>{
      if(!r.ok)throw new Error(u);
      return r.json();
    })))
    .then(results=>{setVocab(results.flat());setLoading(false);})
    .catch(err=>{console.error("Vocab load error:",err);setLoading(false);setVocab(null);});
  },[]);

  const refreshSessions=()=>{
    setLearnSession(SESSION.load("learn"));
    setQuizSession(SESSION.load("quiz"));
    setMistakeCount(MISTAKES.count());
  };

  const goHome=()=>{setTab("home");refreshSessions();setLearnResume(null);setQuizResume(null);setMistakeCount(MISTAKES.count())};
  const startLearn=()=>{setLearnResume(null);setTab("learn")};
  const startQuiz=()=>{setQuizResume(null);setTab("quiz")};
  const resumeLearn=()=>{setLearnResume(SESSION.load("learn"));setTab("learn")};
  const resumeQuiz=()=>{setQuizResume(SESSION.load("quiz"));setTab("quiz")};

  const tabs=[["home","首頁"],["book","單字本"]];
  return(
    <div style={{minHeight:"100vh",background:"var(--bg)",color:"var(--text)",fontFamily:"var(--sans)",display:"flex",flexDirection:"column",alignItems:"center"}}>
      <header style={{width:"100%",maxWidth:800,padding:"18px 20px 0",display:"flex",alignItems:"center",gap:12}}>
        <span style={{fontFamily:"var(--serif)",fontSize:26,color:"var(--accent)",flexShrink:0}}>
          WordRoot <span style={{fontStyle:"italic",fontSize:16,color:"var(--muted)"}}>字根記憶</span>
        </span>
        <nav style={{display:"flex",gap:4,marginLeft:"auto"}}>
          {tabs.map(([id,label])=>(
            <button key={id} className={"nav-btn"+(tab===id?" active":"")} onClick={()=>setTab(id)}>{label}</button>
          ))}
        </nav>
      </header>
      <div style={{width:"100%",maxWidth:800}}>
        {loading?(
          <div style={{textAlign:"center",padding:"80px 20px",fontFamily:"var(--mono)",fontSize:16,color:"var(--muted)"}}>
            <div style={{fontSize:32,marginBottom:12}}>⏳</div>
            載入單字資料中…
          </div>
        ):vocab===null?(
          <div style={{textAlign:"center",padding:"80px 20px",display:"flex",flexDirection:"column",alignItems:"center",gap:12}}>
            <div style={{fontSize:40}}>⚠️</div>
            <div style={{fontFamily:"var(--serif)",fontSize:22,color:"var(--text)"}}>資料載入失敗</div>
            <div style={{fontFamily:"var(--mono)",fontSize:14,color:"var(--muted)"}}>請確認網路連線並重新整理頁面</div>
            <button onClick={()=>window.location.reload()} style={{marginTop:8,padding:"10px 24px",borderRadius:10,border:"1px solid rgba(200,240,96,.3)",background:"rgba(200,240,96,.06)",color:"var(--accent)",fontFamily:"var(--sans)",fontSize:14,cursor:"pointer"}}>重新整理</button>
          </div>
        ):vocab.length===0?(
          <div style={{textAlign:"center",padding:"80px 20px",display:"flex",flexDirection:"column",alignItems:"center",gap:12}}>
            <div style={{fontSize:40}}>📭</div>
            <div style={{fontFamily:"var(--serif)",fontSize:22,color:"var(--text)"}}>單字庫是空的</div>
            <div style={{fontFamily:"var(--mono)",fontSize:14,color:"var(--muted)"}}>請上傳 vocab_batch_001.json 到 data/ 資料夾</div>
          </div>
        ):(
          <>
            {tab==="home"&&<HomeScreen
              vocab={vocab}
              onNavigate={id=>id==="learn"?startLearn():startQuiz()}
              onResumeLearn={resumeLearn}
              onResumeQuiz={resumeQuiz}
              learnSession={learnSession}
              quizSession={quizSession}
              refreshSessions={refreshSessions}
              onBrutal={()=>setTab("brutal")}
            />}
            {tab==="brutal"&&<BrutalScreen key="brutal" vocab={vocab} onDone={goHome}/>}
            {tab==="learn"&&<LearnScreen key={"learn"+(learnResume?"r":"n")} vocab={vocab} resumeData={learnResume} onDone={goHome}/>}
            {tab==="quiz"&&<QuizScreen key={"quiz"+(quizResume?"r":"n")} vocab={vocab} resumeData={quizResume} onDone={goHome}/>}
            {tab==="book"&&<BookScreen vocab={vocab}/>}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
