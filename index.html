<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordRoot — 字根記憶單字卡</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--accent:#c8f060;--accent2:#60c8f0;--red:#f06464;--orange:#f0a060;--bg:#0e0f11;--surface:#16181c;--surface2:#1e2026;--border:#2a2d35;--text:#e8eaf0;--muted:#6b7080;--dim:#3a3f50;--serif:'DM Serif Display',serif;--mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
::selection{background:transparent}
html,body,#root{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans)}
.flip-scene{perspective:1200px;cursor:pointer;width:100%;aspect-ratio:16/9}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .52s cubic-bezier(.4,0,.2,1)}
.flip-inner.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden;border:1px solid var(--border)}
.flip-back{transform:rotateY(180deg)}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card-enter{animation:cardIn .28s ease both}
.opt-btn{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:all .15s;text-align:left;width:100%;color:var(--text);font-family:var(--sans)}
.opt-btn:hover:not(:disabled){border-color:var(--muted);background:var(--surface2)}
.opt-btn:disabled{cursor:default}
.opt-correct{border-color:var(--accent)!important;background:rgba(200,240,96,.1)!important}
.opt-wrong{border-color:var(--red)!important;background:rgba(240,100,100,.08)!important}
.opt-reveal{border-color:rgba(200,240,96,.3)!important;background:rgba(200,240,96,.04)!important}
@keyframes speakPulse{from{box-shadow:0 0 0 0 rgba(96,200,240,.4)}to{box-shadow:0 0 0 7px rgba(96,200,240,0)}}
.speaking{animation:speakPulse .6s ease infinite alternate}
.book-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s;width:100%;text-align:left;font-family:var(--sans);color:var(--text)}
.book-item:hover{background:var(--surface2);border-color:var(--muted)}
.nav-btn{font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:6px;cursor:pointer;letter-spacing:.04em;transition:all .15s;border:1px solid var(--border);background:transparent;color:var(--muted)}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{background:var(--surface2);color:var(--text);border-color:var(--muted)}
.rate-btn{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-family:var(--sans);font-size:13px;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--muted)}
.rate-btn:disabled{opacity:.4;cursor:default}
.rate-btn.again{border-color:rgba(240,100,100,.3);color:var(--red)}
.rate-btn.good{border-color:rgba(200,240,96,.3);color:var(--accent)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:500px;max-height:82vh;overflow-y:auto;padding:24px;position:relative}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
.progress-track{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.tag{font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 7px}
.divider{height:1px;background:var(--border);margin:10px 0}
.syn-tooltip-wrap{position:relative;display:inline-flex;align-items:center;flex-shrink:0}
.syn-btn{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);color:var(--dim);cursor:default;user-select:none;line-height:1.4;transition:all .15s}
.syn-btn:hover{border-color:var(--accent2);color:var(--accent2);background:rgba(96,200,240,.08)}
.syn-tip{position:absolute;left:0;top:calc(100% + 6px);z-index:50;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-width:180px;max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.4);pointer-events:none}
.syn-tip-label{font-family:var(--mono);font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.syn-tip-chips{display:flex;flex-wrap:wrap;gap:4px}
.syn-chip{font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:var(--muted)}
.resume-card{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:18px 20px;cursor:pointer;transition:all .2s;width:100%;text-align:left;font-family:var(--sans);color:var(--text);display:flex;flex-direction:column;gap:10px}
.resume-card:hover{border-color:var(--muted);background:var(--surface2)}
.resume-progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden;width:100%}
.resume-progress-fill{height:100%;border-radius:2px;transition:width .4s}
.session-btn{padding:9px 18px;border-radius:8px;font-family:var(--sans);font-size:13px;cursor:pointer;transition:all .18s;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
.session-btn:hover{background:var(--surface2);color:var(--text)}
.session-btn.primary{border-color:rgba(200,240,96,.3);background:rgba(200,240,96,.06);color:var(--accent)}
.session-btn.primary:hover{background:rgba(200,240,96,.12)}
.session-btn.danger{border-color:rgba(240,100,100,.25);color:var(--red)}
.session-btn.danger:hover{background:rgba(240,100,100,.08);border-color:rgba(240,100,100,.4)}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback}=React;

// ── VOCAB DATA ──
const VOCAB_DATA=[{"word":"abandon","pos":"verb","definition":"To leave behind or give up completely, often under stressful or difficult circumstances; to desert someone or something you are responsible for.","definition_zh":"完全放棄；遺棄；拋棄","phonetic":"/əˈbændən/","roots":[{"root":"a-","origin":"Latin","meaning":"to/toward","meaning_zh":"向、往"},{"root":"bandon","origin":"Old French","meaning":"control/jurisdiction","meaning_zh":"控制、管轄"}],"mnemonic":{"story_en":"A BAND ON the road just walked away and left all their heavy equipment behind — they decided to abandon the tour because it was too exhausting.","story_zh":"一個樂團（A BAND）在巡演途中突然把所有樂器丟在路（ON the road）上走人，決定徹底「放棄」這場令人疲憊的演出。","emojis":["🎸","🚶‍♂️💨","🗑️"]},"example":"Due to the rising water levels, the driver had no choice but to abandon her car in the middle of the flood.","frequency_rank":1,"tags":["college","common","TOEFL"],"synonyms":["forsake","desert","relinquish","discard","surrender","jettison"]},{"word":"abolish","pos":"verb","definition":"To formally and officially put an end to a system, practice, or institution, typically through legal or political means.","definition_zh":"廢除（制度、法律等）；宣告無效","phonetic":"/əˈbɒlɪʃ/","roots":[{"root":"ab-","origin":"Latin","meaning":"away/removing","meaning_zh":"離開、去除"},{"root":"olere","origin":"Latin","meaning":"to grow","meaning_zh":"生長"}],"mnemonic":{"story_en":"A BULL ISH law was so stubbornly unfair and powerful like an angry bull that the citizens organized a massive protest to abolish it.","story_zh":"那條法律像公牛（BULL）一樣蠻橫（ISH），人民忍無可忍，決定起義將這項惡法「廢除」。","emojis":["🐂","⚖️❌","✊"]},"example":"Slavery was finally abolished in the United States after years of intense political struggle and a bloody civil war.","frequency_rank":2,"tags":["college","history","politics","GRE"],"synonyms":["eliminate","annul","repeal","eradicate","revoke","nullify"]},{"word":"abstract","pos":"adjective","definition":"Existing in thought or as an idea but not having a physical or concrete existence; difficult to understand because of its complexity.","definition_zh":"抽象的；非具體的；深奧的","phonetic":"/ˈæbstrækt/","roots":[{"root":"abs-","origin":"Latin","meaning":"away from","meaning_zh":"離開"},{"root":"trahere","origin":"Latin","meaning":"to pull/draw","meaning_zh":"拉、拖"}],"mnemonic":{"story_en":"ABS TRACT — imagine trying to pull (tract) your physical abs away from your body to place them on a table. You can't do it physically — it's an abstract idea!","story_zh":"想像你想把腹肌（ABS）從身體裡拉（TRACT）出來單獨觀察，這在現實中是不可能的——因為這只是一個「抽象」的概念。","emojis":["💭","🖼️","🌀"]},"example":"The concept of beauty is purely abstract and varies significantly from one culture to another.","frequency_rank":3,"tags":["college","academic","art","IELTS"],"synonyms":["theoretical","conceptual","intangible","notional","abstruse","idealistic"]},{"word":"accelerate","pos":"verb","definition":"To increase in speed or cause something to happen more quickly than originally expected.","definition_zh":"加速；促進；提前","phonetic":"/əkˈsɛləreɪt/","roots":[{"root":"ac-","origin":"Latin","meaning":"toward","meaning_zh":"向、往"},{"root":"celer","origin":"Latin","meaning":"swift/fast","meaning_zh":"快速"}],"mnemonic":{"story_en":"AC + CELERY + ATE — a competitive race car driver ate a magical piece of celery and his vehicle suddenly accelerated to lightning speed.","story_zh":"賽車手在吃了（ATE）特製芹菜（CELERY）後，車子瞬間開始「加速」，化作一道閃電。","emojis":["🥬","🏎️💨","⚡"]},"example":"Technological advancements in AI are expected to accelerate economic growth across the globe over the next decade.","frequency_rank":4,"tags":["college","science","common","business"],"synonyms":["hasten","quicken","expedite","speed up","advance","precipitate"]},{"word":"accommodate","pos":"verb","definition":"To provide lodging or sufficient space for someone; to fit in with or adjust to the particular needs or wishes of others.","definition_zh":"容納；提供住宿；配合需求；使適應","phonetic":"/əˈkɒmədeɪt/","roots":[{"root":"ac-","origin":"Latin","meaning":"toward","meaning_zh":"向、往"},{"root":"commodus","origin":"Latin","meaning":"fitting/suitable","meaning_zh":"合適、便利"}],"mnemonic":{"story_en":"A COMMA DATE — when planning a group date, you must put commas between everyone's busy schedules to accommodate their different needs.","story_zh":"安排多人聚會（DATE）時，必須在不同人的時間表裡加逗號（COMMA）留空檔，才能「配合」並「容納」大家的各種需求。","emojis":["🏨","🤝","📅"]},"example":"The grand ballroom is large enough to accommodate more than 500 guests for the wedding ceremony.","frequency_rank":5,"tags":["college","common","travel","TOEFL"],"synonyms":["adapt","adjust","house","oblige","comply","shelter"]},{"word":"accumulate","pos":"verb","definition":"to gather or build up gradually over time","definition_zh":"積累；逐漸增加","phonetic":"/əˈkjuːmjəleɪt/","roots":[{"root":"ac-","origin":"Latin","meaning":"toward","meaning_zh":"向"},{"root":"cumulus","origin":"Latin","meaning":"heap/pile","meaning_zh":"堆積"}],"mnemonic":{"story_en":"A KUMQUAT LATE — kumquats kept piling up because they arrived late and accumulated in the corner.","story_zh":"金桔（KUMQUAT）一直遲到（LATE），堆在角落越來越多，就這樣積累成一座小山。","emojis":["🍊","📦📦📦","⏫"]},"example":"Dust accumulates quickly if you don't clean regularly.","frequency_rank":6,"tags":["college","common","finance"],"synonyms":["gather","amass","collect","stockpile","build up"]},{"word":"accurate","pos":"adjective","definition":"correct in all details; exact","definition_zh":"精確的；準確的","phonetic":"/ˈækjərət/","roots":[{"root":"ac-","origin":"Latin","meaning":"toward","meaning_zh":"向"},{"root":"cura","origin":"Latin","meaning":"care","meaning_zh":"細心、照料"}],"mnemonic":{"story_en":"ACU + RATE — an acupuncturist rates each needle placement carefully to be accurate.","story_zh":"針灸師（ACU）仔細評估（RATE）每一針的位置，務求精確。","emojis":["🎯","📐","✅"]},"example":"The weather forecast was accurate this time.","frequency_rank":7,"tags":["college","common","science"],"synonyms":["precise","exact","correct","meticulous","truthful"]},{"word":"achieve","pos":"verb","definition":"to successfully reach a desired goal or result","definition_zh":"達到；實現（目標）","phonetic":"/əˈtʃiːv/","roots":[{"root":"a-","origin":"Old French","meaning":"to","meaning_zh":"向"},{"root":"chief","origin":"Old French: chef","meaning":"head/top","meaning_zh":"頂端、首位"}],"mnemonic":{"story_en":"A CHIEF who climbs to the top has achieved their goal — reaching the head position.","story_zh":"酋長（CHIEF）爬上頂峰，達成目標——登上首位，成就非凡。","emojis":["🏆","🧗","👑"]},"example":"She achieved her dream of becoming a doctor.","frequency_rank":8,"tags":["college","common"],"synonyms":["accomplish","attain","fulfill","realize","reach"]},{"word":"acknowledge","pos":"verb","definition":"to accept or admit the existence or truth of something","definition_zh":"承認；認可；致謝","phonetic":"/əkˈnɒlɪdʒ/","roots":[{"root":"ac-","origin":"Old English","meaning":"toward","meaning_zh":"向"},{"root":"knowledge","origin":"Old English: cnawan","meaning":"to know","meaning_zh":"知道"}],"mnemonic":{"story_en":"AC + KNOWLEDGE — to face toward knowledge and admit you know something. That's acknowledging it.","story_zh":"面向知識（KNOWLEDGE）並承認你知道——這就是「認可、承認」的動作。","emojis":["🙋","📖","✅"]},"example":"He acknowledged his mistake in front of the team.","frequency_rank":9,"tags":["college","common","social"],"synonyms":["recognize","admit","concede","affirm","accept"]},{"word":"adapt","pos":"verb","definition":"to become adjusted to new conditions; to modify","definition_zh":"適應；改編；調整","phonetic":"/əˈdæpt/","roots":[{"root":"ad-","origin":"Latin","meaning":"toward","meaning_zh":"向"},{"root":"aptus","origin":"Latin","meaning":"fitted/suited","meaning_zh":"合適"}],"mnemonic":{"story_en":"A DAP T-shirt — you adapt your outfit to fit any situation, always apt for the moment.","story_zh":"一件百搭（DAP）的T恤，無論什麼場合都能適應——這就是ADAPT。","emojis":["🦎","🔄","🌍"]},"example":"Animals must adapt to survive in changing environments.","frequency_rank":10,"tags":["college","science","common"],"synonyms":["adjust","conform","modify","acclimate","tailor"]},{"word":"adequate","pos":"adjective","definition":"satisfactory or acceptable in quality or quantity","definition_zh":"足夠的；適當的","phonetic":"/ˈædɪkwət/","roots":[{"root":"ad-","origin":"Latin","meaning":"toward","meaning_zh":"向"},{"root":"aequus","origin":"Latin","meaning":"equal/level","meaning_zh":"平等、足夠"}],"mnemonic":{"story_en":"ADD E QUIT — add just enough to not quit. That's adequate — enough to keep going.","story_zh":"加（ADD）剛好夠讓你不放棄（QUIT）的量——這就是「adequate」，剛剛好。","emojis":["⚖️","✅","📊"]},"example":"Make sure you get adequate sleep before the exam.","frequency_rank":11,"tags":["college","common"],"synonyms":["sufficient","satisfactory","acceptable","passable","ample"]},{"word":"adjacent","pos":"adjective","definition":"next to or adjoining something else","definition_zh":"相鄰的；毗連的","phonetic":"/əˈdʒeɪsənt/","roots":[{"root":"ad-","origin":"Latin","meaning":"near/toward","meaning_zh":"靠近"},{"root":"jacere","origin":"Latin","meaning":"to lie/throw","meaning_zh":"躺著、靠著"}],"mnemonic":{"story_en":"A JAY SENT next door — a blue jay was sent to live in the adjacent nest.","story_zh":"一隻藍鵲（JAY）被派（SENT）到隔壁的巢——住在相鄰的地方。","emojis":["🏠🏠","↔️","📍"]},"example":"The library is adjacent to the main building.","frequency_rank":12,"tags":["college","math","common"],"synonyms":["neighboring","adjoining","bordering","nearby","contiguous"]},{"word":"advocate","pos":"verb/noun","definition":"to publicly support or recommend; a person who supports a cause","definition_zh":"倡導；擁護者；辯護人","phonetic":"/ˈædvəkeɪt/","roots":[{"root":"ad-","origin":"Latin","meaning":"toward","meaning_zh":"向"},{"root":"vocare","origin":"Latin","meaning":"to call/voice","meaning_zh":"呼喚、發聲"}],"mnemonic":{"story_en":"ADD A VOICE + ATE — an advocate adds their voice to the table and eats with those they fight for.","story_zh":"倡導者（ADVOCATE）為弱勢加上一把聲音（VOICE），和他們同桌而食。","emojis":["📢","✊","⚖️"]},"example":"She advocates for equal rights in education.","frequency_rank":13,"tags":["college","politics","social"],"synonyms":["support","champion","promote","endorse","uphold"]},{"word":"ambiguous","pos":"adjective","definition":"open to more than one interpretation; unclear","definition_zh":"模糊的；有歧義的","phonetic":"/æmˈbɪɡjuəs/","roots":[{"root":"ambi-","origin":"Latin","meaning":"both/around","meaning_zh":"兩邊、周圍"},{"root":"agere","origin":"Latin","meaning":"to drive/act","meaning_zh":"驅動、行動"}],"mnemonic":{"story_en":"AMBI + GU + OUS — ambidextrous people can go either way, just like ambiguous sentences.","story_zh":"雙手靈巧（AMBI）的人兩邊都能用，模糊的（AMBIGUOUS）句子也是兩邊都說得通。","emojis":["🤔","↔️","❓❓"]},"example":"His answer was ambiguous — we couldn't tell if he agreed.","frequency_rank":14,"tags":["college","academic","language"],"synonyms":["vague","unclear","equivocal","cryptic","obscure"]},{"word":"ambitious","pos":"adjective","definition":"having a strong desire for success or achievement","definition_zh":"有抱負的；雄心勃勃的","phonetic":"/æmˈbɪʃəs/","roots":[{"root":"ambi-","origin":"Latin","meaning":"around","meaning_zh":"到處"},{"root":"ire","origin":"Latin","meaning":"to go","meaning_zh":"前進"}],"mnemonic":{"story_en":"AM BITCH US — an ambitious person aggressively goes after every goal, running in all directions.","story_zh":"有抱負的人四處奔走（AMBI-去四方）爭取目標，鬥志高昂。","emojis":["🏃","🎯","🌟"]},"example":"She is ambitious and plans to become CEO by 30.","frequency_rank":15,"tags":["college","common","personality"],"synonyms":["aspiring","driven","determined","motivated","enterprising"]},{"word":"analyze","pos":"verb","definition":"to examine something in detail to understand it","definition_zh":"分析；細查","phonetic":"/ˈænəlaɪz/","roots":[{"root":"ana-","origin":"Greek","meaning":"up/throughout","meaning_zh":"向上、徹底"},{"root":"lyein","origin":"Greek","meaning":"to loosen/dissolve","meaning_zh":"分解、鬆開"}],"mnemonic":{"story_en":"ANA + LYZE — Ana loosens every knot to analyze what's inside each one.","story_zh":"安娜（ANA）把每個結都解開（LYZE），仔細分析裡面裝著什麼。","emojis":["🔬","🧩","📊"]},"example":"Scientists analyze data to find patterns.","frequency_rank":16,"tags":["college","academic","science"],"synonyms":["examine","investigate","assess","evaluate","dissect"]},{"word":"anticipate","pos":"verb","definition":"to expect or predict something before it happens","definition_zh":"預期；期待；預見","phonetic":"/ænˈtɪsɪpeɪt/","roots":[{"root":"anti-","origin":"Latin","meaning":"before","meaning_zh":"提前、事先"},{"root":"capere","origin":"Latin","meaning":"to take/seize","meaning_zh":"抓取"}],"mnemonic":{"story_en":"ANTI + CAPE — a superhero prepares their anti-cape before the villain arrives, anticipating the attack.","story_zh":"超級英雄事先準備好反斗篷（ANTI-CAPE），提前預見（ANTICIPATE）了反派的到來。","emojis":["🦸","🔮","⏰"]},"example":"We anticipate high demand for the new product.","frequency_rank":17,"tags":["college","common","business"],"synonyms":["expect","foresee","predict","await","envision"]},{"word":"apparent","pos":"adjective","definition":"clearly visible or understood; obvious","definition_zh":"明顯的；表面上的","phonetic":"/əˈpærənt/","roots":[{"root":"ap-","origin":"Latin","meaning":"toward","meaning_zh":"向"},{"root":"parere","origin":"Latin","meaning":"to appear/show","meaning_zh":"出現、顯示"}],"mnemonic":{"story_en":"A PARENT — it's apparent who the parent is at the school play. They're obviously cheering the loudest.","story_zh":"一眼就能認出誰是家長（A PARENT）——他們在學校表演時叫得最大聲，顯而易見。","emojis":["👀","💡","🙋"]},"example":"It was apparent that she hadn't slept.","frequency_rank":18,"tags":["college","common"],"synonyms":["obvious","evident","clear","visible","manifest"]},{"word":"appreciate","pos":"verb","definition":"to recognize the value or quality of something; to be grateful","definition_zh":"欣賞；感激；增值","phonetic":"/əˈpriːʃieɪt/","roots":[{"root":"ap-","origin":"Latin","meaning":"toward","meaning_zh":"向"},{"root":"pretium","origin":"Latin","meaning":"price/value","meaning_zh":"價值、價格"}],"mnemonic":{"story_en":"A PRICE + EAT — you appreciate a meal so much you'd pay any price just to eat it again.","story_zh":"你太感激這頓飯（EAT）了，願意付任何價格（PRICE）再吃一次——這就是「appreciate」。","emojis":["🙏","💛","📈"]},"example":"I really appreciate your help omething is beneficial, it's a good fit for you. It fits you well.","story_zh":"有益的事物就是很合你的（FIT），合身又合意——這就是「benefit」帶來的好處。","emojis":["✅","💰","😊"]},"example":"Exercise has many benefits for your health.","frequency_rank":28,"tags":["college","common","health"],"synonyms":["advantage","gain","asset","merit","profit"]},{"word":"bias","pos":"noun","definition":"an unfair preference or prejudice for or against something","definition_zh":"偏見；偏差；偏向","phonetic":"/ˈbaɪəs/","roots":[{"root":"biais","origin":"Old French","meaning":"oblique/slanted","meaning_zh":"斜的、偏斜"}],"mnemonic":{"story_en":"BY + ASS — judging by someone's ass (appearance) instead of merit is pure bias.","story_zh":"只用外表評判一個人，完全是偏見（BIAS）——走斜路而非直路。","emojis":["⚖️","↗️","🙈"]},"example":"News coverage often shows political bias.","frequency_rank":29,"tags":["college","psychology","social"],"synonyms":["prejudice","partiality","favoritism","skew","predisposition"]},{"word":"capacity","pos":"noun","definition":"the maximum amount something can contain; ability","definition_zh":"容量；能力；資格","phonetic":"/kəˈpæsɪti/","roots":[{"root":"capax","origin":"Latin","meaning":"able to hold","meaning_zh":"能容納"},{"root":"capere","origin":"Latin","meaning":"to take/hold","meaning_zh":"抓取、容納"}],"mnemonic":{"story_en":"CAP + CITY — a city with a cap on how many people it can hold. That cap is its capacity.","story_zh":"一座城市（CITY）戴上帽子（CAP）限制人口——帽子的大小就是它的容量（CAPACITY）。","emojis":["🏙️","🎩","📏"]},"example":"The stadium has a capacity of 80,000 people.","frequency_rank":30,"tags":["college","common","engineering"],"synonyms":["ability","capability","volume","potential","scope"]},{"word":"challenge","pos":"noun/verb","definition":"a difficult task or situation; to question or dispute","definition_zh":"挑戰；質疑；難題","phonetic":"/ˈtʃælɪndʒ/","roots":[{"root":"calumnia","origin":"Latin","meaning":"false accusation","meaning_zh":"誣告、質疑"}],"mnemonic":{"story_en":"CHAL + LENGE — a challenger has long legs (LENGE sounds like long) and always runs dentical","corresponding"]},{"word":"establish","pos":"verb","definition":"to set up or found something on a firm basis","definition_zh":"建立；確立；創立","phonetic":"/ɪˈstæblɪʃ/","roots":[{"root":"ex-","origin":"Latin","meaning":"out","meaning_zh":"出"},{"root":"stabilis","origin":"Latin","meaning":"firm/stable","meaning_zh":"穩固"}],"mnemonic":{"story_en":"E + STABLE + ISH — to establish is to make something stable — like building a sturdy stable.","story_zh":"「establish」就是建造一間穩固的馬廄（STABLE）——把某件事牢牢立起來，讓它站穩。","emojis":["🏛️","🔩","📌"]},"example":"The company was established in 1995.","frequency_rank":66,"tags":["college","common","business"],"synonyms":["create","found","set up","build","institute"]},{"word":"evaluate","pos":"verb","definition":"to assess or judge the value or quality of something","definition_zh":"評估；評價；求值","phonetic":"/ɪˈvæljueɪt/","roots":[{"root":"e-","origin":"Latin","meaning":"out","meaning_zh":"出來"},{"root":"valere","origin":"Latin","meaning":"to be worth","meaning_zh":"有價值"}],"mnemonic":{"story_en":"E + VALUE + ATE — to evaluate is to draw out (e) the value and 'eat' through all the details.","story_zh":"評估（EVALUATE）就是把價值（VALUE）掏出來（E）仔細消化（ATE）——看看它到底值多少。","emojis":["📊","🔍","⭐"]},"example":"The manager evaluates employees every six months.","frequency_rank":67,"tags":["college","academic","business"],"synonyms":["assess","judge","appraise","measure","review"]},{"word":"evidence","pos":"noun","definition":"facts or information indicating whether something is true","definition_zh":"證據；跡象；佐證","phonetic":"/ˈɛvɪdəns/","roots":[{"root":"ex-","origin":"Latin","meaning":"out","meaning_zh":"出來"},{"root":"videre","origin":"Latin","meaning":"to see","meaning_zh":"看見"}],"mnemonic":{"story_en":"EVIDENT + CE — evidence makes things evident (visible). What you see is the evidence.","story_zh":"「evidence」讓事情變得看得見（EVIDENT）——你所見（VIDERE）就是從中浮出（EX）的證據。","emojis":["🔍","📋","👁️"]},"example":"The police found evidence at the crime scene.","frequency_rank":68,"tags":["college","law","science"],"synonyms":["proof","data","indication","support","documentation"]},{"word":"evolve","pos":"verb","definition":"to develop gradually over time through a process of change","definition_zh":"演化；逐漸發展；進化","phonetic":"/ɪˈvɒlv/","roots":[{"root":"e-","origin":"Latin","meaning":"out","meaning_zh":"出來"},{"root":"volvere","origin":"Latin","meaning":"to roll/turn","meaning_zh":"滾動、展開"}],"mnemonic":{"story_en":"E + VOLVE — evolution rolls out (VOLVE) from inside, slowly unfurling like a scroll over time.","story_zh":"演化（EVOLVE）就像一卷（VOLVE）捲軸慢慢展開（E）——歷經時間的滾動而逐漸展現。","emojis":["🐒→🧑","🔄","📜"]},"example":"Technology evolves faster every decade.","frequency_rank":69,"tags":["college","biology","science"],"synonyms":["develop","progress","adapt","change","transform"]},{"word":"explicit","pos":"adjective","definition":"stated clearly and in detail; leaving nothing implied","definition_zh":"明確的；清楚表達的；露骨的","phonetic":"/ɪkˈsplɪsɪt/","roots":[{"root":"ex-","origin":"Latin","meaning":"out","meaning_zh":"出來"},{"root":"plicare","origin":"Latin","meaning":"to fold","meaning_zh":"折疊"}],"mnemonic":{"story_en":"EX + PLICIT — explicit unfolds (EX + PLICIT like 'unpleat') everything out clearly, nothing hidden.","story_zh":"明確（EXPLICIT）就是把所有折疊（PLICARE）起來的東西全部攤開（EX）——毫不隱藏。","emojis":["📖","💬","🔓"]},"example":"The instructions were explicit and easy to follow.","frequency_rank":70,"tags":["college","academic","communication"],"synonyms":["clear","direct","specific","unambiguous","definite"]},{"word":"exploit","pos":"verb/noun","definition":"to make use of unfairly; a bold or daring act","definition_zh":"剝削；利用；功績","phonetic":"/ɪkˈsplɔɪt/","roots":[{"root":"ex-","origin":"Latin","meaning":"out","meaning_zh":"出來"},{"root":"plicare","origin":"Latin","meaning":"to fold/unfold","meaning_zh":"展開"}],"mnemonic":{"story_en":"EX + PLOIT — to exploit is to squeeze out every last profit (ploit sounds like 'pluck') from something.","story_zh":"剝削（EXPLOIT）就是把一切榨（EX）出（PLOIT=摘取）來——把資源或人用到極限。","emojis" example":"Reading is a fundamental skill for all students.","frequency_rank":77,"tags":["college","academic","common"],"synonyms":["basic","essential","core","primary","underlying"]},{"word":"generate","pos":"verb","definition":"to produce or create something","definition_zh":"產生；創造；生成","phonetic":"/ˈdʒɛnəreɪt/","roots":[{"root":"genus","origin":"Latin","meaning":"birth/kind","meaning_zh":"出生、種類"},{"root":"generare","origin":"Latin","meaning":"to beget/produce","meaning_zh":"產生、生育"}],"mnemonic":{"story_en":"GENE + RATE — a gene generates life by replicating at a certain rate. Birth and creation.","story_zh":"基因（GENE）以一定的速率（RATE）複製——「generate」就是以基因為模板，產生新的生命。","emojis":["⚡","🔋","🌱"]},"example":"Solar panels generate electricity from sunlight.","frequency_rank":78,"tags":["college","science","technology"],"synonyms":["produce","create","yield","cause","originate"]},{"word":"global","pos":"adjective","definition":"relating to the whole world; comprehensive","definition_zh":"全球的；全世界的；全面的","phonetic":"/ˈɡləʊbəl/","roots":[{"root":"globus","origin":"Latin","meaning":"sphere/ball","meaning_zh":"球體"}],"mnemonic":{"story_en":"GLOBE + AL — global refers to something that spans the whole globe — every part of the ball.","story_zh":"「global」就是涵蓋整個地球儀（GLOBE）的——覆蓋球體（GLOBUS）每一個角落。","emojis":["🌍🌎🌏","🌐","✈️"]},"example":"Climate change is a global problem.","frequency_rank":79,"tags":["college","common","politics"],"synonyms":["worldwide","universal","international","broad","widespread"]},{"word":"hypothesis","pos":"noun","definition":"a proposed explanation made on limited evidence as a starting point","definition_zh":"假說；假設；推測","phonetic":"/haɪˈpɒθɪsɪs/","roots":[{"root":"hypo-","origin":"Greek","meaning":"under/below","meaning_zh":"在下面"},{"root":"thesis","origin":"Greek","meaning":"a placing/proposition","meaning_zh":"論點、命題"}],"mnemonic":{"story_en":"HYPO + THESIS — a hypothesis is a thesis placed underneath — not yet proven, still below the surface.","story_zh":"假說（HYPOTHESIS）是一個還「放在下面」（HYPO）的論點（THESIS）——尚未浮出水面，有待驗證。","emojis":["🔬","❓","💡"]},"example":"The scientist tested her hypothesis with experiments.","frequency_rank":80,"tags":["college","science","academic"],"synonyms":["theory","assumption","proposition","conjecture","supposition"]},{"word":"identify","pos":"verb","definition":"to recognize and name someone or something","definition_zh":"識別；辨認；認同","phonetic":"/aɪˈdɛntɪfaɪ/","roots":[{"root":"idem","origin":"Latin","meaning":"the same","meaning_zh":"相同"},{"root":"facere","origin":"Latin","meaning":"to make","meaning_zh":"製造"}],"mnemonic":{"story_en":"ID + ENTITY + FY — to identify is to verify the ID of an entity, confirming it's the same one.","story_zh":"識別（IDENTIFY）就是核對一個實體（ENTITY）的身份證（ID）——確認它跟記錄中是同一個。","emojis":["🪪","🔍","✅"]},"example":"Can you identify the bird in this picture?","frequency_rank":81,"tags":["college","science","common"],"synonyms":["recognize","detect","distinguish","spot","pinpoint"]},{"word":"implement","pos":"verb","definition":"to put a plan or decision into effect","definition_zh":"實施；執行；實現","phonetic":"/ˈɪmplɪmɛnt/","roots":[{"root":"im-","origin":"Latin","meaning":"in/into","meaning_zh":"進入"},{"root":"plere","origin":"Latin","meaning":"to fill","meaning_zh":"填充"}],"mnemonic":{"story_en":"IMPLE + MENT — to implement is to fill (IMPLE=implere) a plan into the mental space of reality.","story_zh":"「implement」就是把計畫填入（IMPLE=填滿）現實中——讓腦中（MENT）的方案落地執行。","emojis":["🔧","📋→✅","🏗️"]},"example":"The new policy will be implemented next month.","frequency_rank":82,"tags":["college","business","common"],"synonyms":["execute","apply","enforce","enact","carry out"]},{"word":"implicit","pos":"adjective","definition":"implied though not directly expressed","definition_zh":"含蓄的；隱含的；不言而喻的","phonetic":"/ɪmˈplɪsɪt/","roots":[{"root":"im-","origin":"Latin","meaning":"in","meaning_zh":"在…中"},{"root":"plicare","origin":"Latin","meaning":"to fold","meaning_zh":"折疊"}],"mnemonic":{"story_en":"IM + PLICIT — implicit is folded IN — the // ── FSRS-lite ──
const FSRS={
  MULT:{again:.5,hard:1,good:2,easy:4},
  all:()=>JSON.parse(localStorage.getItem("wr_p")||"{}"),
  get(w){const a=this.all();return a[w]||{interval:1,dueDate:null,reps:0}},
  save(word,rating){
    const all=this.all(),prev=all[word]||{interval:1,reps:0};
    const ni=rating==="again"?1:Math.round(prev.interval*this.MULT[rating]*10)/10;
    const due=new Date();due.setDate(due.getDate()+ni);
    all[word]={interval:ni,dueDate:due.toISOString(),reps:(prev.reps||0)+1,lastRating:rating,lastReview:new Date().toISOString()};
    localStorage.setItem("wr_p",JSON.stringify(all));
    return all[word];
  },
  isDue(w){const p=this.get(w);return!p.dueDate||new Date(p.dueDate)<=new Date()},
  stats(){const all=Object.values(this.all()),now=new Date();return{total:all.length,due:all.filter(w=>new Date(w.dueDate)<=now).length,mastered:all.filter(w=>w.interval>=7).length}},
};

// ── Session Storage ──
const SESSION={
  KEY_L:"wr_session_learn",
  KEY_Q:"wr_session_quiz",
  save(type,deck,idx){
    const key=type==="learn"?this.KEY_L:this.KEY_Q;
    localStorage.setItem(key,JSON.stringify({deck,idx,savedAt:new Date().toISOString()}));
  },
  load(type){
    const key=type==="learn"?this.KEY_L:this.KEY_Q;
    const raw=localStorage.getItem(key);
    return raw?JSON.parse(raw):null;
  },
  clear(type){
    localStorage.removeItem(type==="learn"?this.KEY_L:this.KEY_Q);
  },
};

const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const buildDeck=vocab=>{
  const due=vocab.filter(w=>FSRS.isDue(w.word));
  if(due.length>=5)return shuffle(due);
  const seen=new Set(Object.keys(FSRS.all()));
  const unseen=vocab.filter(w=>!seen.has(w.word));
  return shuffle([...due,...unseen.slice(0,Math.max(10,15-due.length))]);
};

const getStatus=word=>{
  const p=FSRS.get(word);
  if(!p.reps)return"new";
  if(p.interval>=7)return"mastered";
  if(FSRS.isDue(word))return"due";
  return"learning";
};

// ── Audio ──
const Audio_={
  _cache:{},_audio:null,
  speak(word,onPlay,onDone){
    onPlay?.();
    this._url(word)
      .then(url=>url?this._mp3(url):this._tts(word))
      .catch(()=>this._tts(word))
      .finally(()=>onDone?.());
  },
  async _url(word){
    if(word in this._cache)return this._cache[word];
    try{
      const r=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`,{signal:AbortSignal.timeout(3000)});
      if(!r.ok)throw 0;
      const d=await r.json();
      const f=(d[0]?.phonetics||[]).find(p=>p.audio?.trim());
      return(this._cache[word]=f?f.audio:null);
    }catch{return(this._cache[word]=null)}
  },
  _mp3(url){
    return new Promise((res,rej)=>{
      if(this._audio){this._audio.pause();this._audio=null}
      const a=new Audio(url);this._audio=a;
      a.onended=res;a.onerror=rej;a.play().catch(rej);
    });
  },
  _tts(word){
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(word);u.lang="en-US";u.rate=.85;
    speechSynthesis.speak(u);
  },
};

// ── LEARN ──
function LearnScreen({vocab,resumeData,onDone}){
  const[deck]=useState(()=>resumeData?resumeData.deck:buildDeck(vocab));
  const[idx,setIdx]=useState(()=>resumeData?resumeData.idx:0);
  const[flipped,setFlipped]=useState(false);
  const[stats,setStats]=useState({again:0,hard:0,good:0,easy:0,skip:0});
  const[done,setDone]=useState(false);
  const[cardKey,setCardKey]=useState(0);
  const[toast,setToast]=useState(null);
  const[confirmCancel,setConfirmCancel]=useState(false);
  const w=deck[idx];
  const prog=w?FSRS.get(w.word):null;

  const saveAndExit=()=>{
    SESSION.save("learn",deck,idx);
    onDone();
  };

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),1200)};

  const advance=useCallback(()=>{
    const next=idx+1;
    if(next>=deck.length){setDone(true);return}
    setFlipped(false);
    setTimeout(()=>{setIdx(next);setCardKey(k=>k+1)},300);
  },[idx,deck.length]);

  const rate=useCallback(rating=>{
    const result=FSRS.save(w.word,rating);
    setStats(s=>({...s,[rating]:s[rating]+1}));
    showToast("📅 "+(result.interval<1?"稍後複習":`${result.interval} 天後複習`));
    advance();
  },[w,advance]);

  const skip=useCallback(()=>{setStats(s=>({...s,skip:s.skip+1}));advance()},[advance]);

  useEffect(()=>{
    const fn=e=>{
      if(e.code==="Space"){e.preventDefault();setFlipped(f=>!f);return}
      if(e.key.toLowerCase()==="n"){e.preventDefault();skip();return}
      if(flipped){
        if(e.key==="1")rate("again");
        else if(e.key==="2")rate("hard");
        else if(e.key==="3")rate("good");
        else if(e.key==="4")rate("easy");
      }
    };
    window.addEventListener("keydown",fn);
    return()=>window.removeEventListener("keydown",fn);
  },[flipped,rate,skip]);

  if(done||!w){
    const s=FSRS.stats();
    return(
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:20,padding:"60px 20px",textAlign:"center"}}>
        <div style={{fontSize:48}}>🎉</div>
        <div style={{fontFamily:"var(--serif)",fontSize:26,color:"var(--accent)"}}>學習完成！</div>
        <div style={{fontSize:13,color:"var(--muted)",lineHeight:1.8}}>
          完成 <strong style={{color:"var(--accent)"}}>{deck.length}</strong> 張<br/>
          再複習 {stats.again}　有點難 {stats.hard}　記住了 {stats.good}　太簡單 {stats.easy}　跳過 {stats.skip}<br/>
          <span style={{color:"var(--dim)",fontSize:12}}>累計 {s.total} 字　熟練 {s.mastered} 字</span>
        </div>
        <button onClick={onDone} style={{padding:"10px 28px",borderRadius:10,border:"1px solid rgba(200,240,96,.3)",background:"rgba(200,240,96,.06)",color:"var(--accent)",fontFamily:"var(--sans)",fontSize:14,cursor:"pointer"}}>回首頁</button>
      </div>
    );
  }

  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,padding:"20px 20px 48px",width:"100%",maxWidth:660,margin:"0 auto"}}>
      {/* progress */}
      <div style={{display:"flex",alignItems:"center",gap:10,width:"100%"}}>
        <div className="progress-track"><div className="progress-fill" style={{width:`${(idx/deck.length)*100}%`}}/></div>
        <span style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--muted)",whiteSpace:"nowrap"}}>{idx} / {deck.length}</span>
      </div>

      {/* flip card */}
      <div className="flip-scene" onClick={()=>setFlipped(f=>!f)}>
        <div className={"flip-inner"+(flipped?" flipped":"")}>
          {/* FRONT */}
          <div className={"flip-face card-enter"} key={"front"+cardKey}
            style={{background:"var(--surface)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,padding:"40px 32px",userSelect:"none"}}>
            <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 30% 40%,rgba(200,240,96,.06),transparent 60%)",borderRadius:16,pointerEvents:"none"}}/>
            <span style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--accent)",background:"rgba(200,240,96,.1)",padding:"3px 10px",borderRadius:20,border:"1px solid rgba(200,240,96,.2)",zIndex:1}}>

            </span>

// ── QUIZ ──
function QuizScreen({vocab,resumeData,onDone}){
  const[deck]=useState(()=>resumeData?resumeData.deck:buildDeck(vocab).slice(0,20));
  const[idx,setIdx]=useState(()=>resumeData?resumeData.idx:0);
  const[opts,setOpts]=useState([]);
  const[answered,setAnswered]=useState(false);
  const[selected,setSelected]=useState(null);
  const[stats,setStats]=useState({correct:0,wrong:0});
  const[done,setDone]=useState(false);
  const[confirmCancel,setConfirmCancel]=useState(false);
  const w=deck[idx];

  const saveAndExit=()=>{
    SESSION.save("quiz",deck,idx);
    onDone();
  };

  useEffect(()=>{
    if(!w)return;
    const dist=shuffle(vocab.filter(v=>v.word!==w.word)).slice(0,3);
    setOpts(shuffle([w,...dist]));
  },[idx]);

  const answer=useCallback(opt=>{
    if(answered)return;
    setAnswered(true);setSelected(opt.word);
    FSRS.save(w.word,opt.word===w.word?"good":"again");
    setStats(s=>({...s,[opt.word===w.word?"correct":"wrong"]:s[opt.word===w.word?"correct":"wrong"]+1}));
  },[answered,w]);

  const next=useCallback(()=>{
    const nx=idx+1;
    if(nx>=deck.length){setDone(true);return}
    setIdx(nx);setAnswered(false);setSelected(null);
  },[idx,deck.length]);

  useEffect(()=>{
    const fn=e=>{
      if(answered&&e.code==="Space"){e.preventDefault();next();return}
      if(!answered){
        const map={a:0,b:1,c:2,d:3};
        const i=map[e.key.toLowerCase()];
        if(i!=null&&opts[i])answer(opts[i]);
      }
    };
    window.addEventListener("keydown",fn);
    return()=>window.removeEventListener("keydown",fn);
  },[answered,opts,next,answer]);

  if(done){
    const total=stats.correct+stats.wrong,acc=Math.round(stats.correct/total*100)||0;
    return(
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:20,padding:"60px 20px",textAlign:"center"}}>
        <div style={{fontSize:48}}>{acc>=80?"🏆":acc>=60?"💪":"📚"}</div>
        <div style={{fontFamily:"var(--serif)",fontSize:26,color:"var(--accent)"}}>測驗完成！</div>
        <div style={{fontSize:13,color:"var(--muted)",lineHeight:1.8}}>
          答對 <strong style={{color:"var(--accent)"}}>{stats.correct}</strong> / {total} 題　正確率 <strong style={{color:"var(--accent)"}}>{acc}%</strong>
        </div>
        <button onClick={onDone} style={{padding:"10px 28px",borderRadius:10,border:"1px solid rgba(200,240,96,.3)",background:"rgba(200,240,96,.06)",color:"var(--accent)",fontFamily:"var(--sans)",fontSize:14,cursor:"pointer"}}>回首頁</button>
      </div>
    );
  }

  if(!w||!opts.length)return null;
  const keys=["A","B","C","D"],isCorrect=selected===w.word;

  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:14,padding:"20px 20px 48px",width:"100%",maxWidth:620,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,width:"100%"}}>
        <div className="progress-track"><div className="progress-fill" style={{width:`${(idx/deck.length)*100}%`}}/></div>
        <span style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--muted)"}}>{idx+1} / {deck.length}</span>
      </div>

      <div style={{width:"100%",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:16,padding:"28px 24px",display:"flex",flexDirection:"column",alignItems:"center",gap:10,textAlign:"center",position:"relative"}}>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 50% 30%,rgba(200,240,96,.05),transparent 60%)",borderRadius:16,pointerEvents:"none"}}/>
        <span style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--accent)",background:"rgba(200,240,96,.1)",padding:"3px 10px",borderRadius:20,border:"1px solid rgba(200,240,96,.2)",zIndex:1}}>{w.pos}</span>
        <div style={{fontFamily:"var(--serif)",fontSize:"clamp(38px,8vw,62px)",color:"var(--text)",lineHeight:1,zIndex:1}}>{w.word}</div>
        <div style={{display:"flex",alignItems:"center",gap:8,zIndex:1}}>
          <span style={{fontFamily:"var(--mono)",fontSize:13,color:"var(--muted)"}}>{w.phonetic}</span>
          <SpeakBtn word={w.word}/>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,width:"100%"}}>
        {opts.map((opt,i)=>{
          let cls="opt-btn";
          if(answered){
            if(opt.word===w.word)cls+=" "+(selected===w.word&&opt.word===selected?"opt-correct":"opt-reveal");
            else if(opt.word===selected)cls+=" opt-wrong";
          }
          return(
            <button key={opt.word} className={cls} disabled={answered} onClick={()=>answer(opt)}>
              <span style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--dim)",background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:4,padding:"1px 6px",flexShrink:0,marginTop:2}}>{keys[i]}</span>
              <span style={{fontSize:13,lineHeight:1.5}}>{opt.definition_zh}</span>
            </button>
          );
        })}
      </div>

      {answered&&(
        <div style={{width:"100%",background:isCorrect?"rgba(200,240,96,.06)":"rgba(240,100,100,.05)",border:`1px solid ${isCorrect?"rgba(200,240,96,.2)":"rgba(240,100,100,.18)"}`,borderRadius:12,padding:"14px 18px"}}>
          <div style={{fontFamily:"var(--serif)",fontSize:15,color:isCorrect?"var(--accent)":"var(--text)",marginBottom:4}}>
            {isCorrect?"✓ 正確！":"✗ 正確答案："+w.definition_zh}
          </div>
          <div style={{fontSize:12,color:"var(--muted)",lineHeight:1.6}}>{w.mnemonic.story_zh}</div>
        </div>
      )}
      {answered&&(
        <button onClick={next} style={{width:"100%",padding:"12px 0",borderRadius:10,border:"1px solid rgba(200,240,96,.3)",background:"rgba(200,240,96,.06)",color:"var(--accent)",fontFamily:"var(--sans)",fontSize:14,cursor:"pointer"}}>
          下一題 → <span style={{fontFamily:"var(--mono)",fontSize:11,opacity:.6}}>Space</span>
        </button>
      )}
      <div style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--dim)"}}>A B C D 選題　答完後 Space 下一題</div>
      <div style={{display:"flex",gap:8,width:"100%"}}>
        <button className="session-btn danger" onClick={()=>setConfirmCancel(true)} style={{flex:1}}>取消測驗</button>
        <button className="session-btn primary" onClick={saveAndExit} style={{flex:1}}>下次繼續</button>
      </div>
      {confirmCancel&&<ConfirmDialog
        title="取消測驗？"
        desc="取消之後，本次進度將不會保留在首頁。確定取消？"
        onConfirm={()=>{SESSION.clear("quiz");onDone()}}
        onCancel={()=>setConfirmCancel(false)}
      />}
    </div>
  );
}

// ── SYNONYM TOOLTIP ──
function SynonymTooltip({synonyms}){
  const[show,setShow]=useState(false);
  if(!synonyms||!synonyms.length)return null;
  return(
    <div className="syn-tooltip-wrap"
      onMouseEnter={()=>setShow(true)}
      onMouseLeave={()=>setShow(false)}
      onClick={e=>e.stopPropagation()}>
      <span className="syn-btn">同</span>
      {show&&(
        <div className="syn-tip">
          <div className="syn-tip-label">同義詞</div>
          <div className="syn-tip-chips">
            {synonyms.map(s=><span key={s} className="syn-chip">{s}</span>)}
          </div>
        </div>
      )}
    </div>
  );
}

// ── BOOK ──
function BookScreen({vocab}){
  const[filter,setFilter]=useState("all");
  const[subType,setSubType]=useState(null);
  const[subVal,setSubVal]=useState(null);
  const[modalIdx,setModalIdx]=useState(null);

  const statusLabel={new:"未學習",learning:"學習中",due:"待複習",mastered:"已熟練"};
  const statusStyle={
    new:{background:"var(--surface2)",color:"var(--dim)",border:"1px solid var(--border)"},
    learning:{background:"rgba(240,160,96,.1)",color:"var(--orange)",border:"1px solid rgba(240,160,96,.2)"},
    due:{background:"rgba(240,100,100,.1)",color:"var(--red)",border:"1px solid rgba(240,100,100,.2)"},
    mastered:{background:"rgba(200,240,96,.1)",color:"var(--accent)",border:"1px solid rgba(200,240,96,.2)"},
  };

  const allInitials=[...new Set(vocab.map(w=>w.word[0].toUpperCase()))].sort();
  const allRoots=[...new Set(vocab.flatMap(w=>w.roots.map(r=>r.root)))].sort();
  const allTags=[...new Set(vocab.flatMap(w=>w.tags||[]))].sort();
  const allSynonyms=[...new Set(vocab.flatMap(w=>w.synonyms||[]))].sort();

  const fsrsAll=FSRS.all();
  let words=vocab;
  if(filter==="due")words=words.filter(w=>FSRS.isDue(w.word)&&fsrsAll[w.word]);
  else if(filter==="mastered")words=words.filter(w=>FSRS.get(w.word).interval>=7);
  else if(filter==="new")words=words.filter(w=>!fsrsAll[w.word]);
  if(subType==="initial"&&subVal)words=words.filter(w=>w.word[0].toUpperCase()===subVal);
  if(subType==="root"&&subVal)words=words.filter(w=>w.roots.some(r=>r.root===subVal));
  if(subType==="tag"&&subVal)words=words.filter(w=>(w.tags||[]).includes(subVal));
  if(subType==="synonym"&&subVal)words=words.filter(w=>(w.synonyms||[]).includes(subVal));

  const modal=modalIdx!==null?words[modalIdx]:null;
  const closeModal=()=>setModalIdx(null);
  const prevModal=()=>setModalIdx(i=>i>0?i-1:words.length-1);
  const nextModal=()=>setModalIdx(i=>i<words.length-1?i+1:0);
  const clearSub=()=>{setSubType(null);setSubVal(null);setModalIdx(null)};
  const toggleSubType=t=>{if(subType===t){clearSub()}else{setSubType(t);setSubVal(null);setModalIdx(null)}};
  const selectSubVal=v=>{setSubVal(v===subVal?null:v);setModalIdx(null)};

  useEffect(()=>{
    if(modalIdx===null)return;
    const fn=e=>{
      if(e.key==="ArrowLeft"){e.preventDefault();prevModal()}
      else if(e.key==="ArrowRight"){e.preventDefault();nextModal()}
      else if(e.key==="Escape"){closeModal()}
    };
    window.addEventListener("keydown",fn);
    return()=>window.removeEventListener("keydown",fn);
  },[modalIdx,words.length]);

  const sbBase={fontFamily:"var(--mono)",fontSize:11,padding:"3px 9px",borderRadius:5,cursor:"pointer",border:"1px solid var(--border)",background:"transparent",color:"var(--muted)",transition:"all .15s"};
  const sbActive={...sbBase,background:"var(--surface2)",color:"var(--text)",borderColor:"var(--muted)"};
  const chipBase={fontFamily:"var(--mono)",fontSize:11,padding:"3px 9px",borderRadius:5,cursor:"pointer",border:"1px solid var(--border)",background:"transparent",color:"var(--dim)",transition:"all .15s"};
  const chipActive={...chipBase,background:"rgba(200,240,96,.1)",color:"var(--accent)",borderColor:"rgba(200,240,96,.3)"};

  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10,padding:"20px 20px 48px",width:"100%",maxWidth:700,margin:"0 auto"}}>

      {/* 主篩選 */}
      <div style={{display:"flex",alignItems:"center",width:"100%",gap:8}}>
        <span style={{fontFamily:"var(--serif)",fontSize:22,color:"var(--text)"}}>單字本</span>
        <div style={{display:"flex",gap:5,marginLeft:"auto",flexWrap:"wrap"}}>
          {[["all","全部"],["due","待複習"],["mastered","已熟練"],["new","未學習"]].map(([f,l])=>(
            <button key={f} onClick={()=>{setFilter(f);setModalIdx(null)}}
              style={{fontFamily:"var(--mono)",fontSize:11,padding:"4px 10px",borderRadius:6,border:`1px solid ${filter===f?"var(--muted)":"var(--border)"}`,background:filter===f?"var(--surface2)":"transparent",color:filter===f?"var(--text)":"var(--muted)",cursor:"pointer"}}>
              {l}
            </button>
          ))}
        </div>
      </div>

      {/* 次級篩選 type bar */}
      <div style={{display:"flex",alignItems:"center",width:"100%",gap:6,flexWrap:"wrap"}}>
        <span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--dim)"}}>篩選</span>
        {[["initial","字首"],["root","字根"]].map(([t,l])=>(
          <button key={t} style={subType===t?sbActive:sbBase} onClick={()=>toggleSubType(t)}>{l}</button>
        ))}
        {(subType||subVal)&&(
          <button onClick={clearSub} style={{fontFamily:"var(--mono)",fontSize:11,padding:"3px 9px",borderRadius:5,cursor:"pointer",border:"1px solid rgba(240,100,100,.3)",background:"rgba(240,100,100,.06)",color:"var(--red)"}}>
            清除 ✕
          </button>
        )}
        <span style={{marginLeft:"auto",fontFamily:"var(--mono)",fontSize:11,color:"var(--dim)"}}>{words.length} 筆</span>
      </div>

      {/* 次級篩選 values */}
      {subType==="initial"&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:5,width:"100%"}}>
          {allInitials.map(c=><button key={c} style={subVal===c?chipActive:chipBase} onClick={()=>selectSubVal(c)}>{c}</button>)}
        </div>
      )}
      {subType==="root"&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:5,width:"100%",maxHeight:112,overflowY:"auto",paddingRight:4}}>
          {allRoots.map(r=><button key={r} style={subVal===r?chipActive:chipBase} onClick={()=>selectSubVal(r)}>{r}</button>)}
        </div>
      )}


      {/* 單字列表 */}
      {words.length===0
        ?<div style={{fontSize:13,color:"var(--muted)",padding:"40px 0"}}>沒有符合條件的單字</div>
        :words.map((w,i)=>{
          const status=getStatus(w.word),p=FSRS.get(w.word);
          return(
            <div key={w.word} className="book-item" onClick={()=>setModalIdx(i)}>
              <span style={{fontFamily:"var(--serif)",fontSize:18,color:"var(--text)",minWidth:120}}>{w.word}</span>
              <SynonymTooltip synonyms={w.synonyms||[]}/>
              <span onClick={e=>{e.stopPropagation();Audio_.speak(w.word,null,null)}}
                title="播放發音" style={{fontSize:13,cursor:"pointer",color:"var(--dim)",flexShrink:0,userSelect:"none",padding:"2px 4px",borderRadius:4}}>🔊</span>
              <span style={{fontSize:12,color:"var(--muted)",flex:1}}>{w.definition_zh}</span>
              {p.reps>0&&<span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--dim)"}}>{p.interval}d</span>}
              <span style={{...statusStyle[status],fontFamily:"var(--mono)",fontSize:10,padding:"2px 8px",borderRadius:4,whiteSpace:"nowrap"}}>{statusLabel[status]}</span>
            </div>
          );
        })
      }

      {/* Modal */}
      {modal&&(
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)closeModal()}}>
          <div className="modal-box">
            <button className="modal-close" onClick={closeModal}>✕</button>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
              <div style={{fontFamily:"var(--serif)",fontSize:28,color:"var(--accent)"}}>{modal.word}</div>
              <SpeakBtn word={modal.word}/>
            </div>
            <div style={{fontFamily:"var(--mono)",fontSize:12,color:"var(--muted)",marginBottom:12}}>{modal.phonetic} · {modal.pos}</div>
            <div style={{fontSize:13,color:"var(--text)",lineHeight:1.6}}>{modal.definition}</div>
            <div style={{fontSize:12,color:"var(--muted)",marginBottom:14}}>{modal.definition_zh}</div>
            <div className="divider"/>
            <div style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--dim)",textTransform:"uppercase",marginBottom:8}}>字根</div>
            <RootChips roots={modal.roots}/>
            <div className="divider" style={{marginTop:12}}/>
            <div style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--dim)",textTransform:"uppercase",marginBottom:8}}>記憶聯想</div>
            <div style={{fontSize:18,letterSpacing:5,marginBottom:8}}>{modal.mnemonic.emojis.join("  ")}</div>
            <div style={{fontSize:12,color:"var(--text)",lineHeight:1.6}}>{modal.mnemonic.story_en}</div>
            <div style={{fontSize:12,color:"var(--muted)",lineHeight:1.6,marginTop:4}}>{modal.mnemonic.story_zh}</div>
            {modal.synonyms&&modal.synonyms.length>0&&(
              <>
                <div className="divider" style={{marginTop:12}}/>
                <div style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--dim)",textTransform:"uppercase",marginBottom:6}}>同義詞</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                  {modal.synonyms.map(s=>(
                    <span key={s} style={{fontFamily:"var(--mono)",fontSize:11,background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:5,padding:"2px 8px",color:"var(--muted)"}}>{s}</span>
                  ))}
                </div>
              </>
            )}
            {(()=>{const p=FSRS.get(modal.word);return p.reps
              ?<div style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--dim)",marginTop:12}}>複習 {p.reps} 次　間隔 {p.interval} 天</div>
              :<div style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--dim)",marginTop:12}}>尚未學習</div>
            })()}
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:20,paddingTop:14,borderTop:"1px solid var(--border)"}}>
              <button onClick={prevModal} style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:8,padding:"7px 14px",color:"var(--muted)",fontFamily:"var(--sans)",fontSize:13,cursor:"pointer"}}>← 上一個</button>
              <span style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--dim)"}}>{modalIdx+1} / {words.length}</span>
              <button onClick={nextModal} style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:8,padding:"7px 14px",color:"var(--muted)",fontFamily:"var(--sans)",fontSize:13,cursor:"pointer"}}>下一個 →</button>
            </div>
            <div style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--dim)",textAlign:"center",marginTop:8}}>← → 鍵切換　Esc 關閉</div>
          </div>
        </div>
      )}
    </div>
  );
}
// ── CONFIRM DIALOG ──
function ConfirmDialog({title,desc,onConfirm,onCancel}){
  return(
    <div className="confirm-overlay">
      <div className="confirm-box">
        <div style={{fontFamily:"var(--serif)",fontSize:20,color:"var(--text)"}}>{title}</div>
        <div style={{fontSize:13,color:"var(--muted)",lineHeight:1.7}}>{desc}</div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button className="session-btn" onClick={onCancel}>再想想</button>
          <button className="session-btn danger" onClick={onConfirm}>確定取消</button>
        </div>
      </div>
    </div>
  );
}

// ── RESUME CARD ──
function ResumeCard({type,session,onResume}){
  const label=type==="learn"?"學習":"測驗";
  const pct=Math.round((session.idx/session.deck.length)*100);
  const accent=type==="learn"?"var(--accent)":"var(--accent2)";
  const accentAlpha=type==="learn"?"rgba(200,240,96,.12)":"rgba(96,200,240,.09)";
  const borderColor=type==="learn"?"rgba(200,240,96,.2)":"rgba(96,200,240,.18)";
  return(
    <>
      <div
        onClick={onResume}
        style={{background:`linear-gradient(135deg,${accentAlpha},var(--surface))`,border:`1px solid ${borderColor}`,borderRadius:14,padding:"18px 20px",display:"flex",flexDirection:"column",gap:10,cursor:"pointer",transition:"all .2s",userSelect:"none"}}
      >
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--dim)",letterSpacing:".06em",textTransform:"uppercase",marginBottom:4}}>📌 上次{label}紀錄</div>
            <div style={{fontFamily:"var(--serif)",fontSize:16,color:"var(--text)"}}>{label}模式</div>
          </div>
          <span style={{fontFamily:"var(--mono)",fontSize:11,color:accent}}>{session.idx} / {session.deck.length} {type==="learn"?"張":"題"}　{pct}%</span>
        </div>
        <div className="resume-progress">
          <div className="resume-progress-fill" style={{width:pct+"%",background:accent}}/>
        </div>
        <div style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--dim)"}}>點擊繼續 →</div>
      </div>
    </>
  );
}

// ── MODE CARD ──
function ModeCard({m,session,onNavigate}){
  const[confirm,setConfirm]=useState(false);
  const handleClick=()=>{
    if(session){setConfirm(true)}
    else{onNavigate(m.id)}
  };
  const label=m.id==="learn"?"學習":"測驗";
  return(
    <>
      <div
        onClick={handleClick}
        style={{background:`linear-gradient(135deg,${m.bg},var(--surface))`,border:`1px solid ${m.bc}`,borderRadius:14,padding:"20px 18px",cursor:"pointer",display:"flex",flexDirection:"column",gap:10,transition:"all .2s",userSelect:"none",flex:1}}>
        <div style={{fontSize:26}}>{m.icon}</div>
        <div style={{fontFamily:"var(--serif)",fontSize:16,color:"var(--text)"}}>{m.title}</div>
        <div style={{fontSize:12,color:"var(--muted)",lineHeight:1.6,flex:1}}>{m.desc}</div>
        <div style={{fontFamily:"var(--mono)",fontSize:11,color:m.ac,marginTop:4}}>{m.count}</div>
      </div>
      {confirm&&<ConfirmDialog
        title={"開新的"+label+"？"}
        desc={"你有一份進行中的"+label+"紀錄。取消紀錄後才能開新一輪，確定繼續？"}
        onConfirm={()=>{SESSION.clear(m.id);onNavigate(m.id);setConfirm(false)}}
        onCancel={()=>setConfirm(false)}
      />}
    </>
  );
}

// ── HOME ──
function HomeScreen({vocab,onNavigate,onResumeLearn,onResumeQuiz,learnSession,quizSession,refreshSessions}){
  const s=FSRS.stats(),due=vocab.filter(w=>FSRS.isDue(w.word));
  const modes=[
    {id:"learn",icon:"🃏",title:"學習模式",desc:"翻卡片看聯想故事，適合第一次學新單字",count:`待學 ${due.length} 張`,bc:"rgba(200,240,96,.25)",bg:"rgba(200,240,96,.04)",ac:"var(--accent)"},
    {id:"quiz",icon:"🎯",title:"測驗模式",desc:"四選一選擇題，主動回憶記憶更牢",count:`可測 ${Math.min(due.length+5,vocab.length)} 題`,bc:"rgba(96,200,240,.2)",bg:"rgba(96,200,240,.04)",ac:"var(--accent2)"},
  ];
  const sessions=[learnSession,quizSession];
  const resumes=[onResumeLearn,onResumeQuiz];
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:20,padding:"36px 20px"}}>
      <div style={{fontFamily:"var(--serif)",fontSize:28,textAlign:"center",color:"var(--text)",lineHeight:1.4}}>
        今天來練習<span style={{color:"var(--accent)"}}> {due.length} </span>個單字？
      </div>
      {/* 雙排網格：左學習，右測驗 */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,width:"100%",maxWidth:600}}>
        {modes.map((m,i)=>(
          <div key={m.id} style={{display:"flex",flexDirection:"column",gap:10}}>
            {/* 模式啟動卡 — 整張可點，有紀錄時彈窗確認 */}
            <ModeCard m={m} session={sessions[i]} onNavigate={onNavigate}/>
            {/* 紀錄卡 — 有紀錄才出現 */}
            {sessions[i]&&<ResumeCard
              type={m.id}
              session={sessions[i]}
              onResume={resumes[i]}
            />}
          </div>
        ))}
      </div>
      <div style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--dim)"}}>
        已學 {s.total} 字　熟練 {s.mastered} 字　資料庫 {vocab.length} 字
      </div>
    </div>
  );
}

// ── APP ──
function App(){
  const[tab,setTab]=useState("home");
  const[learnResume,setLearnResume]=useState(null); // {deck,idx} to resume
  const[quizResume,setQuizResume]=useState(null);
  const[learnSession,setLearnSession]=useState(()=>SESSION.load("learn"));
  const[quizSession,setQuizSession]=useState(()=>SESSION.load("quiz"));

  const refreshSessions=()=>{
    setLearnSession(SESSION.load("learn"));
    setQuizSession(SESSION.load("quiz"));
  };

  const goHome=()=>{setTab("home");refreshSessions();setLearnResume(null);setQuizResume(null)};

  const startLearn=()=>{setLearnResume(null);setTab("learn")};
  const startQuiz=()=>{setQuizResume(null);setTab("quiz")};

  const resumeLearn=()=>{
    const s=SESSION.load("learn");
    setLearnResume(s);
    setTab("learn");
  };
  const resumeQuiz=()=>{
    const s=SESSION.load("quiz");
    setQuizResume(s);
    setTab("quiz");
  };

  const tabs=[["home","首頁"],["book","單字本"]];
  return(
    <div style={{minHeight:"100vh",background:"var(--bg)",color:"var(--text)",fontFamily:"var(--sans)",display:"flex",flexDirection:"column",alignItems:"center"}}>
      <header style={{width:"100%",maxWidth:800,padding:"18px 20px 0",display:"flex",alignItems:"center",gap:12}}>
        <span style={{fontFamily:"var(--serif)",fontSize:20,color:"var(--accent)",flexShrink:0}}>
          WordRoot <span style={{fontStyle:"italic",fontSize:13,color:"var(--muted)"}}>字根記憶</span>
        </span>
        <nav style={{display:"flex",gap:4,marginLeft:"auto"}}>
          {tabs.map(([id,label])=>(
            <button key={id} className={"nav-btn"+(tab===id?" active":"")} onClick={()=>setTab(id)}>{label}</button>
          ))}
        </nav>
      </header>
      <div style={{width:"100%",maxWidth:800}}>
        {tab==="home"&&<HomeScreen
          vocab={VOCAB_DATA}
          onNavigate={id=>id==="learn"?startLearn():startQuiz()}
          onResumeLearn={resumeLearn}
          onResumeQuiz={resumeQuiz}
          learnSession={learnSession}
          quizSession={quizSession}
          refreshSessions={refreshSessions}
        />}
        {tab==="learn"&&<LearnScreen key={"learn"+(learnResume?"r":"n")} vocab={VOCAB_DATA} resumeData={learnResume} onDone={goHome}/>}
        {tab==="quiz"&&<QuizScreen key={"quiz"+(quizResume?"r":"n")} vocab={VOCAB_DATA} resumeData={quizResume} onDone={goHome}/>}
        {tab==="book"&&<BookScreen vocab={VOCAB_DATA}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
